const M=id=>MATH.find(t=>t.id===id);
const add=(id,l,...fs)=>M(id).gen[l].push(...fs);

/* m1: số tự nhiên, phân số */
add('m1',1,
()=>{const t=pick([[2,5,'2 và 5','tận cùng là 0'],[3,'','3','tổng các chữ số chia hết cho 3'],[9,'','9','tổng các chữ số chia hết cho 9'],[5,'','5','tận cùng là 0 hoặc 5']]);const d=t[1]?10:t[0];let c;do{c=R(100,9999)}while(c%d);const ds=[];while(ds.length<3){const x=R(100,9999);if(x%d&&!ds.includes(x))ds.push(x)}return QM(`Số nào chia hết cho ${t[2]}?`,[fmt(c),...ds.map(fmt)],0,`Dấu hiệu chia hết cho ${t[2]}: ${t[3]}. Số ${fmt(c)} thỏa mãn.`)},
()=>{const n=R(10000,999999);const s=String(n);const i=R(0,s.length-2);const dg=s[i];const pv=Math.pow(10,s.length-1-i);return QN(`Trong số ${fmt(n)}, chữ số ${dg} ở vị trí thứ ${i+1} (từ trái sang) có giá trị là bao nhiêu?`,+dg*pv,`Chữ số ${dg} thuộc hàng có giá trị ${fmt(pv)}, nên giá trị là ${dg} × ${fmt(pv)} = ${fmt(+dg*pv)}.`)},
()=>{const [a,b]=coprimePair(9),[c,d]=coprimePair(9);if(Math.random()<.5){const [n,m]=redFrac(a*c,b*d);return QF(`Tính rồi rút gọn: ${F(a,b)} × ${F(c,d)}`,n,m,`${F(a,b)} × ${F(c,d)} = ${F(a*c,b*d)}${n!==a*c?' = '+F(n,m):''}.`,{reduced:true})}const [n,m]=redFrac(a*d,b*c);return QF(`Tính rồi rút gọn: ${F(a,b)} : ${F(c,d)}`,n,m,`${F(a,b)} : ${F(c,d)} = ${F(a,b)} × ${F(d,c)} = ${F(a*d,b*c)}${n!==a*d?' = '+F(n,m):''}.`,{reduced:true,hint:'Nhân với phân số đảo ngược.'})},
()=>{const b=R(3,12);let a,c;do{a=R(1,b*2);c=R(1,b*2)}while(a===c||gcd(a,b)>1||gcd(c,b)>1);return QM(`So sánh: ${F(a,b)} … ${F(c,b)}`,a<c?['<','>','=']:['>','<','='],0,`Hai phân số cùng mẫu số, phân số nào có tử số lớn hơn thì lớn hơn.`)});
add('m1',2,
()=>{const b=R(2,9),c=R(2,9),d=R(10,99);const a=R(12,99)*b;return QN(`Tính giá trị biểu thức: ${a} : ${b} × ${c} + ${d}`,a/b*c+d,`Thực hiện từ trái sang phải với nhân, chia trước; cộng sau: ${a} : ${b} = ${fmt(a/b)}; × ${c} = ${fmt(a/b*c)}; + ${d} = ${fmt(a/b*c+d)}.`)},
()=>{if(Math.random()<.5){const tens=R(1,9);const k=(9-tens%9)%9;return QN(`Tìm chữ số thay cho * để số ${tens}*0 chia hết cho cả 5 và 9.`,k,`Tận cùng là 0 nên chia hết cho 5. Để chia hết cho 9, tổng ${tens} + * + 0 phải chia hết cho 9 → * = ${k}.`,{hint:'Chia hết cho 9: tổng các chữ số chia hết cho 9.'})}let a,b,digs;do{a=R(1,9);b=R(0,9);digs=[0,2,4,6,8].filter(k=>(a+b+k)%3===0)}while(digs.length!==1);return QN(`Tìm chữ số chẵn thay cho * để số ${a}${b}* chia hết cho cả 2 và 3.`,digs[0],`* phải chẵn để chia hết cho 2; tổng ${a} + ${b} + * chia hết cho 3 → * = ${digs[0]}.`)});
add('m1',3,
()=>{const n=R(12,98);const X=R(0,9);const Y=n*10+X-n;return QN(`Khi viết thêm chữ số ${X} vào bên phải một số tự nhiên thì số đó tăng thêm ${fmt(Y)} đơn vị. Tìm số đó.`,n,`Viết thêm chữ số ${X} vào bên phải thì số mới = số cũ × 10 + ${X}. Số mới hơn số cũ: số cũ × 9 + ${X} = ${fmt(Y)}. Số cũ × 9 = ${fmt(Y-X)}; số cũ = ${n}.`,{hint:'Số mới bằng số cũ × 10 cộng thêm chữ số viết thêm.'})},
()=>{const N=R(100,600);const d=9+180+3*(N-99);return QN(`Để đánh số trang một quyển sách dày ${N} trang (bắt đầu từ trang 1) cần dùng bao nhiêu chữ số?`,d,`Trang 1–9: 9 chữ số. Trang 10–99: 90 trang × 2 = 180 chữ số. Trang 100–${N}: ${N-99} trang × 3 = ${3*(N-99)} chữ số. Tổng: ${d}.`,{unit:'chữ số',hint:'Chia thành nhóm trang có 1, 2, 3 chữ số.'})},
()=>{const a=R(2,9);const n=10*a+5*a;const k=Math.random()<.5;return k?QN('Tìm số có hai chữ số, biết rằng khi viết thêm chữ số 0 vào giữa hai chữ số của nó thì được số mới gấp 7 lần số ban đầu.',15,'Gọi số đó là ab. a0b = 7 × ab → 100a + b = 70a + 7b → 30a = 6b → b = 5a. Vì b ≤ 9 nên a = 1, b = 5. Số cần tìm: 15.'):QN(`Tổng của hai số là ${fmt(n*11)}. Nếu xóa chữ số 0 ở tận cùng của số lớn thì được số bé. Tìm số lớn.`,n*10,`Số lớn gấp 10 lần số bé. Tổng số phần: 11. Số bé: ${fmt(n*11)} : 11 = ${n}. Số lớn: ${n*10}.`,{hint:'Xóa chữ số 0 ở tận cùng là giảm 10 lần.'})});

/* m2 */
add('m2',1,
()=>{const d=pick([10,100,1000]);const n=R(1,d*3);return QN(`Viết phân số thập phân ${F(n,d)} dưới dạng số thập phân.`,n/d,`${F(n,d)} = ${fmt(n/d)} (mẫu số có ${String(d).length-1} chữ số 0 nên phần thập phân có ${String(d).length-1} chữ số).`)},
()=>{const a=R(1,99),b=R(0,9),c=R(1,9);return QN(`Số thập phân gồm ${a} đơn vị, ${b} phần mười, ${c} phần trăm viết là:`,a+b/10+c/100,`${a} đơn vị → phần nguyên ${a}; ${b} phần mười, ${c} phần trăm → phần thập phân ${b}${c}. Số: ${fmt(a+b/10+c/100)}.`)});
add('m2',2,
()=>{const a=dec(1,9,1),b=dec(1,9,2);return QM(`Chọn dấu thích hợp: ${fmt(a)} … ${fmt(b)}`,a>b?['>','<','=']:a<b?['<','>','=']:['=','<','>'],0,`So sánh phần nguyên, rồi lần lượt hàng phần mười, phần trăm: ${fmt(a)} ${a>b?'>':a<b?'<':'='} ${fmt(b)}.`)});

/* m3 */
add('m3',1,()=>{const a=R(1,9);return QN(`${a} km² = … m²`,a*1000000,`1 km² = 1 000 000 m² nên ${a} km² = ${fmt(a*1000000)} m².`,{unit:'m²'})},
()=>{const a=R(1,9),b=R(1,99);return QN(`${a} dm² ${b} cm² = … dm²`,a+b/100,`${b} cm² = ${fmt(b/100)} dm². Vậy ${a} dm² ${b} cm² = ${fmt(a+b/100)} dm².`,{unit:'dm²'})});
add('m3',3,()=>{const a=R(10,40),k=R(2,5);const P=4*a,newS=(a+k)*(a+k);return QN(`Một mảnh đất hình vuông có chu vi ${P} m. Người ta mở rộng mỗi cạnh thêm ${k} m. Tính diện tích mảnh đất sau khi mở rộng.`,newS,`Cạnh ban đầu: ${P} : 4 = ${a} (m). Cạnh mới: ${a+k} m. Diện tích: ${a+k} × ${a+k} = ${newS} (m²).`,{unit:'m²'})});

/* m4 */
add('m4',1,()=>{const a=dec(10,50,1),b=dec(1,9,1),c=pick([2,4,5]);return QN(`Tính: (${fmt(a)} − ${fmt(b)}) × ${c}`,(a-b)*c,`Trong ngoặc trước: ${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}; × ${c} = ${fmt((a-b)*c)}.`)},
()=>{const p=R(12,95)*1000;const k=dec(1,5,1);return QN(`Mỗi ki-lô-gam táo giá ${fmt(p)} đồng. Mua ${fmt(k)} kg táo hết bao nhiêu tiền?`,p*k,`${fmt(p)} × ${fmt(k)} = ${fmt(p*k)} (đồng).`,{unit:'đồng'})});
add('m4',2,()=>{const x=dec(1,30,1),a=dec(1,9,1),b=pick([2,4,5]);return QN(`Tìm x: (x + ${fmt(a)}) × ${b} = ${fmt(rnd((x+a)*b,3))}`,x,`x + ${fmt(a)} = ${fmt(rnd((x+a)*b,3))} : ${b} = ${fmt(x+a)}; x = ${fmt(x+a)} − ${fmt(a)} = ${fmt(x)}.`,{hint:'Coi (x + '+fmt(a)+') là một thừa số.'})},
()=>{const n=pick([2,4,5]);const arr=Array.from({length:n},()=>dec(1,20,1));const s=rnd(arr.reduce((p,c)=>p+c,0),2);return QN(`Tìm trung bình cộng của các số: ${arr.map(fmt).join('; ')}.`,s/n,`Tổng: ${fmt(s)}. Trung bình cộng: ${fmt(s)} : ${n} = ${fmt(s/n)}.`)});
add('m4',3,()=>{const k=R(2,9);const a=dec(1,9,1);const S=k*(k+1)/2;return QN(`Tính nhanh: ${fmt(a)} × 1 + ${fmt(a)} × 2 + … + ${fmt(a)} × ${k}`,a*S,`= ${fmt(a)} × (1 + 2 + … + ${k}) = ${fmt(a)} × ${S} = ${fmt(a*S)}.`)},
()=>{const p=pick([[0.25,4],[0.5,2],[0.125,8],[0.2,5]]);const x=dec(1,99,1);return QN(`Tính nhẩm: ${fmt(x)} : ${fmt(p[0])}`,x*p[1],`Chia cho ${fmt(p[0])} cũng là nhân với ${p[1]}: ${fmt(x)} × ${p[1]} = ${fmt(x*p[1])}.`,{hint:fmt(p[0])+' = 1 : '+p[1]})});

/* m5 */
add('m5',1,()=>{const a=R(3,20),b=R(3,20);return QN(`Một hình tam giác vuông có hai cạnh góc vuông dài ${a} cm và ${b} cm. Tính diện tích.`,a*b/2,`Hai cạnh góc vuông chính là đáy và chiều cao: S = ${a} × ${b} : 2 = ${fmt(a*b/2)} (cm²).`,{unit:'cm²',fig:{t:'tri',a,h:b}})},
()=>{const r=R(2,20);return QN(`Một hình tròn có đường kính ${2*r} m. Tính diện tích.`,r*r*3.14,`Bán kính: ${2*r} : 2 = ${r} (m). S = ${r} × ${r} × 3,14 = ${fmt(r*r*3.14)} (m²).`,{unit:'m²',hint:'Tìm bán kính trước.',fig:{t:'circ',r}})});
add('m5',2,()=>{const r=R(2,12);return QN(`Một bánh xe có bán kính ${fmt(r/10)} m. Bánh xe lăn trên mặt đất 100 vòng thì đi được bao nhiêu mét?`,r/10*2*3.14*100,`Chu vi bánh xe: ${fmt(r/10)} × 2 × 3,14 = ${fmt(r/10*2*3.14)} (m). 100 vòng: ${fmt(r/10*2*3.14*100)} m.`,{unit:'m',hint:'Mỗi vòng lăn đi được một chu vi.',fig:{t:'circ',r:r/10}})},
()=>{const b=R(4,14),a=b+R(2,10),h=R(4,12);const S=(a+b)*h/2;return QN(`Một thửa ruộng hình thang có đáy lớn ${a} m, đáy bé ${b} m, chiều cao ${h} m. Cứ 1 m² thu được ${fmt(0.5)} kg rau. Hỏi thu được bao nhiêu ki-lô-gam rau?`,S*0.5,`S = (${a} + ${b}) × ${h} : 2 = ${fmt(S)} (m²). Rau: ${fmt(S)} × 0,5 = ${fmt(S*0.5)} (kg).`,{unit:'kg'})});
add('m5',3,()=>{const r=R(2,10);return QN(`Tính chu vi của một nửa hình tròn (hình bán nguyệt) có bán kính ${r} cm, kể cả đường kính.`,r*3.14+2*r,`Nửa đường tròn: ${r} × 2 × 3,14 : 2 = ${fmt(r*3.14)} (cm). Cộng đường kính ${2*r} cm: ${fmt(r*3.14+2*r)} cm.`,{unit:'cm',hint:'Đừng quên cạnh thẳng là đường kính.',fig:{t:'circ',r}})});

/* m6 */
add('m6',1,()=>{const p=R(1,199);return QN(`Viết ${fmt(p/100)} dưới dạng tỉ số phần trăm.`,p,`${fmt(p/100)} = ${F(p,100)} = ${p}%.`,{unit:'%'})},
()=>{const p=pick([20,25,40,50,60,75]);const X=R(2,40)*20;const B=X*p/100;return QN(`Biết ${p}% của một số là ${fmt(B)}. Tìm số đó.`,X,`Số đó: ${fmt(B)} : ${p} × 100 = ${fmt(X)}.`,{hint:'B : p × 100'})});
add('m6',2,()=>{const T=R(4,12)*100000;const p=pick([0.5,0.6,0.8,1]);const L=T*p/100;return QN(`Một người gửi tiết kiệm ${fmt(T)} đồng với lãi suất ${fmt(p)}% một tháng. Sau một tháng, cả tiền gửi và tiền lãi là bao nhiêu?`,T+L,`Tiền lãi: ${fmt(T)} × ${fmt(p)} : 100 = ${fmt(L)} (đồng). Tổng: ${fmt(T+L)} đồng.`,{unit:'đồng'})});
add('m6',3,()=>{const m=R(1,3),n=m+R(1,3);const k=R(5,15);const big=n*k,sm=m*k;const x=R(1,5);return QN(`Hiện nay tổng số tuổi của hai anh em là ${big+sm} tuổi. Tuổi em bằng ${F(m,n)} tuổi anh. Hỏi sau ${x} năm nữa anh bao nhiêu tuổi?`,big+x,`Tuổi anh hiện nay: ${big+sm} : ${m+n} × ${n} = ${big}. Sau ${x} năm: ${big+x} tuổi.`,{unit:'tuổi'})});

/* m7 */
add('m7',1,()=>{const a=R(1,9),b=R(1,999);return QN(`${a} dm³ ${b} cm³ = … dm³`,a+b/1000,`${b} cm³ = ${fmt(b/1000)} dm³. Vậy ${fmt(a+b/1000)} dm³.`,{unit:'dm³'})});
add('m7',2,()=>{const v=R(2,9)*100;const t=R(2,6);return QN(`Một vòi nước mỗi phút chảy được ${v} lít. Hỏi sau ${t} phút vòi chảy được bao nhiêu mét khối nước?`,v*t/1000,`${v} × ${t} = ${v*t} (lít) = ${fmt(v*t/1000)} m³.`,{unit:'m³'})});

/* m8 */
add('m8',1,()=>{const a=R(2,15);return QN(`Một hình lập phương có cạnh ${a} cm. Tính diện tích một mặt.`,a*a,`Mỗi mặt là hình vuông cạnh ${a} cm: ${a} × ${a} = ${a*a} (cm²).`,{unit:'cm²'})});
add('m8',2,()=>{const a=R(4,12),b=R(3,8),c=R(2,6);const p=pick([2,3,4]);return QN(`Một cái hộp hình hộp chữ nhật dài ${a} dm, rộng ${b} dm, cao ${c} dm. Người ta sơn mặt ngoài (không sơn đáy). Tính diện tích cần sơn.`,(a+b)*2*c+a*b,`Sxq: (${a} + ${b}) × 2 × ${c} = ${(a+b)*2*c}. Thêm nắp: ${a*b}. Cần sơn: ${(a+b)*2*c+a*b} dm².`,{unit:'dm²'})});
add('m8',3,()=>{const a=R(4,10),b=R(3,8),h=R(3,9);const w=a*b*h;const H=R(h+2,h+6);return QN(`Một bể hình hộp chữ nhật dài ${a} dm, rộng ${b} dm, cao ${H} dm đang chứa ${w} lít nước. Tính chiều cao mực nước trong bể.`,h,`${w} lít = ${w} dm³. Diện tích đáy: ${a} × ${b} = ${a*b} (dm²). Chiều cao mực nước: ${w} : ${a*b} = ${h} (dm).`,{unit:'dm',fig:{t:'box',a,b,c:H,water:h}})});

/* m9 */
add('m9',1,()=>{const h=R(1,4),m=R(5,50),k=R(2,5);let H=h*k,Mi=m*k;H+=Math.floor(Mi/60);Mi%=60;return QM(`Tính: ${HM(h,m)} × ${k}`,[HM(H,Mi),HM(h*k,m*k),HM(H+1,Mi),HM(H,(Mi+15)%60)].filter((v,i,a)=>a.indexOf(v)===i),0,`${h} × ${k} = ${h*k} giờ; ${m} × ${k} = ${m*k} phút${m*k>=60?' = '+HM(Math.floor(m*k/60),m*k%60):''}. Kết quả: ${HM(H,Mi)}.`)},
()=>{const sh=R(6,10),sm=pick([0,10,15,20,30,45]);const d=R(40,200);const t=sh*60+sm+d;return QM(`Một xe khởi hành lúc ${HM(sh,sm)} và đến nơi lúc ${HM(Math.floor(t/60),t%60)}. Xe đi hết bao lâu?`,[HM(Math.floor(d/60),d%60),HM(Math.floor(d/60)+1,d%60),HM(Math.floor(d/60),(d%60+30)%60),HM(Math.floor(d/60)+2,d%60)].filter((v,i,a)=>a.indexOf(v)===i&&v!=='0 giờ'),0,`Thời gian đi = giờ đến − giờ đi = ${HM(Math.floor(d/60),d%60)}.`)});
add('m9',2,()=>{const v=pick([600,750,900,1200,1500]);return QN(`Một người đi xe đạp với vận tốc ${v} m/phút. Vận tốc đó bằng bao nhiêu ki-lô-mét/giờ?`,v*60/1000,`Mỗi giờ đi được: ${v} × 60 = ${fmt(v*60)} (m) = ${fmt(v*60/1000)} km. Vận tốc: ${fmt(v*60/1000)} km/giờ.`,{unit:'km/giờ'})},
()=>{const v=R(4,6);const s=dec(1,5,1);const t=s/v;if(!Number.isInteger(t*60))return M('m9').gen[2][0]();return QN(`Một người đi bộ với vận tốc ${v} km/giờ trên quãng đường ${fmt(s)} km. Hỏi người đó đi hết bao nhiêu phút?`,t*60,`t = ${fmt(s)} : ${v} = ${fmt(t)} (giờ) = ${fmt(t*60)} phút.`,{unit:'phút'})});
add('m9',3,()=>{const v1=R(30,45),v2=R(40,60);const t=pick([1.5,2,2.5]);const s=(v1+v2)*t;const sh=R(6,9);const T=sh*60+t*60;return QN(`Lúc ${sh} giờ, hai xe khởi hành từ A và B cách nhau ${fmt(s)} km, đi ngược chiều nhau với vận tốc ${v1} km/giờ và ${v2} km/giờ. Chỗ gặp nhau cách A bao nhiêu ki-lô-mét?`,v1*t,`Thời gian gặp: ${fmt(s)} : (${v1} + ${v2}) = ${fmt(t)} (giờ). Cách A: ${v1} × ${fmt(t)} = ${fmt(v1*t)} (km).`,{unit:'km',fig:{t:'meet',v1,v2,s}})});

/* m10 */
add('m10',1,()=>{const N=pick([20,25,40,50]);const k=R(1,N-1);return QN(`Lớp có ${N} học sinh, trong đó có ${k} bạn đeo kính. Số bạn đeo kính chiếm bao nhiêu phần trăm số học sinh cả lớp?`,k/N*100,`${k} : ${N} × 100 = ${fmt(k/N*100)}%.`,{unit:'%'})});
add('m10',2,()=>{const a=R(4,9);const b=R(10,60);return QN(`Trung bình cộng của ${a} số là ${b}. Tổng của ${a} số đó là bao nhiêu?`,a*b,`Tổng = trung bình cộng × số các số = ${b} × ${a} = ${a*b}.`)});

()=>{const n=R(3,8),p=R(2,9)*1000;const m=R(2,12);return QN(`Mua ${n} quyển vở hết ${fmt(n*p)} đồng. Hỏi mua ${m} quyển vở như thế hết bao nhiêu tiền?`,m*p,`Giá 1 quyển: ${fmt(n*p)} : ${n} = ${fmt(p)} (đồng). ${m} quyển: ${fmt(p)} × ${m} = ${fmt(m*p)} (đồng).`,{unit:'đồng',hint:'Rút về đơn vị: tìm giá 1 quyển.'})},
()=>{const d=pick([2,3,4,5,6,10]);const k=R(10,60);const L=d*k;return QN(`Người ta trồng cây ở <b>một bên</b> con đường dài ${L} m, cứ ${d} m trồng một cây, hai đầu đường đều có cây. Hỏi trồng tất cả bao nhiêu cây?`,k+1,`Số khoảng cách: ${L} : ${d} = ${k}. Hai đầu đều trồng nên số cây = ${k} + 1 = ${k+1}.`,{unit:'cây',hint:'Số cây = số khoảng + 1.',fig:{t:'trees',k,d,closed:false}})}],
2:[()=>{const n=R(20,50);const c=R(5,n-5);const g=n-c;const legs=g*2+c*4;return QN(`Vừa gà vừa chó có ${n} con, đếm được ${legs} cái chân. Hỏi có bao nhiêu con chó?`,c,`Giả sử cả ${n} con đều là gà: ${n} × 2 = ${2*n} chân, ít hơn thực tế ${legs} − ${2*n} = ${legs-2*n} chân. Mỗi con chó hơn gà 2 chân. Số chó: ${legs-2*n} : 2 = ${c} (con).`,{unit:'con',hint:'Giả sử tất cả đều là gà.'})},
()=>{const d=pick([2,4,5,6,8]);const k=R(15,60);const P=d*k;return QN(`Người ta trồng cây xung quanh một hồ nước có chu vi ${P} m, cứ ${d} m trồng một cây. Hỏi trồng được bao nhiêu cây?`,k,`Trồng khép kín nên số cây bằng số khoảng: ${P} : ${d} = ${k} (cây).`,{unit:'cây',hint:'Đường khép kín: số cây = số khoảng.',fig:{t:'trees',k,d,closed:true}})},
()=>{const n=R(3,6),w=R(4,9);const m=R(2,12);const days=n*w;if(days%m)return M('m11').gen[2][2]();return QN(`${n} người làm xong một công việc trong ${w} ngày. Hỏi ${m} người làm xong công việc đó trong bao nhiêu ngày? (Sức làm như nhau)`,days/m,`1 người làm xong trong: ${w} × ${n} = ${days} (ngày). ${m} người: ${days} : ${m} = ${days/m} (ngày).`,{unit:'ngày',hint:'Số người tăng thì số ngày giảm.'})},
()=>{const age=R(6,12);const k=pick([3,4,5]);const D=age*(k-1);const n=R(2,6);return QN(`Năm nay bố gấp ${k} lần tuổi con, bố hơn con ${D} tuổi. Hỏi ${n} năm nữa con bao nhiêu tuổi?`,age+n,`Hiệu số phần: ${k} − 1 = ${k-1}. Tuổi con năm nay: ${D} : ${k-1} = ${age}. Sau ${n} năm: ${age+n} tuổi.`,{unit:'tuổi',fig:{t:'ht',m:1,n:k,D,names:['Con','Bố']}})}],
3:[()=>{const [a,b]=pick([[3,6],[4,12],[2,3],[6,12],[10,15],[2,6],[4,4],[6,3],[12,4],[20,30]]);return QN(`Vòi thứ nhất chảy riêng thì đầy bể sau ${a} giờ, vòi thứ hai chảy riêng thì đầy bể sau ${b} giờ. Nếu mở cả hai vòi cùng lúc thì sau bao lâu bể đầy?`,a*b/(a+b),`Mỗi giờ vòi 1 chảy ${F(1,a)} bể, vòi 2 chảy ${F(1,b)} bể. Cả hai: ${F(1,a)} + ${F(1,b)} = ${F(a+b,a*b)} bể. Thời gian: 1 : ${F(a+b,a*b)} = ${F(a*b,a+b)} = ${fmt(a*b/(a+b))} giờ.`,{unit:'giờ',hint:'Tính phần bể cả hai vòi chảy được trong 1 giờ.',fig:{t:'tank',a,b}})},
()=>{const x=R(5,40);const a=R(2,5),b=R(3,30),c=R(2,4);const r=(x*a+b)/c;if(!Number.isInteger(r))return M('m11').gen[3][1]();return QN(`Nghĩ một số, đem nhân với ${a}, được bao nhiêu cộng thêm ${b}, rồi chia cho ${c} thì được ${r}. Tìm số đã nghĩ.`,x,`Tính ngược từ cuối: ${r} × ${c} = ${r*c}; ${r*c} − ${b} = ${r*c-b}; ${r*c-b} : ${a} = ${x}.`,{hint:'Làm ngược lại: nhân thay chia, trừ thay cộng.'})},
()=>{const n=R(20,40);const ok=R(Math.ceil(n/2),n-1);const wrong=n-ok;const pr=pick([[5,2],[4,1],[10,5]]);const S=ok*pr[0]-wrong*pr[1];return QN(`Một bài thi có ${n} câu. Mỗi câu đúng được ${pr[0]} điểm, mỗi câu sai (hoặc bỏ trống) bị trừ ${pr[1]} điểm. Bạn Minh được ${S} điểm. Hỏi Minh làm đúng bao nhiêu câu?`,ok,`Giả sử đúng cả ${n} câu: ${n*pr[0]} điểm, hơn thực tế ${n*pr[0]-S} điểm. Mỗi câu sai làm mất ${pr[0]} + ${pr[1]} = ${pr[0]+pr[1]} điểm. Số câu sai: ${n*pr[0]-S} : ${pr[0]+pr[1]} = ${wrong}. Số câu đúng: ${ok}.`,{unit:'câu',hint:'Giả sử Minh làm đúng tất cả.'})},
()=>{const age=R(8,14),k=pick([2,3]);const m=age*k+R(0,0);const sum=age+m;const n=R(3,8);const s2=sum+2*n;return QN(`Tổng số tuổi của mẹ và con sau ${n} năm nữa là ${s2} tuổi. Hiện nay tuổi mẹ gấp ${k} lần tuổi con. Tính tuổi con hiện nay.`,age,`Tổng số tuổi hiện nay: ${s2} − ${n} × 2 = ${sum}. Tổng số phần: ${k+1}. Tuổi con: ${sum} : ${k+1} = ${age}.`,{unit:'tuổi',hint:'Mỗi năm tổng số tuổi hai người tăng 2.',fig:{t:'tt',m:1,n:k,S:sum,names:['Con (nay)','Mẹ (nay)']}})}]}});

[1,'Từ “mắt” trong “mắt na” mang nghĩa gì?',['Nghĩa chuyển','Nghĩa gốc','Từ đồng âm','Từ trái nghĩa'],'Mắt na là các ô nhỏ trên vỏ quả na, giống hình con mắt → nghĩa chuyển.'],
[1,'Câu nào có từ “đầu” mang <b>nghĩa chuyển</b>?',['Đầu làng có cây đa cổ thụ.','Em đội mũ lên đầu.','Con mèo gối đầu lên chân em.','Bé lắc đầu.'],'“Đầu làng” là phần phía trước của làng — nghĩa chuyển.'],
[1,'Nghĩa gốc của từ “ăn” là:',['Cho thức ăn vào miệng và nuốt','Tiêu tốn (xe ăn xăng)','Hợp nhau (ăn ảnh)','Nhận lấy (ăn đòn)'],'Các nghĩa còn lại là nghĩa chuyển.'],
[1,'Câu nào có từ “ngọt” mang nghĩa gốc?',['Quả cam này rất ngọt.','Cô ấy nói ngọt.','Đàn ngọt tiếng.','Rét ngọt.'],'Nghĩa gốc của “ngọt”: vị như vị của đường.'],
[2,'Cặp câu nào chứa hai từ <b>đồng âm</b>?',['Hòn đá to. / Em đá bóng.','Đau chân. / Chân bàn.','Mũi người. / Mũi thuyền.','Lá cây. / Lá thư.'],'“Đá” (hòn đá) và “đá” (hoạt động bằng chân) không liên quan về nghĩa → đồng âm.'],
[2,'Từ “chạy” trong “Đồng hồ chạy đúng giờ” có nghĩa là:',['Hoạt động (của máy móc)','Di chuyển nhanh bằng chân','Trốn tránh','Lo liệu khẩn trương'],'Đồng hồ “chạy” là máy móc hoạt động.'],
[2,'Từ “nhà” trong “Cả nhà đi du lịch” chỉ:',['Những người trong gia đình','Công trình để ở','Vợ hoặc chồng','Triều đại'],'“Cả nhà” = tất cả các thành viên trong gia đình.'],
[2,'Câu nào có từ “cổ” mang nghĩa chuyển?',['Cổ chai bị mẻ.','Hươu có cái cổ dài.','Bé quàng khăn vào cổ.','Ông bị đau cổ.'],'Cổ chai là phần thắt nhỏ của chai, giống vị trí cái cổ.'],
[3,'Từ “xuân” trong câu “Bác Hồ sống thọ 79 mùa xuân” có nghĩa là:',['tuổi (năm)','mùa đầu tiên trong năm','tươi trẻ','sức sống'],'Mỗi mùa xuân là một năm, “79 mùa xuân” = 79 tuổi.'],
[3,'Từ “xuân” trong “tuổi xuân” có nghĩa là:',['tươi đẹp, trẻ trung','mùa xuân','năm','tuổi già'],'“Tuổi xuân” là tuổi trẻ.'],
[3,'Dòng nào có <b>cả hai</b> từ “chín” đều mang nghĩa chuyển?',['Nghĩ cho chín; Ngượng chín cả mặt','Lúa ngoài đồng đã chín; Nghĩ cho chín','Cơm đã chín; Chín người mười ý','Quả chín; Ngượng chín cả mặt'],'“Nghĩ cho chín” (kĩ càng) và “ngượng chín mặt” (đỏ mặt) đều là nghĩa chuyển. “Chín người” là số đếm → đồng âm.'],
[3,'Trong câu “Bạn Lan rất ăn ảnh.”, từ “ăn” có nghĩa là:',['hợp, trông đẹp khi chụp','nhai và nuốt','tiêu thụ','chiếm lấy'],'“Ăn ảnh” = khi chụp trông đẹp, hợp với ảnh.']]},
{id:'t3',name:'Đại từ',sgk:'Luyện từ và câu',
theory:{tom:['<b>Đại từ</b> dùng để <b>xưng hô</b>, để <b>hỏi</b>, hoặc để <b>thay thế</b> danh từ, động từ, tính từ (cụm từ) trong câu cho khỏi lặp.','Đại từ xưng hô: ngôi 1 (tôi, tớ, ta, chúng tôi, chúng ta), ngôi 2 (bạn, mày, các bạn), ngôi 3 (nó, họ, chúng nó).','Đại từ để hỏi: ai, gì, nào, đâu, bao nhiêu, mấy…; đại từ thay thế: vậy, thế.'],
nho:['“Chúng ta” gồm cả người nghe; “chúng tôi” không gồm người nghe.','Danh từ chỉ người (ông, bà, cô, chú, anh, chị…) thường được dùng để xưng hô.'],
luu:['Xưng hô phải phù hợp với quan hệ và tuổi tác: nói với thầy cô xưng “em”.','“Vậy, thế” có thể thay cho cả một cụm động từ, tính từ.'],
nghi:['Hỏi: từ này đang thay cho ai/cái gì? → tìm từ được thay thế ở câu trước.','Xác định ngôi: người nói (1), người nghe (2), người được nói tới (3).'],
vd:{de:'“Tôi thích đọc sách, bạn tôi cũng thế.” Từ “thế” thay cho gì?',giai:'“Thế” thay cho cụm “thích đọc sách”.'},
dat:['Nhận biết đại từ xưng hô, đại từ để hỏi, đại từ thay thế.','Dùng đại từ đúng ngôi, đúng mực khi giao tiếp.','Dùng đại từ để tránh lặp từ khi viết.'],
mo2:['Phân biệt “chúng ta” – “chúng tôi”.','Tìm từ được thay thế qua nhiều câu.'],
mo3:['Xác định ngôi kể của câu chuyện qua đại từ.','Phân biệt danh từ chỉ người với đại từ xưng hô.']},
q:[[1,'Từ nào là đại từ xưng hô <b>ngôi thứ nhất</b>?',['chúng tôi','các bạn','họ','nó'],'“Chúng tôi” chỉ người nói.'],
[1,'Trong câu “Ai là lớp trưởng lớp 5A?”, từ “ai” là:',['đại từ để hỏi','đại từ xưng hô','danh từ','kết từ'],'“Ai” dùng để hỏi về người.'],
[1,'“Tôi thích đọc sách, bạn tôi cũng thế.” Từ “thế” thay cho:',['thích đọc sách','tôi','bạn tôi','sách'],'“Thế” thay cho cụm động từ “thích đọc sách”.'],
[1,'Từ nào là đại từ ngôi thứ ba?',['họ','ta','mày','chúng ta'],'“Họ” chỉ những người được nói tới.'],
[1,'Câu nào có đại từ để hỏi?',['Bạn đi đâu đấy?','Bạn đi học.','Tôi đi học.','Trời đẹp quá!'],'“Đâu” là đại từ để hỏi về nơi chốn.'],
[2,'“Chúng ta” và “chúng tôi” khác nhau thế nào?',['“Chúng ta” gồm cả người nghe, “chúng tôi” thì không','Giống nhau hoàn toàn','“Chúng tôi” gồm cả người nghe','“Chúng ta” là ngôi thứ hai'],'Khi nói “chúng ta”, người nói tính cả người nghe vào.'],
[2,'“Hoa là học sinh giỏi. Bạn ấy luôn giúp đỡ mọi người.” Cụm “bạn ấy” thay cho:',['Hoa','học sinh giỏi','mọi người','giúp đỡ'],'“Bạn ấy” thay cho “Hoa” để tránh lặp.'],
[2,'Dòng nào <b>toàn là</b> đại từ?',['tôi, nó, ai, đâu','ông, bà, cha, mẹ','và, với, nhưng, của','đẹp, xinh, tốt, giỏi'],'“Ông, bà, cha, mẹ” là danh từ chỉ người; “và, với…” là kết từ.'],
[2,'Khi nói chuyện với thầy giáo, em nên xưng hô thế nào?',['em – thầy','tớ – cậu','tao – mày','mình – bạn'],'Xưng “em”, gọi “thầy” thể hiện sự lễ phép.'],
[3,'“Cái cây này đẹp, cây kia cũng vậy.” Từ “vậy” thay cho từ thuộc từ loại nào?',['tính từ','danh từ','động từ','kết từ'],'“Vậy” thay cho “đẹp” — một tính từ.'],
[3,'Một câu chuyện mà người kể xưng “tôi” và kể việc mình trải qua là kể theo:',['ngôi thứ nhất','ngôi thứ hai','ngôi thứ ba','không có ngôi'],'Người kể là nhân vật xưng “tôi” → ngôi thứ nhất.'],
[3,'Trong câu “Ông nội em năm nay đã 80 tuổi.”, từ “ông” là:',['danh từ chỉ người','đại từ để hỏi','kết từ','đại từ thay thế'],'Ở đây “ông” gọi tên người được nói tới, là danh từ. Khi cháu nói “Ông ơi, ông đi đâu?”, “ông” được dùng để xưng hô.']]},
{id:'t4',name:'Kết từ',sgk:'Luyện từ và câu',
theory:{tom:['<b>Kết từ</b> dùng để nối các từ ngữ hoặc các câu, nhằm thể hiện <b>mối quan hệ</b> giữa chúng.','Kết từ thường gặp: và, với, hay, hoặc, nhưng, mà, thì, của, ở, tại, bằng, như, để, về…','<b>Cặp kết từ</b>: vì… nên…; nếu… thì…; tuy… nhưng…; không những… mà còn…'],
nho:['Vì… nên… / Do… nên… / Nhờ… mà… → nguyên nhân – kết quả','Nếu… thì… / Hễ… thì… → điều kiện (giả thiết) – kết quả','Tuy… nhưng… / Mặc dù… nhưng… → tương phản','Không những… mà còn… → tăng tiến'],
luu:['Không ghép sai cặp: “Vì… nhưng…” là sai.','“Nhờ” chỉ nguyên nhân tốt; “tại, vì” có thể chỉ nguyên nhân không tốt.'],
nghi:['Đọc ý hai vế: vế sau là kết quả? trái ngược? hay bổ sung?','Chọn kết từ thể hiện đúng quan hệ đó.'],
vd:{de:'Điền cặp kết từ: “… trời mưa to … chúng em vẫn đi học đúng giờ.”',giai:'Tuy… nhưng… (hai vế trái ngược nhau).'},
dat:['Nhận biết kết từ, cặp kết từ trong câu.','Nêu được quan hệ mà kết từ thể hiện.','Dùng kết từ đúng khi đặt câu, viết đoạn.'],
mo2:['Phát hiện và sửa câu dùng sai kết từ.'],
mo3:['Phân biệt sắc thái “nhờ” – “tại”; xác định quan hệ trong câu ghép phức tạp.']},
q:[[1,'Từ nào là kết từ trong câu “Em và bạn cùng đi học.”?',['và','em','cùng','đi'],'“Và” nối “em” với “bạn”.'],
[1,'Chọn kết từ thích hợp: “Trời mưa … đường trơn.”',['nên','nhưng','mà','hoặc'],'Trời mưa là nguyên nhân, đường trơn là kết quả.'],
[1,'Cặp kết từ nào thể hiện quan hệ nguyên nhân – kết quả?',['Vì… nên…','Tuy… nhưng…','Nếu… thì…','Không những… mà còn…'],'“Vì” nêu nguyên nhân, “nên” nêu kết quả.'],
[1,'Từ “của” trong “Quyển sách của em” thể hiện quan hệ:',['sở hữu','nguyên nhân','tương phản','điều kiện'],'Quyển sách thuộc về em.'],
[1,'Kết từ “nhưng” thể hiện quan hệ:',['tương phản','nguyên nhân – kết quả','bổ sung','lựa chọn'],'“Nhưng” nối hai ý trái ngược nhau.'],
[2,'Điền cặp kết từ: “… Nam bị ốm … bạn ấy vẫn đi học đầy đủ.”',['Tuy… nhưng…','Vì… nên…','Nếu… thì…','Hễ… thì…'],'Bị ốm mà vẫn đi học → quan hệ tương phản.'],
[2,'Câu nào dùng <b>sai</b> kết từ?',['Vì trời mưa to nhưng em vẫn ở nhà.','Vì trời mưa to nên em ở nhà.','Tuy trời mưa to nhưng em vẫn đi học.','Nếu trời mưa thì em ở nhà.'],'“Vì… nhưng…” không phải là cặp kết từ đúng.'],
[2,'Kết từ “hay” trong “Bạn uống trà hay uống sữa?” thể hiện quan hệ:',['lựa chọn','bổ sung','tương phản','mục đích'],'Người nghe chọn một trong hai.'],
[2,'Điền: “Lan … học giỏi … còn hát hay.”',['không những… mà…','vì… nên…','tuy… nhưng…','nếu… thì…'],'Quan hệ tăng tiến: không những… mà còn…'],
[3,'Trong câu “Em học bài để được điểm tốt.”, kết từ “để” chỉ quan hệ:',['mục đích','nguyên nhân','điều kiện','tương phản'],'Được điểm tốt là mục đích của việc học bài.'],
[3,'“Nhờ bạn giúp đỡ mà em tiến bộ.” và “Tại bạn mà em bị phạt.” khác nhau ở:',['“nhờ” chỉ nguyên nhân dẫn đến điều tốt, “tại” chỉ nguyên nhân dẫn đến điều không tốt','“nhờ” chỉ mục đích','“tại” chỉ nơi chốn','Không khác nhau'],'Cả hai đều chỉ nguyên nhân nhưng khác sắc thái kết quả.'],
[3,'Câu ghép nào thể hiện quan hệ <b>điều kiện – kết quả</b>?',['Nếu em chăm học thì em sẽ tiến bộ.','Vì em chăm học nên em tiến bộ.','Em chăm học nhưng chưa tiến bộ.','Em vừa chăm học vừa ngoan.'],'“Nếu… thì…” nêu điều kiện và kết quả.']]},
{id:'t5',name:'Câu đơn, câu ghép',sgk:'Luyện từ và câu',
theory:{tom:['<b>Câu đơn</b>: có một cụm chủ ngữ – vị ngữ (CN – VN).','<b>Câu ghép</b>: do nhiều vế câu ghép lại; mỗi vế thường có cấu tạo như một câu đơn (có CN – VN riêng).','Các vế câu ghép nối với nhau bằng: <b>kết từ</b> (và, còn, nhưng, hay…), <b>cặp kết từ</b> (vì… nên…), <b>cặp từ hô ứng</b> (vừa… đã…; càng… càng…; đâu… đấy…), hoặc <b>nối trực tiếp</b> bằng dấu phẩy, dấu chấm phẩy, dấu hai chấm.'],
nho:['Đếm số cụm CN – VN để biết câu đơn hay câu ghép.','Một CN có nhiều VN vẫn là <b>câu đơn</b>: “Chim hót và nhảy nhót.”','Trạng ngữ không phải là một vế câu.'],
luu:['“Mùa xuân, cây cối đâm chồi.” là câu đơn (“Mùa xuân” là trạng ngữ).','Mỗi vế câu ghép phải có cả CN và VN.'],
nghi:['Gạch một gạch dưới CN, hai gạch dưới VN.','Tìm từ nối giữa các vế, xác định quan hệ ý nghĩa.'],
vd:{de:'Câu “Trời càng mưa to, đường càng lầy lội.” là câu gì? Nối bằng cách nào?',giai:'Câu ghép hai vế (Trời / càng mưa to; đường / càng lầy lội), nối bằng cặp từ hô ứng “càng… càng…”.'},
dat:['Phân biệt câu đơn và câu ghép.','Xác định các vế, chủ ngữ, vị ngữ trong câu ghép.','Nêu cách nối và quan hệ giữa các vế; đặt được câu ghép.'],
mo2:['Câu ghép nối bằng cặp từ hô ứng.','Thêm vế để tạo câu ghép đúng quan hệ.'],
mo3:['Phân biệt câu đơn có nhiều VN (hoặc nhiều CN) với câu ghép.','Câu ghép có vế nối bằng dấu hai chấm (vế sau giải thích cho vế trước).']},
q:[[1,'Câu nào là <b>câu ghép</b>?',['Mặt trời mọc, sương tan dần.','Sáng nay, em đi học sớm.','Những bông hồng nở rộ trong vườn.','Chú mèo nằm sưởi nắng.'],'Có hai cụm CN – VN: “Mặt trời / mọc” và “sương / tan dần”.'],
[1,'Câu “Trời nắng, chim hót líu lo.” có mấy vế câu?',['2','1','3','4'],'Vế 1: Trời / nắng. Vế 2: chim / hót líu lo.'],
[1,'Các vế trong câu “Lan học bài còn Huệ quét nhà.” được nối bằng:',['kết từ “còn”','dấu phẩy','cặp từ hô ứng','dấu hai chấm'],'“Còn” là kết từ nối hai vế.'],
[1,'Câu đơn là câu:',['có một cụm chủ ngữ – vị ngữ','có hai cụm chủ ngữ – vị ngữ trở lên','không có vị ngữ','chỉ có một từ'],'Đây là định nghĩa câu đơn.'],
[1,'Câu nào là <b>câu đơn</b>?',['Mùa xuân, cây cối đâm chồi nảy lộc.','Mưa rơi, gió thổi.','Trời tối, đèn đường bật sáng.','Em hát, bạn múa.'],'“Mùa xuân” là trạng ngữ; câu chỉ có một cụm CN – VN.'],
[2,'Câu “Trời càng mưa to, đường càng lầy lội.” nối các vế bằng:',['cặp từ hô ứng “càng… càng…”','cặp kết từ “vì… nên…”','kết từ “và”','dấu hai chấm'],'“Càng… càng…” là cặp từ hô ứng.'],
[2,'Chủ ngữ của vế thứ hai trong câu “Gió thổi mạnh, những cành cây nghiêng ngả.” là:',['những cành cây','gió','nghiêng ngả','thổi mạnh'],'Vế 2: những cành cây (CN) / nghiêng ngả (VN).'],
[2,'Câu nào có các vế nối bằng cặp kết từ chỉ <b>giả thiết – kết quả</b>?',['Nếu ngày mai trời đẹp thì lớp em đi cắm trại.','Vì trời mưa nên lớp em hoãn cắm trại.','Trời mưa nhưng lớp em vẫn đi cắm trại.','Trời vừa hửng nắng, lớp em đã lên đường.'],'“Nếu… thì…” chỉ giả thiết – kết quả.'],
[2,'Điền cặp từ hô ứng: “Trời … hửng sáng, bà con … ra đồng.”',['vừa… đã…','càng… càng…','đâu… đấy…','tuy… nhưng…'],'“Vừa… đã…” chỉ hai sự việc xảy ra gần như cùng lúc.'],
[3,'Câu nào là câu đơn (không phải câu ghép)?',['Chim hót líu lo và nhảy nhót trên cành.','Chim hót, hoa nở.','Mẹ nấu cơm, bố quét nhà.','Gió thổi, mây bay.'],'Chỉ có một chủ ngữ “Chim” với hai vị ngữ → câu đơn.'],
[3,'Câu “Mưa rào rào trên sân gạch, mưa đồm độp trên phên nứa.” là:',['câu ghép có hai vế','câu đơn','câu ghép ba vế','câu đơn có hai trạng ngữ'],'Có hai cụm CN – VN: “Mưa / rào rào trên sân gạch”, “mưa / đồm độp trên phên nứa”.'],
[3,'Quan hệ giữa hai vế câu “Tuy nhà xa nhưng Hà chưa bao giờ đi học muộn.” là:',['tương phản','nguyên nhân – kết quả','điều kiện – kết quả','tăng tiến'],'“Tuy… nhưng…” chỉ quan hệ tương phản.'],
[3,'Câu nào có hai vế nối với nhau bằng dấu hai chấm?',['Cảnh vật thật im lặng: cây cối không động đậy, chim chóc không hót.','Em đi học, mẹ đi làm.','Nếu em học giỏi thì mẹ vui.','Trời càng tối, đèn càng sáng.'],'Vế sau dấu hai chấm giải thích cho vế trước.']]},
{id:'t6',name:'Liên kết câu',sgk:'Luyện từ và câu',
theory:{tom:['Các câu trong đoạn văn phải <b>liên kết</b> với nhau cả về nội dung và hình thức.','Ba cách liên kết thường dùng: <b>lặp từ ngữ</b>; <b>thay thế từ ngữ</b> (bằng đại từ hoặc từ đồng nghĩa); dùng <b>từ ngữ nối</b>.','Từ ngữ nối: nhưng, tuy nhiên, vì vậy, vì thế, ngoài ra, sau đó, cuối cùng, trái lại, thậm chí…'],
nho:['Lặp: dùng lại từ ở câu trước.','Thay thế: “Bác Hồ … Người …”; “con mèo … nó …”.','Nối: “Vì vậy” (kết quả), “Tuy nhiên / Trái lại” (đối lập), “Ngoài ra” (bổ sung).'],
luu:['Lặp từ quá nhiều làm văn nhàm chán → nên xen kẽ thay thế.','Câu lạc đề làm đoạn văn mất liên kết về nội dung.'],
nghi:['Tìm từ ở câu sau cùng chỉ một sự vật với câu trước.','Hỏi: hai câu quan hệ với nhau thế nào? (kết quả, đối lập, bổ sung…) → chọn từ nối.'],
vd:{de:'“Bác Hồ rất yêu thiếu nhi. Người thường gửi thư cho các cháu.” Hai câu liên kết bằng cách nào?',giai:'Thay thế: “Người” thay cho “Bác Hồ”.'},
dat:['Nhận biết các cách liên kết câu.','Dùng từ ngữ nối, từ thay thế phù hợp khi viết đoạn.','Phát hiện câu làm đoạn văn mất liên kết.'],
mo2:['Tìm chuỗi từ ngữ thay thế cho cùng một nhân vật qua nhiều câu.'],
mo3:['Phân tích đoạn văn dùng phối hợp nhiều cách liên kết.']},
q:[[1,'“Thư viện trường em rất rộng. Thư viện có nhiều sách hay.” Hai câu liên kết bằng cách:',['lặp từ ngữ','thay thế từ ngữ','dùng từ ngữ nối','không liên kết'],'Từ “thư viện” được lặp lại.'],
[1,'“Bác Hồ rất yêu thiếu nhi. Người thường gửi thư cho các cháu.” Từ “Người” thay cho:',['Bác Hồ','thiếu nhi','các cháu','thư'],'“Người” là cách gọi tôn kính Bác Hồ.'],
[1,'Từ ngữ nối nào phù hợp: “Nam học rất chăm. …, bạn ấy luôn đứng đầu lớp.”',['Vì vậy','Tuy nhiên','Trái lại','Nhưng'],'Câu sau là kết quả của câu trước.'],
[1,'“Hôm qua trời mưa. Tuy vậy, chúng em vẫn đi học đúng giờ.” Hai câu liên kết bằng:',['từ ngữ nối','lặp từ','thay thế','không liên kết'],'“Tuy vậy” là từ ngữ nối chỉ quan hệ đối lập.'],
[2,'“Chú gà trống nhà em rất đẹp. Chú có bộ lông óng ả. Anh chàng ấy gáy rất to.” Các từ ngữ thay thế cho “chú gà trống” là:',['chú; anh chàng ấy','bộ lông','óng ả','gáy'],'“Chú” và “anh chàng ấy” cùng chỉ chú gà trống.'],
[2,'Vì sao nên dùng từ thay thế thay vì lặp lại một từ nhiều lần?',['Tránh nhàm chán mà vẫn giữ được liên kết','Để câu dài hơn','Để đổi nghĩa câu','Không có lí do'],'Thay thế giúp câu văn phong phú, không lặp.'],
[2,'Chọn từ nối: “Minh học giỏi Toán. …, bạn còn vẽ rất đẹp.”',['Ngoài ra','Vì thế','Tuy nhiên','Trái lại'],'Câu sau bổ sung thêm ý → “Ngoài ra”.'],
[3,'“Mẹ tặng em một chiếc cặp. Em rất thích. Hôm nay trời nắng đẹp.” Câu nào làm đoạn mất liên kết về nội dung?',['Hôm nay trời nắng đẹp.','Mẹ tặng em một chiếc cặp.','Em rất thích.','Không câu nào'],'Câu này không nói về chiếc cặp, lạc ý với hai câu trước.'],
[3,'“Quê em có một dòng sông. Dòng sông ấy uốn quanh làng. Nó đỏ nặng phù sa.” Đoạn văn dùng những cách liên kết nào?',['Lặp từ và thay thế','Chỉ lặp từ','Chỉ dùng từ nối','Chỉ thay thế'],'“Dòng sông” được lặp; “Nó” thay thế cho dòng sông.'],
[3,'Từ ngữ nối nào thể hiện quan hệ <b>đối lập</b>?',['Trái lại','Vì vậy','Ngoài ra','Sau đó'],'“Trái lại” nối hai ý ngược nhau.']]},
{id:'t7',name:'Dấu câu, viết hoa tên nước ngoài',sgk:'Luyện từ và câu',
theory:{tom:['<b>Dấu gạch ngang</b>: đánh dấu lời nói của nhân vật; đánh dấu phần chú thích; đánh dấu các ý liệt kê; nối các từ trong một liên danh (tàu Hà Nội – Lào Cai).','<b>Dấu phẩy</b>: ngăn cách trạng ngữ với CN – VN; ngăn cách các từ ngữ cùng chức vụ; ngăn cách các vế câu ghép.','<b>Tên người, tên địa lí nước ngoài</b>: phiên âm Hán Việt thì viết như tên Việt Nam (Lỗ Tấn, Bắc Kinh); phiên âm trực tiếp thì viết hoa chữ cái đầu mỗi bộ phận, các tiếng trong một bộ phận nối bằng gạch nối (Mát-xcơ-va, Lê-ô-nác-đô đa Vin-xi).'],
nho:['Mỗi bộ phận tên: chỉ viết hoa chữ cái đầu tiên.','Dấu gạch nối (-) ngắn, dùng trong tên phiên âm; dấu gạch ngang (–) dài hơn.'],
luu:['Viết “Mát-Xcơ-Va” là sai: chỉ viết hoa chữ đầu bộ phận.','Không đặt dấu phẩy giữa chủ ngữ và vị ngữ.'],
nghi:['Xác định dấu câu đứng ở vị trí nào trong câu, ngăn cách những bộ phận gì.','Với tên nước ngoài: hỏi “tên này phiên âm Hán Việt hay phiên âm trực tiếp?”.'],
vd:{de:'Viết đúng tên: “pa ri”',giai:'Pa-ri (phiên âm trực tiếp: viết hoa chữ đầu, nối bằng gạch nối).'},
dat:['Nêu đúng tác dụng của dấu gạch ngang, dấu phẩy.','Đặt dấu câu đúng khi viết.','Viết đúng tên người, tên địa lí nước ngoài.'],
mo2:['Phân biệt các công dụng khác nhau của dấu gạch ngang trong cùng một đoạn.'],
mo3:['Đặt dấu phẩy làm thay đổi nghĩa của câu; sửa lỗi dấu câu trong đoạn văn.']},
q:[[1,'Tên địa lí nước ngoài nào viết đúng?',['Mát-xcơ-va','Mát xcơ va','mát-xcơ-va','Mát-Xcơ-Va'],'Viết hoa chữ cái đầu bộ phận, các tiếng nối bằng gạch nối.'],
[1,'Dấu gạch ngang trong câu “– Con chào mẹ ạ!” dùng để:',['đánh dấu lời nói của nhân vật','đánh dấu phần chú thích','liệt kê','nối các từ trong một liên danh'],'Gạch ngang đầu dòng đánh dấu lời đối thoại.'],
[1,'Dấu phẩy trong câu “Sáng nay, em đi học sớm.” dùng để:',['ngăn cách trạng ngữ với chủ ngữ và vị ngữ','ngăn cách các vế câu ghép','ngăn cách các vị ngữ','kết thúc câu'],'“Sáng nay” là trạng ngữ chỉ thời gian.'],
[1,'Tên người nước ngoài nào viết đúng (phiên âm Hán Việt)?',['Lỗ Tấn','Lỗ tấn','lỗ Tấn','Lỗ-Tấn'],'Phiên âm Hán Việt viết như tên người Việt.'],
[2,'Dấu gạch ngang trong “Chuyến tàu Hà Nội – Lào Cai khởi hành lúc 9 giờ” dùng để:',['nối các từ trong một liên danh','đánh dấu lời nói','đánh dấu chú thích','liệt kê'],'Nối hai địa danh đầu và cuối tuyến đường.'],
[2,'Câu nào đặt dấu phẩy đúng?',['Trong vườn, hoa hồng, hoa cúc, hoa lan đua nhau nở.','Trong vườn hoa hồng, hoa cúc hoa lan, đua nhau nở.','Trong, vườn hoa hồng hoa cúc hoa lan đua nhau nở.','Trong vườn hoa hồng hoa cúc, hoa lan đua nhau, nở.'],'Phẩy sau trạng ngữ và giữa các bộ phận cùng làm chủ ngữ.'],
[2,'Tên nào viết đúng?',['Lê-ô-nác-đô đa Vin-xi','Lê-Ô-Nác-Đô Đa-Vin-Xi','lê-ô-nác-đô đa vin-xi','Lê ô nác đô đa Vin xi'],'Mỗi bộ phận viết hoa chữ đầu (riêng “đa” là từ nối giữ chữ thường theo cách viết quen dùng); các tiếng trong bộ phận nối bằng gạch nối.'],
[2,'“Nam – lớp trưởng lớp 5A – là người rất tốt bụng.” Dấu gạch ngang dùng để:',['đánh dấu phần chú thích','đánh dấu lời nói','liệt kê','nối liên danh'],'“lớp trưởng lớp 5A” chú thích thêm cho “Nam”.'],
[3,'Trong câu “Mẹ em, bố em, ông em đều là giáo viên.”, dấu phẩy ngăn cách:',['các bộ phận cùng làm chủ ngữ','trạng ngữ và chủ ngữ','các vế câu ghép','các vị ngữ'],'Ba bộ phận cùng làm chủ ngữ cho “đều là giáo viên”.'],
[3,'Câu nào dùng dấu phẩy để ngăn cách các <b>vế câu ghép</b>?',['Gió thổi mạnh, cây đổ rạp.','Chiều nay, em đi đá bóng.','Lan, Hoa, Mai đều học giỏi.','Bé vừa hát, vừa múa.'],'Hai vế: Gió / thổi mạnh; cây / đổ rạp.'],
[3,'Dòng nào viết đúng tên địa lí nước ngoài?',['Pa-ri; Luân Đôn; Tô-ki-ô','Pa ri; Luân đôn; Tô ki ô','Pa-Ri; Luân-Đôn; Tô-Ki-Ô','pa-ri; luân đôn; tô-ki-ô'],'“Luân Đôn” là phiên âm Hán Việt nên viết như tên Việt; Pa-ri, Tô-ki-ô phiên âm trực tiếp.']]},
{id:'t8',name:'Biện pháp tu từ',sgk:'Luyện từ và câu',
theory:{tom:['<b>Điệp từ, điệp ngữ</b>: lặp lại một từ hoặc một cụm từ để nhấn mạnh ý, tạo nhịp điệu, gây ấn tượng.','<b>So sánh</b>: đối chiếu sự vật này với sự vật khác có nét giống nhau (thường có từ “như, giống như, tựa như, là”).','<b>Nhân hóa</b>: gọi, tả, trò chuyện với con vật, đồ vật, cây cối… như với con người.'],
nho:['Ba cách nhân hóa: gọi vật bằng từ gọi người (chị gió, ông mặt trời); tả vật bằng từ ngữ tả người (lá thì thầm); trò chuyện với vật như với người.','Trả lời câu hỏi “tác dụng”: nêu biện pháp + giúp sự vật thế nào + thể hiện tình cảm gì.'],
luu:['Lặp từ do viết vụng (thừa) khác điệp từ (có dụng ý nghệ thuật).','Không phải câu nào có “như” cũng là so sánh: “Như mọi ngày, em đi học” không phải so sánh.'],
nghi:['Gạch chân từ ngữ đặc biệt: từ lặp lại, từ “như”, từ chỉ người dùng cho vật.','Nói rõ tác dụng: làm hình ảnh sinh động, gần gũi, nhấn mạnh cảm xúc…'],
vd:{de:'“Ông mặt trời đạp xe qua núi.” dùng biện pháp gì?',giai:'Nhân hóa: gọi mặt trời là “ông”, tả bằng hoạt động của người “đạp xe”.'},
dat:['Nhận biết điệp từ, điệp ngữ, so sánh, nhân hóa.','Nêu được tác dụng của biện pháp tu từ.','Biết dùng biện pháp tu từ khi viết văn.'],
mo2:['Câu dùng phối hợp hai biện pháp.'],
mo3:['Viết đoạn cảm nhận về hình ảnh đẹp có biện pháp tu từ (dạng đề học sinh giỏi).']},
q:[[1,'Câu “Ông mặt trời đạp xe qua núi.” dùng biện pháp:',['nhân hóa','so sánh','điệp từ','liệt kê'],'Gọi mặt trời là “ông”, tả hoạt động “đạp xe” như người.'],
[1,'Câu “Mặt hồ phẳng lặng như tấm gương.” dùng biện pháp:',['so sánh','nhân hóa','điệp ngữ','đảo ngữ'],'So sánh mặt hồ với tấm gương bằng từ “như”.'],
[1,'Câu “Học, học nữa, học mãi.” lặp lại từ “học” để:',['nhấn mạnh việc học tập không ngừng','so sánh','nhân hóa','tả cảnh'],'Điệp từ “học” nhấn mạnh ý chí học tập suốt đời.'],
[1,'Từ ngữ nào thường dùng trong phép so sánh?',['như','và','nhưng','của'],'“Như, giống như, tựa như, là”.'],
[2,'“Nhớ con sông quê, nhớ cánh đồng lúa, nhớ cả tiếng sáo diều chiều chiều.” Từ được điệp lại là:',['nhớ','con sông','cánh đồng','chiều chiều'],'Từ “nhớ” lặp lại ba lần, nhấn mạnh nỗi nhớ quê.'],
[2,'Câu nào <b>vừa</b> có so sánh <b>vừa</b> có nhân hóa?',['Chị gió dịu dàng như bàn tay mẹ vuốt ve.','Gió thổi mạnh.','Bầu trời xanh như ngọc.','Cô gió đi chơi xa.'],'“Chị gió” là nhân hóa; “như bàn tay mẹ” là so sánh.'],
[2,'“Mỗi ngày em đọc sách. Mỗi ngày em tập thể dục. Mỗi ngày em giúp mẹ việc nhà.” Điệp ngữ “Mỗi ngày” có tác dụng:',['nhấn mạnh thói quen đều đặn','làm câu ngắn hơn','so sánh','nhân hóa'],'Lặp “Mỗi ngày” nhấn mạnh sự chăm chỉ, đều đặn.'],
[3,'Câu “Những chiếc lá vàng thì thầm kể chuyện mùa thu.” nhân hóa bằng cách nào?',['Dùng từ chỉ hoạt động của người để tả vật','Gọi vật bằng từ dùng để gọi người','Trò chuyện với vật như với người','Dùng từ “như”'],'“Thì thầm, kể chuyện” là hoạt động của con người.'],
[3,'Câu nào <b>không</b> dùng biện pháp tu từ?',['Em đi học lúc 6 giờ sáng.','Trăng tròn như quả bóng.','Bác chim sẻ chào buổi sáng.','Đi, đi mãi, đi không ngừng.'],'Câu chỉ kể sự việc bình thường.'],
[3,'“Đôi bàn tay mẹ ráp như vỏ cây bàng.” Hình ảnh so sánh giúp người đọc cảm nhận:',['sự vất vả, tần tảo của mẹ','mẹ rất giàu','mẹ trồng cây bàng','bàn tay mẹ mềm mại'],'Bàn tay thô ráp gợi những năm tháng lao động vất vả của mẹ.']]},
{id:'t9',name:'Đọc hiểu văn bản',sgk:'Đọc',
theory:{tom:['Đọc hiểu gồm: nắm <b>nội dung chính</b>, tìm <b>chi tiết</b>, hiểu <b>ý nghĩa</b> hình ảnh, từ ngữ, rút ra <b>bài học</b>.','Câu hỏi thường có ba mức: nhận biết (tìm trong bài), hiểu (giải thích), vận dụng (liên hệ bản thân).'],
nho:['Đọc toàn bài một lượt trước khi trả lời.','Câu hỏi “Vì sao…?” → tìm lí do trong bài, trả lời “Vì…”.','Câu hỏi “Ý nghĩa / bài học” → nói khái quát, không kể lại chi tiết.'],

{id:'t10',name:'Tập làm văn',sgk:'Viết',
theory:{tom:['Các kiểu bài trọng tâm lớp 5: <b>kể chuyện sáng tạo</b>; <b>tả phong cảnh</b>; <b>tả người</b>; <b>đoạn văn nêu ý kiến</b> (tán thành hay phản đối một hiện tượng); <b>đoạn văn thể hiện tình cảm, cảm xúc</b>; <b>giới thiệu nhân vật</b> trong sách đã đọc.','Bài văn có 3 phần: <b>Mở bài – Thân bài – Kết bài</b>.','Mở bài trực tiếp (giới thiệu ngay) hoặc gián tiếp (dẫn dắt từ chuyện khác). Kết bài không mở rộng (nêu cảm nghĩ) hoặc mở rộng (liên hệ, bình luận thêm).'],
nho:['<b>Tả phong cảnh</b>: tả bao quát → tả chi tiết theo thời gian hoặc không gian; dùng nhiều giác quan.','<b>Tả người</b>: ngoại hình (nét riêng) → tính tình, hoạt động (qua việc làm, lời nói) → kỉ niệm.','<b>Nêu ý kiến</b>: nêu ý kiến → lí do, dẫn chứng → khẳng định lại.','<b>Kể chuyện sáng tạo</b>: có thể đổi ngôi kể, thêm chi tiết, viết kết thúc mới nhưng hợp lí.'],
luu:['Chọn chi tiết <b>riêng</b>, tránh tả chung chung “mắt to, mũi cao”.','Dùng biện pháp so sánh, nhân hóa để bài văn sinh động.','Lập dàn ý trước khi viết; viết xong đọc lại sửa lỗi chính tả, dấu câu.'],
nghi:['Đọc đề, gạch chân: kiểu bài, đối tượng, phạm vi.','Lập dàn ý ba phần.','Viết từng đoạn, mỗi đoạn một ý.','Đọc lại, sửa lỗi.'],
vd:{de:'Mở bài gián tiếp cho đề “Tả một cảnh đẹp ở quê em”.',giai:'“Ai đi xa cũng mang theo hình bóng quê nhà. Với em, đó là con đê đầu làng mỗi buổi chiều lộng gió…”'},
dat:['Lập được dàn ý cho từng kiểu bài.','Viết mở bài, kết bài theo hai cách.','Viết đoạn văn có hình ảnh, cảm xúc, dùng từ đúng.'],
mo2:['Phân biệt mở bài trực tiếp – gián tiếp, kết bài mở rộng – không mở rộng.'],
mo3:['Viết sáng tạo: đổi ngôi kể, thêm chi tiết, bình luận; kết hợp miêu tả với kể và biểu cảm.']},

[1,'Mở bài <b>gián tiếp</b> là:',['Nói chuyện khác có liên quan rồi dẫn vào đối tượng tả','Giới thiệu ngay đối tượng tả','Nêu cảm nghĩ cuối bài','Tả chi tiết đối tượng'],'Gián tiếp = dẫn dắt.'],

[3,'Để bài văn tả người sinh động, cách nào hiệu quả nhất?',['Lồng tả ngoại hình với hoạt động, lời nói, kỉ niệm; chọn chi tiết riêng','Dùng thật nhiều từ chung chung như đẹp, tốt','Kể tên tất cả bộ phận cơ thể','Chép bài văn mẫu'],'Chi tiết riêng và hoạt động giúp nhân vật hiện lên rõ nét.'],

[3,'Kể chuyện sáng tạo có thể:',['Thay đổi kết thúc, thêm chi tiết, đổi ngôi kể nhưng vẫn hợp lí','Chép nguyên văn câu chuyện','Kể điều không liên quan đến truyện','Chỉ tóm tắt câu chuyện'],'Sáng tạo nhưng phải hợp lí, giữ ý nghĩa.']]}

T1.gen={1:[
()=>{const g=pick(DN);const [w,c]=take(g,2);const others=take(DN.filter(x=>x!==g).flat(),3);return MC(`Từ nào đồng nghĩa với “<b>${w}</b>”?`,c,others,`“${w}” và “${c}” có nghĩa giống nhau hoặc gần giống nhau. Cả nhóm: ${g.join(', ')}.`)},
()=>{const g=pick(DN);const right=take(g,3).join(', ');const ds=[0,1,2].map(()=>{const gs=take(DN,3);return gs.map(x=>pick(x)).join(', ')});return MC('Dòng nào gồm các từ <b>đồng nghĩa</b> với nhau?',right,ds,`Ba từ trong dòng đúng cùng chỉ một ý: ${g.join(', ')}. Các dòng khác ghép từ ở nhiều nhóm nghĩa khác nhau.`)}],
2:[()=>{const g=pick(DN);const three=take(g,3);const g2=pick(DN.filter(x=>x!==g));const odd=pick(g2);return MC(`Từ nào <b>không</b> cùng nhóm nghĩa với các từ còn lại: ${shuffle([...three,odd]).join(', ')}?`,odd,three,`${three.join(', ')} đồng nghĩa với nhau. “${odd}” thuộc nhóm nghĩa khác (${g2.join(', ')}).`)},
()=>{const it=pick(DNctx);return MC(`Chọn từ phù hợp nhất điền vào chỗ trống: “${it[0]}”`,it[1],it[2],it[3])}],
3:[()=>{const it=pick(DNctx);return MC(`Vì sao trong câu “${it[0].replace('___','<b>'+it[1]+'</b>')}” dùng từ “${it[1]}” là phù hợp nhất?`,it[3].replace(/^“[^”]+” /,'Vì từ này '),[`Vì “${it[1]}” là từ duy nhất có nghĩa`,`Vì “${it[1]}” ngắn gọn hơn`,`Vì các từ đồng nghĩa khác đều sai chính tả`],`Các từ đồng nghĩa không hoàn toàn khác nhau về sắc thái. ${it[3]}`)}]};

2:[()=>{const d=pick(DONGAM);const ws=take(DA,3);return MC('Cặp câu nào có từ in đậm là <b>từ đồng âm</b>?',`${hl(d[1],d[0])} / ${hl(d[2],d[0])}`,ws.map(e=>`${hl(pick(e.g),e.w)} / ${hl(pick(e.c),e.w)}`),`Hai từ “${d[0]}” giống nhau về âm nhưng nghĩa hoàn toàn khác, không liên quan → đồng âm. Các cặp còn lại là một từ đa nghĩa (nghĩa gốc – nghĩa chuyển).`)},

[3,'Đâu là cách dùng điệp ngữ <b>có dụng ý nghệ thuật</b>?',['“Việt Nam ơi, Việt Nam ơi, mùa xuân về rồi!”','“Em đi học. Em đi học về. Em đi học bài.”','“Cái bàn cái bàn rất to.”','“Hôm nay hôm nay em vui.”'],'Lặp “Việt Nam ơi” để bộc lộ cảm xúc tha thiết; các câu khác lặp do viết vụng.']]);
addQ('t10',[[3,'Câu nào là câu văn tả ngoại hình có hình ảnh sinh động nhất?',['Mái tóc bà bạc trắng như cước, búi gọn sau gáy.','Bà có mái tóc.','Tóc bà màu trắng.','Bà em có tóc rất đẹp.'],'Câu có so sánh (như cước) và chi tiết cụ thể (búi gọn sau gáy).'],
[3,'Trong bài tả cảnh, câu nào dùng nhiều giác quan nhất?',['Gió đưa hương lúa thơm ngát, tiếng chim ríu rít, cánh đồng vàng rực.','Cánh đồng rất đẹp.','Em thích cánh đồng.','Cánh đồng có lúa.'],'Câu có mùi (thơm), âm thanh (ríu rít), màu sắc (vàng rực).'],
[3,'Khi viết đoạn văn nêu ý kiến “Học sinh có nên dùng điện thoại nhiều không?”, câu mở đoạn tốt nhất là:',['Theo em, học sinh không nên dùng điện thoại quá nhiều.','Điện thoại có nhiều màu.','Hôm qua em xem phim.','Em có một chiếc điện thoại.'],'Câu mở đoạn cần nêu rõ ý kiến.']]);

<script>
/* ==== hinh-ve.js ==== */
/* ===== HÌNH VẼ (SVG, màu theo token để hợp cả nền sáng/tối) ===== */
const C={ink:'var(--ink)',soft:'var(--ink-soft)',faint:'var(--ink-faint)',a:'var(--tim)',aS:'var(--tim-soft)',b:'var(--tv)',bS:'var(--tv-soft)',r:'var(--red)',rS:'var(--red-soft)',g:'var(--green)',gS:'var(--green-soft)',y:'var(--amber)',yS:'var(--amber-soft)',bg:'var(--card)',grid:'var(--border)'};
const svg=(w,h,body,label)=>`<svg class="fig" viewBox="0 0 ${Math.round(w)} ${Math.round(h)}" style="max-width:${Math.round(w*1.05)}px" role="img" aria-label="${label||'Hình minh họa'}">${body}</svg>`;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${o.fs||13}" font-weight="${o.fw||500}" fill="${o.c||C.ink}">${s}</text>`;
const Ln=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||C.ink}" stroke-width="${o.w||1.5}" ${o.d?`stroke-dasharray="${o.d}"`:''} stroke-linecap="round"/>`;
const Rc=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.f||'none'}" stroke="${o.s||C.ink}" stroke-width="${o.w||1.5}" ${o.rx?`rx="${o.rx}"`:''} ${o.d?`stroke-dasharray="${o.d}"`:''}/>`;
const Pg=(pts,o={})=>`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${o.f||'none'}" stroke="${o.s||C.ink}" stroke-width="${o.w||1.5}" stroke-linejoin="round" ${o.d?`stroke-dasharray="${o.d}"`:''}/>`;
const Ci=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||'none'}" stroke="${o.s||C.ink}" stroke-width="${o.w||1.5}" ${o.d?`stroke-dasharray="${o.d}"`:''}/>`;
const Ar=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),L=8;const p1=[x2-L*Math.cos(a-0.45),y2-L*Math.sin(a-0.45)],p2=[x2-L*Math.cos(a+0.45),y2-L*Math.sin(a+0.45)];return Ln(x1,y1,x2,y2,o)+`<polygon points="${x2},${y2} ${p1.join(',')} ${p2.join(',')}" fill="${o.c||C.ink}"/>`};
/* ngoặc nhọn ngang (dưới: dir=1, trên: dir=-1) */
const BrH=(x1,x2,y,dir,label,o={})=>{const h=9*dir,m=(x1+x2)/2;return `<path d="M${x1},${y} q0,${h} ${Math.min(10,(x2-x1)/4)},${h} L${m-6},${y+h} q6,0 6,${h} q0,${-h} 6,${-h} L${x2-Math.min(10,(x2-x1)/4)},${y+h} q${Math.min(10,(x2-x1)/4)},0 ${Math.min(10,(x2-x1)/4)},${-h}" fill="none" stroke="${o.c||C.ink}" stroke-width="1.5"/>`+T(m,y+h*2+(dir>0?12:-4),label,{fw:700,c:o.c||C.ink})};
/* ngoặc nhọn dọc bên phải */
const BrV=(x,y1,y2,label,o={})=>{const w=9,m=(y1+y2)/2;return `<path d="M${x},${y1} q${w},0 ${w},10 L${x+w},${m-6} q0,6 ${w},6 q${-w},0 ${-w},6 L${x+w},${y2-10} q0,10 ${-w},10" fill="none" stroke="${o.c||C.ink}" stroke-width="1.5"/>`+T(x+w*2+6,m+5,label,{a:'start',fw:700,c:o.c||C.ink})};
const n2=v=>fmt(v);

/* ---------- SƠ ĐỒ ĐOẠN THẲNG ---------- */
function figSeg(f){
  const names=f.names||['Số bé','Số lớn'];const x0=96;const W=500;
  if(f.t==='th'){const big=(f.S+f.D)/2,sm=(f.S-f.D)/2;const k=300/Math.max(big,1e-9);const ws=Math.max(40,sm*k),wb=ws+Math.max(30,f.D*k);
    let b=T(x0-10,38,names[0],{a:'end'})+Rc(x0,24,ws,22,{f:C.aS,s:C.a})+T(x0-10,88,names[1],{a:'end'})+Rc(x0,74,ws,22,{f:C.aS,s:C.a})+Rc(x0+ws,74,wb-ws,22,{f:C.yS,s:C.y})+Ln(x0+ws,20,x0+ws,100,{c:C.faint,d:'4 4'});
    b+=BrH(x0+ws,x0+wb,96,1,'Hiệu: '+n2(f.D),{c:C.y})+BrV(x0+wb+6,24,96,'Tổng: '+n2(f.S));return svg(W,140,b,'Sơ đồ tổng – hiệu')}
  const m=f.m,n=f.n;const u=Math.min(42,300/Math.max(m,n));let b='';
  const row=(y,k,lab,col)=>{let s=T(x0-10,y+15,lab,{a:'end'});for(let i=0;i<k;i++)s+=Rc(x0+i*u,y,u,22,{f:i>=m&&col?C.yS:C.aS,s:i>=m&&col?C.y:C.a});return s};
  b+=row(24,m,names[0],false)+row(74,n,names[1],f.t==='ht');
  if(f.t==='tt'){b+=BrV(x0+Math.max(m,n)*u+6,24,96,'Tổng: '+n2(f.S));if(f.unit)b+=T(x0+u/2,18,'1 phần',{fs:11,c:C.soft})}
  else{b+=Ln(x0+m*u,20,x0+m*u,100,{c:C.faint,d:'4 4'})+BrH(x0+m*u,x0+n*u,96,1,'Hiệu: '+n2(f.D),{c:C.y})}
  return svg(W,f.t==='ht'?140:118,b,f.t==='tt'?'Sơ đồ tổng – tỉ':'Sơ đồ hiệu – tỉ')}

/* ---------- HÌNH HỌC PHẲNG ---------- */
function figTri(f){const a=f.a,h=f.h;const k=Math.min(240/a,130/h);const W=a*k,H=h*k;const x0=40,y0=H+30;const ax=x0+W*0.32;
  let b=Pg([[x0,y0],[x0+W,y0],[ax,y0-H]],{f:C.aS,s:C.a,w:2})+Ln(ax,y0-H,ax,y0,{c:C.r,d:'5 4'})+Rc(ax,y0-10,10,10,{s:C.r,w:1.2});
  b+=T(x0+W/2,y0+20,'đáy a = '+n2(a))+T(ax+8,y0-H/2,'h = '+n2(h),{a:'start',c:C.r,fw:700});return svg(Math.max(320,W+80),y0+32,b,'Tam giác với đáy và chiều cao')}
function figTrap(f){const {a,b:bb,h}=f;const k=Math.min(260/a,120/h);const W=a*k,Wb=bb*k,H=h*k;const x0=30,y0=H+34;const off=(W-Wb)*0.35;
  let s=Pg([[x0,y0],[x0+W,y0],[x0+off+Wb,y0-H],[x0+off,y0-H]],{f:C.aS,s:C.a,w:2})+Ln(x0+off,y0-H,x0+off,y0,{c:C.r,d:'5 4'});
  s+=T(x0+W/2,y0+20,'đáy lớn a = '+n2(a))+T(x0+off+Wb/2,y0-H-8,'đáy bé b = '+n2(bb))+T(x0+off-6,y0-H/2,'h = '+n2(h),{a:'end',c:C.r,fw:700});return svg(Math.max(340,W+70),y0+30,s,'Hình thang')}
function figCirc(f){const r=f.r;const R=70;const cx=110,cy=90;let s=Ci(cx,cy,R,{f:C.aS,s:C.a,w:2})+Ci(cx,cy,3,{f:C.ink})+Ln(cx,cy,cx+R*Math.cos(-0.6),cy+R*Math.sin(-0.6),{c:C.r,w:2})+Ln(cx-R,cy,cx+R,cy,{c:C.b,d:'5 4',w:2});
  s+=T(cx-4,cy-6,'O',{a:'end',fs:12})+T(cx+R*0.62,cy-R*0.42,'r = '+n2(r),{a:'start',c:C.r,fw:700})+T(cx,cy+18,'d = '+n2(2*r),{c:C.b,fw:700});
  s+=T(210,60,'C = d × 3,14',{a:'start'})+T(210,82,'= '+n2(2*r)+' × 3,14 = '+n2(2*r*3.14),{a:'start',c:C.soft})+T(210,112,'S = r × r × 3,14',{a:'start'})+T(210,134,'= '+n2(r)+' × '+n2(r)+' × 3,14 = '+n2(r*r*3.14),{a:'start',c:C.soft});return svg(440,180,s,'Hình tròn')}
function figSqCirc(f){const r=f.r;const s0=150,x=30,y=20;let s=Rc(x,y,s0,s0,{f:C.rS,s:C.r,w:2})+Ci(x+s0/2,y+s0/2,s0/2,{f:C.bg,s:C.a,w:2})+Ln(x+s0/2,y+s0/2,x+s0,y+s0/2,{c:C.a,d:'4 3'});
  s+=T(x+s0*0.78,y+s0/2-6,'r = '+r,{fs:12,c:C.a,fw:700})+T(x+s0/2,y+s0+20,'cạnh = 2 × r = '+2*r)+T(220,70,'Phần tô đỏ = S vuông − S tròn',{a:'start'})+T(220,95,'= '+4*r*r+' − '+n2(3.14*r*r),{a:'start',c:C.soft})+T(220,120,'= '+n2(4*r*r-3.14*r*r),{a:'start',c:C.r,fw:700});return svg(460,200,s,'Hình vuông và hình tròn nội tiếp')}
function figSqGrow(f){const k=f.k;const a=110,kk=30,x=30,y=40;let s=Rc(x,y+kk,a,a,{f:C.aS,s:C.a,w:2})+Rc(x+a,y+kk,kk,a,{f:C.yS,s:C.y})+Rc(x,y,a,kk,{f:C.yS,s:C.y})+Rc(x+a,y,kk,kk,{f:C.rS,s:C.r});
  s+=T(x+a/2,y+kk+a/2+4,'hình vuông cũ')+T(x+a/2,y+kk+a+18,'a')+T(x+a+kk/2,y+kk+a+18,n2(k),{c:C.y})+T(x+a+kk/2,y+kk/2+5,n2(k)+'×'+n2(k),{fs:11,c:C.r});
  s+=T(210,70,'Phần tăng thêm gồm:',{a:'start'})+T(210,94,'• 2 hình chữ nhật a × '+n2(k),{a:'start',c:C.y})+T(210,118,'• 1 hình vuông nhỏ '+n2(k)+' × '+n2(k),{a:'start',c:C.r});return svg(470,220,s,'Hình vuông mở rộng cạnh')}
function figABM(f){const B=[40,170],Cc=[340,170],A=[140,30];const M=[B[0]+(Cc[0]-B[0])*f.p/f.q,170];let s=Pg([A,B,Cc],{f:'none',s:C.ink,w:2})+Pg([A,B,M],{f:C.aS,s:C.a,w:2})+Ln(A[0],A[1],A[0],170,{c:C.r,d:'5 4'});
  s+=T(A[0],A[1]-8,'A',{fw:700})+T(B[0]-8,B[1]+16,'B',{fw:700})+T(Cc[0]+8,Cc[1]+16,'C',{fw:700})+T(M[0],M[1]+16,'M',{fw:700})+T(A[0]+6,150,'chung chiều cao',{a:'start',fs:11,c:C.r});
  s+=BrH(B[0],M[0],176,1,'BM = '+f.p+'/'+f.q+' BC',{c:C.a});return svg(380,230,s,'Tam giác chung chiều cao')}
function figRect(f){const k=Math.min(260/f.L,120/f.W);const w=f.L*k,h=f.W*k;let s=Rc(30,20,w,h,{f:C.aS,s:C.a,w:2})+T(30+w/2,20+h+18,'dài '+n2(f.L))+T(30+w+8,20+h/2+4,'rộng '+n2(f.W),{a:'start'});return svg(w+120,h+50,s,'Hình chữ nhật')}

/* ---------- HÌNH KHỐI (phối cảnh xiên) ---------- */
function boxPts(a,b,c,s,x0,y0){const dx=b*s*0.5*0.7071,dy=-b*s*0.5*0.7071;const A=[x0,y0],B=[x0+a*s,y0],Cc=[x0+a*s,y0-c*s],D=[x0,y0-c*s];const sh=p=>[p[0]+dx,p[1]+dy];return {A,B,C:Cc,D,A2:sh(A),B2:sh(B),C2:sh(Cc),D2:sh(D),dx,dy}}
function figBox(f){const {a,b,c}=f;const s=Math.min(200/(a+b*0.35),130/(c+b*0.35),40);const x0=80,y0=30+c*s+b*s*0.36;const P=boxPts(a,b,c,s,x0,y0);
  let o='';if(f.water){const wh=f.water*s;const W=boxPts(a,b,f.water,s,x0,y0);o+=Pg([W.A,W.B,W.C,W.D],{f:C.bS,s:'none'})+Pg([W.B,W.B2,W.C2,W.C],{f:C.bS,s:'none'})+Pg([W.D,W.C,W.C2,W.D2],{f:C.bS,s:C.b,w:1})}
  else o+=Pg([P.A,P.B,P.C,P.D],{f:C.aS,s:'none'})+Pg([P.B,P.B2,P.C2,P.C],{f:C.aS,s:'none'})+Pg([P.D,P.C,P.C2,P.D2],{f:C.aS,s:'none'});
  if(f.grid&&a<=10&&b<=10&&c<=10){for(let i=1;i<a;i++){o+=Ln(x0+i*s,y0,x0+i*s,y0-c*s,{c:C.a,w:.6})+Ln(x0+i*s,y0-c*s,x0+i*s+P.dx,y0-c*s+P.dy,{c:C.a,w:.6})}for(let j=1;j<c;j++){o+=Ln(x0,y0-j*s,x0+a*s,y0-j*s,{c:C.a,w:.6})+Ln(x0+a*s,y0-j*s,x0+a*s+P.dx,y0-j*s+P.dy,{c:C.a,w:.6})}for(let k=1;k<b;k++){const ox=P.dx*k/b,oy=P.dy*k/b;o+=Ln(x0+ox,y0-c*s+oy,x0+a*s+ox,y0-c*s+oy,{c:C.a,w:.6})+Ln(x0+a*s+ox,y0+oy,x0+a*s+ox,y0-c*s+oy,{c:C.a,w:.6})}}
  o+=Ln(...P.A,...P.A2,{d:'4 4',c:C.faint})+Ln(...P.A2,...P.B2,{d:'4 4',c:C.faint})+Ln(...P.A2,...P.D2,{d:'4 4',c:C.faint});
  o+=Pg([P.A,P.B,P.C,P.D],{s:C.a,w:2})+Ln(...P.B,...P.B2,{c:C.a,w:2})+Ln(...P.C,...P.C2,{c:C.a,w:2})+Ln(...P.D,...P.D2,{c:C.a,w:2})+Ln(...P.B2,...P.C2,{c:C.a,w:2})+Ln(...P.C2,...P.D2,{c:C.a,w:2});
  const lb=f.lbl||['dài '+n2(a),'rộng '+n2(b),'cao '+n2(c)];o+=T(x0+a*s/2,y0+18,lb[0])+T(x0-8,y0-c*s/2+4,lb[2],{a:'end'})+T(P.B[0]+P.dx/2+10,P.B[1]+P.dy/2+12,lb[1],{a:'start'});
  if(f.water)o+=T(x0+a*s/2,y0-f.water*s/2+4,f.wl||'nước',{c:C.b,fw:700});
  const W=x0+a*s+P.dx+90+(f.padR||0);return svg(Math.max(320,W),y0+30,o,'Hình hộp chữ nhật')}
function figCubePaint(f){const n=f.n;const s=Math.min(26,150/n);const x0=40,y0=30+n*s*1.36;const P=boxPts(n,n,n,s,x0,y0);let o=Pg([P.A,P.B,P.C,P.D],{f:C.aS,s:'none'})+Pg([P.B,P.B2,P.C2,P.C],{f:C.aS,s:'none'})+Pg([P.D,P.C,P.C2,P.D2],{f:C.aS,s:'none'});
  for(let i=1;i<n;i++){const ox=P.dx*i/n,oy=P.dy*i/n;o+=Ln(x0+i*s,y0,x0+i*s,y0-n*s,{c:C.a,w:.7})+Ln(x0,y0-i*s,x0+n*s,y0-i*s,{c:C.a,w:.7})+Ln(x0+i*s,y0-n*s,x0+i*s+P.dx,y0-n*s+P.dy,{c:C.a,w:.7})+Ln(x0+ox,y0-n*s+oy,x0+n*s+ox,y0-n*s+oy,{c:C.a,w:.7})+Ln(x0+n*s+ox,y0+oy,x0+n*s+ox,y0-n*s+oy,{c:C.a,w:.7})+Ln(x0+n*s,y0-i*s,x0+n*s+P.dx,y0-i*s+P.dy,{c:C.a,w:.7})}
  o+=Rc(P.D[0]-2,P.D[1]-2,s+4,s+4,{s:C.r,w:2.5})+Rc(P.D[0]+s-2,P.D[1]-2,s*(n-2)+4,s+4,{s:C.y,w:2.5});
  o+=Pg([P.A,P.B,P.C,P.D],{s:C.a,w:2})+Ln(...P.B,...P.B2,{c:C.a,w:2})+Ln(...P.C,...P.C2,{c:C.a,w:2})+Ln(...P.D,...P.D2,{c:C.a,w:2})+Ln(...P.B2,...P.C2,{c:C.a,w:2})+Ln(...P.C2,...P.D2,{c:C.a,w:2});
  const tx=x0+n*s+P.dx+24;o+=T(tx,50,'Ô ở đỉnh: 3 mặt sơn (8 khối)',{a:'start',c:C.r,fs:12})+T(tx,74,'Ô trên cạnh, trừ đỉnh: 2 mặt',{a:'start',c:C.y,fs:12})+T(tx,94,'(12 cạnh × '+(n-2)+' = '+12*(n-2)+')',{a:'start',c:C.soft,fs:12})+T(tx,118,'Ô giữa mặt: 1 mặt',{a:'start',fs:12})+T(tx,138,'(6 × '+(n-2)+' × '+(n-2)+' = '+6*(n-2)*(n-2)+')',{a:'start',c:C.soft,fs:12})+T(tx,162,'Ô bên trong: không sơn',{a:'start',fs:12})+T(tx,182,'('+(n-2)+' × '+(n-2)+' × '+(n-2)+' = '+Math.pow(n-2,3)+')',{a:'start',c:C.soft,fs:12});
  return svg(tx+210,Math.max(y0+20,200),o,'Hình lập phương sơn 6 mặt cắt thành khối nhỏ')}

/* ---------- CHUYỂN ĐỘNG ---------- */
const car=(x,y,col,dir)=>`<g transform="translate(${x},${y}) scale(${dir},1)"><rect x="-16" y="-12" width="32" height="12" rx="3" fill="${col}"/><rect x="-9" y="-19" width="16" height="8" rx="2" fill="${col}"/><circle cx="-9" cy="1" r="3.5" fill="${C.ink}"/><circle cx="9" cy="1" r="3.5" fill="${C.ink}"/></g>`;
function figMeet(f){const x1=40,x2=460,y=70;const p=x1+(x2-x1)*f.v1/(f.v1+f.v2);let s=Ln(x1,y,x2,y,{w:2.5})+Ci(x1,y,4,{f:C.ink})+Ci(x2,y,4,{f:C.ink})+T(x1,y+22,'A',{fw:700})+T(x2,y+22,'B',{fw:700});
  s+=car(x1+24,y-6,C.a,1)+car(x2-24,y-6,C.b,-1)+Ar(x1+46,y-24,x1+110,y-24,{c:C.a})+Ar(x2-46,y-24,x2-110,y-24,{c:C.b})+T(x1+78,y-32,n2(f.v1)+' km/giờ',{c:C.a,fs:12,fw:700})+T(x2-78,y-32,n2(f.v2)+' km/giờ',{c:C.b,fs:12,fw:700});
  s+=Ln(p,y-10,p,y+10,{c:C.r,w:2.5})+T(p,y+22,'gặp nhau',{c:C.r,fs:12,fw:700})+BrH(x1,x2,y+30,1,'s = '+n2(f.s)+' km');
  s+=T(250,y+80,'Mỗi giờ hai xe gần nhau thêm '+n2(f.v1)+' + '+n2(f.v2)+' = '+n2(f.v1+f.v2)+' km',{c:C.soft,fs:12});return svg(500,y+92,s,'Hai xe đi ngược chiều')}
function figChase(f){const x1=30,y=70;const L=420;const g=Math.min(200,Math.max(70,L*0.35));let s=Ln(x1,y,x1+L+20,y,{w:2.5})+Ci(x1,y,4,{f:C.ink})+T(x1,y+22,'A',{fw:700});
  s+=car(x1+20,y-6,C.a,1)+car(x1+g,y-6,C.b,1)+T(x1+20,y-26,'ô tô '+n2(f.v2),{c:C.a,fs:12,fw:700})+T(x1+g,y-26,'xe máy '+n2(f.v1),{c:C.b,fs:12,fw:700})+Ar(x1+g+24,y-6,x1+g+70,y-6,{c:C.b})+Ar(x1+44,y+-6,x1+80,y-6,{c:C.a});
  s+=BrH(x1,x1+g,y+8,1,'cách nhau '+n2(f.gap)+' km',{c:C.y})+T(250,y+66,'Mỗi giờ ô tô gần xe máy thêm '+n2(f.v2)+' − '+n2(f.v1)+' = '+n2(f.v2-f.v1)+' km',{c:C.soft,fs:12});return svg(500,y+80,s,'Chuyển động cùng chiều đuổi kịp')}
function figTrain(f){const y=80,x1=40;const tot=f.Lt+f.Lc;const k=400/(f.Lc+2*f.Lt);const bt=f.Lt*k,bc=f.Lc*k;let s=Rc(x1+bt,y,bc,10,{f:C.yS,s:C.y})+T(x1+bt+bc/2,y+28,'cầu '+f.Lc+' m',{c:C.y,fw:700});
  s+=Rc(x1,y-22,bt,18,{f:C.aS,s:C.a,rx:4})+T(x1+bt/2,y-30,'tàu lúc đầu',{fs:11,c:C.a})+Rc(x1+bc+bt,y-22,bt,18,{f:C.aS,s:C.a,rx:4,d:'4 3'})+T(x1+bc+bt*1.5,y-30,'tàu rời cầu',{fs:11,c:C.a});
  s+=Ar(x1+bt,y+44,x1+bt+bc+bt,y+44,{c:C.r})+T(x1+bt+(bc+bt)/2,y+62,'đầu tàu đi: '+f.Lc+' + '+f.Lt+' = '+tot+' m',{c:C.r,fw:700});return svg(500,y+76,s,'Tàu qua cầu')}

/* ---------- KHÁC ---------- */
function figPct(f){const p=Math.round(f.p);const c=16;let s='';for(let i=0;i<100;i++){const r=Math.floor(i/10),q=i%10;s+=Rc(20+q*c,14+r*c,c,c,{f:i<p?C.a:C.bg,s:C.grid,w:1})}
  s+=T(192,70,p+' ô / 100 ô',{a:'start',fw:700,fs:15})+T(192,98,'= '+p+'%',{a:'start',fs:20,fw:700,c:C.a})+T(192,124,'= '+F2(p,100),{a:'start',c:C.soft,fs:15});return svg(310,190,s,'Lưới 100 ô biểu diễn phần trăm')}
const F2=(a,b)=>a+'/'+b;
function figFrac(f){const d=f.d,n=f.n;const W=360,u=W/d;let s='';for(let i=0;i<d;i++)s+=Rc(20+i*u,40,u,30,{f:i<n?C.a:C.bg,s:C.a});
  if(f.total!=null){s+=BrH(20,20+W,36,-1,'Tổng: '+n2(f.total));s+=BrH(20,20+n*u,74,1,n+'/'+d+' = '+n2(f.total)+' × '+n+'/'+d+' = '+n2(f.total*n/d),{c:C.a})}
  else{s+=T(20+W/2,24,'Chia thành '+d+' phần bằng nhau, tô '+n+' phần → '+n+'/'+d,{fw:600})}return svg(400,f.total!=null?118:90,s,'Biểu diễn phân số')}
function figPie(f){const parts=f.parts,labels=f.labels||[];const cols=[C.a,C.b,C.y,C.r,C.g];let a0=-Math.PI/2,s='';const cx=100,cy=100,R=80;
  parts.forEach((p,i)=>{const a1=a0+p/100*2*Math.PI;const large=p>50?1:0;s+=`<path d="M${cx},${cy} L${cx+R*Math.cos(a0)},${cy+R*Math.sin(a0)} A${R},${R} 0 ${large} 1 ${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)} Z" fill="${cols[i%5]}" stroke="${C.bg}" stroke-width="2"/>`;const am=(a0+a1)/2;if(p>=6)s+=T(cx+R*0.62*Math.cos(am),cy+R*0.62*Math.sin(am)+4,p+'%',{fs:12,fw:700,c:'var(--on-tim)'});
    s+=Rc(210,30+i*26,14,14,{f:cols[i%5],s:'none'})+T(232,42+i*26,(labels[i]||'Phần '+(i+1))+': '+p+'%',{a:'start'});a0=a1});return svg(420,200,s,'Biểu đồ hình quạt tròn')}
function figTrees(f){const k=f.k,d=f.d;const tree=(x,y)=>`<g transform="translate(${x},${y})"><rect x="-1.5" y="-6" width="3" height="8" fill="${C.y}"/><circle cx="0" cy="-12" r="8" fill="${C.g}"/></g>`;
  if(f.closed){const cx=110,cy=100,R=70;const m=Math.min(k,16);let s=Ci(cx,cy,R,{s:C.b,w:2,d:'2 0'});for(let i=0;i<m;i++){const a=i/m*2*Math.PI-Math.PI/2;s+=tree(cx+R*Math.cos(a),cy+R*Math.sin(a)+6)}
    s+=T(220,80,'Đường khép kín:',{a:'start',fw:700})+T(220,104,'số cây = số khoảng',{a:'start'})+T(220,128,'= '+n2(k*d)+' : '+d+' = '+k,{a:'start',c:C.g,fw:700});return svg(440,190,s,'Trồng cây quanh hồ')}
  const show=Math.min(k,6);const x1=30,y=70,g=50;let s='';const pos=[];for(let i=0;i<=show;i++)pos.push(x1+i*g);if(k>show){pos[show]=x1+(show)*g+30}
  s+=Ln(x1,y,pos[show],y,{w:2});pos.forEach((x,i)=>{s+=tree(x,y)});for(let i=0;i<show-(k>show?1:0);i++)s+=T(pos[i]+g/2,y+20,d+' m',{fs:11,c:C.soft});if(k>show)s+=T(pos[show-1]+(pos[show]-pos[show-1])/2,y+4,'…',{fs:18,fw:700});
  const tx=pos[show]+30;s+=T(tx,50,'Hai đầu đều trồng:',{a:'start',fw:700})+T(tx,74,'số cây = số khoảng + 1',{a:'start'})+T(tx,98,'= '+k+' + 1 = '+(k+1),{a:'start',c:C.g,fw:700});return svg(tx+190,110,s,'Trồng cây hai đầu đường')}
function figTank(f){const a=f.a,b=f.b;const L=lcm(a,b);const W=380,u=W/L;let s=T(20,22,'Cả bể chia thành '+L+' phần bằng nhau:',{a:'start',fw:600});
  for(let i=0;i<L;i++)s+=Rc(20+i*u,34,u,26,{f:i<L/a?C.a:i<L/a+L/b?C.b:C.bg,s:C.border||C.grid,w:1});
  s+=BrH(20,20+L/a*u,64,1,'vòi 1: '+L/a+' phần/giờ',{c:C.a});s+=T(20+(L/a+L/b/2)*u,22+70,'',{});s+=T(20,118,'vòi 2: '+L/b+' phần/giờ  •  cả hai: '+(L/a+L/b)+' phần/giờ',{a:'start',c:C.b,fw:700})+T(20,140,'Thời gian đầy bể: '+L+' : '+(L/a+L/b)+' = '+n2(L/(L/a+L/b))+' giờ',{a:'start'});return svg(420,152,s,'Hai vòi nước chảy chung')}

/* ---------- vẽ theo đặc tả ---------- */
function drawFig(f){if(!f)return '';try{const m={tt:figSeg,ht:figSeg,th:figSeg,tri:figTri,trap:figTrap,circ:figCirc,sqcirc:figSqCirc,sqgrow:figSqGrow,abm:figABM,rect:figRect,box:figBox,cubepaint:figCubePaint,meet:figMeet,chase:figChase,train:figTrain,pct:figPct,frac:figFrac,pie:figPie,trees:figTrees,tank:figTank}[f.t];return m?`<div class="figwrap">${m(f)}</div>`:''}catch(e){return ''}}

const FIstate={};
function figInteractive(id,uid){const f=FI[id];const st=FIstate[uid]=FIstate[uid]||Object.fromEntries(Object.entries(f.p).map(([k,v])=>[k,v[3]]));
  return `<div class="figctl">${Object.entries(f.p).map(([k,v])=>`<label class="rng" for="${uid}-${k}"><span>${v[4]}: <b id="${uid}-${k}-v">${id==='meet'?n2(st[k]/10)+' giờ':st[k]}</b></span><input type="range" id="${uid}-${k}" data-fig="${id}" data-uid="${uid}" data-k="${k}" min="${v[0]}" max="${v[1]}" step="${v[2]}" value="${st[k]}"></label>`).join('')}</div><div class="figwrap" id="${uid}-out">${f.draw(st)}</div>`}
document.addEventListener('input',ev=>{const t=ev.target;if(!t.dataset||!t.dataset.fig)return;const id=t.dataset.fig,uid=t.dataset.uid;const st=FIstate[uid];st[t.dataset.k]=+t.value;
  if(id==='frac'&&st.n>st.d*2){st.n=st.d*2;const nn=document.getElementById(uid+'-n');if(nn)nn.value=st.n}
  Object.keys(st).forEach(k=>{const el=document.getElementById(uid+'-'+k+'-v');if(el)el.textContent=id==='meet'?n2(st[k]/10)+' giờ':st[k]});
  const o=document.getElementById(uid+'-out');if(o)o.innerHTML=FI[id].draw(st)});
function lessonFigs(tid){const arr=L[tid];if(!arr||!arr.length)return '';return `<section class="sec"><h3>Hình minh họa <span class="tag">${arr.some(x=>x.i)?'có hình kéo thả':'xem hình'}</span></h3><div class="figgrid">${arr.map((x,i)=>`<figure class="figcard ${x.i?'wide':''}"><figcaption><b>${x.title}</b><span>${x.cap}</span></figcaption>${x.i?figInteractive(x.i,tid+'-'+i):`<div class="figwrap">${x.svg()}</div>`}</figure>`).join('')}</div></section>`}

    try{db.doc('settings/profile').onSnapshot(s=>{if(s.exists){const d=s.data();this.profile={name:d.name||''};this.learned=d.learned||{};this.saveLocal();refreshChrome();rerenderData()}})}catch(e){}
  },
  async add(rec){
    if(this.db&&this.mode==='db'){try{await this.db.collection('sessions').add(rec);return true}catch(e){toast('Chưa lưu lên tài khoản được, đã lưu tạm trên máy này.')}}

  async remove(id){
    if(this.db&&this.mode==='db'&&!String(id).startsWith('l')){try{await this.db.doc('sessions/'+id).delete()}catch(e){toast('Không xoá được, hãy thử lại.')}}

let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- question engine ---------- */
function inst(q){q=Object.assign({},q);if(q.kind==='mc'){const ord=shuffle(q.opts.map((_,i)=>i));q.opts=ord.map(i=>q.opts[i]);q.ans=ord.indexOf(q.ans)}return q}
function genOne(subj,topicId,level){
  const t=topicOf(subj,topicId);const gens=(t.gen&&t.gen[level])||[];const st=subj==='tv'?t.q.filter(x=>x[0]===level):[];
  if(!gens.length&&!st.length)return null;
  const r=Math.random()*(st.length+gens.length*6);let q;
  if(r<st.length){const it=st[Math.floor(r)];q={kind:'mc',html:it[1],opts:it[2].slice(),ans:0,sol:it[3],passage:it[4]||null}}
  else q=pick(gens)();
  q.topic=t.id;q.level=level;return inst(q)}
const qKey=q=>q.html+'|'+(q.passage||'')+'|'+(q.kind==='mc'?q.opts.slice().sort().join('|'):'');
function makeSet(subj,topicIds,level,n){
  const out=[],seen=new Set();const order=shuffle(topicIds);
  const lvOrder=[level,...[1,2,3].filter(l=>l!==level).sort((a,b)=>Math.abs(a-level)-Math.abs(b-level))];
  for(let i=0;i<n;i++){const tid=order[i%order.length];let q=null;
    for(const lv of lvOrder){let tries=0;while(tries<60){const c=genOne(subj,tid,lv);if(!c)break;if(!seen.has(qKey(c))){q=c;break}tries++}if(q)break}
    if(!q)q=genOne(subj,tid,level);if(!q)continue;
    seen.add(qKey(q));out.push(q)}
  return out}
function parseNum(s){s=String(s||'').trim().replace(/\s/g,'').replace(/−/g,'-');if(!s)return [];
  if(/^-?\d+\/\d+$/.test(s)){const [a,b]=s.split('/').map(Number);return b?[a/b]:[]}
  const c=[];if(s.includes(',')){c.push(parseFloat(s.replace(/\./g,'').replace(',','.')))}else{c.push(parseFloat(s));if(/^\d{1,3}(\.\d{3})+$/.test(s))c.push(parseFloat(s.replace(/\./g,'')))}
  return c.filter(x=>!isNaN(x))}
function grade(q,a){
  if(q.kind==='mc')return {ok:a===q.ans,given:a==null?'(bỏ trống)':stripHtml(q.opts[a])};
  if(q.kind==='num'){const c=parseNum(a);const ok=c.some(v=>Math.abs(v-q.ans)<=1e-6*Math.max(1,Math.abs(q.ans)));return {ok,given:a&&String(a).trim()?String(a).trim():'(bỏ trống)'}}
  const n=parseInt(a&&a.n,10),d=parseInt(a&&a.d,10);if(!a||isNaN(n)||isNaN(d)||d===0)return {ok:false,given:'(bỏ trống)'};
  const given=n+'/'+d;const eqv=n*q.ans.d===d*q.ans.n;
  if(q.exact)return {ok:n===q.ans.n&&d===q.ans.d,given,note:eqv&&!(n===q.ans.n&&d===q.ans.d)?'Phân số bằng nhưng chưa đúng điều kiện đề bài.':''};
  if(q.reduced){const red=gcd(n,d)===1;return {ok:eqv&&red,given,note:eqv&&!red?'Đúng giá trị nhưng chưa rút gọn về phân số tối giản.':''}}
  return {ok:eqv,given}}
function rightStr(q){if(q.kind==='mc')return stripHtml(q.opts[q.ans]);if(q.kind==='num')return fmt(q.ans)+(q.unit?' '+q.unit:'');return q.ans.n+'/'+q.ans.d}
function stripHtml(h){const d=document.createElement('div');d.innerHTML=String(h).replace(/<span class="fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,'$1/$2');return d.textContent}
function score10(c,t){return t?Math.round(c/t*40)/4:0}
function remark(sc){return sc>=9?'Giỏi lắm!':sc>=7?'Khá tốt, cố thêm chút nữa!':sc>=5?'Đạt yêu cầu.':'Cần ôn lại nhé!'}

/* ---------- rendering helpers ---------- */
function segSubj(act,val){return `<div class="seg" role="group" aria-label="Môn học">${Object.keys(SUBJ).map(k=>`<button data-act="${act}" data-v="${k}" aria-pressed="${val===k}">${SUBJ[k].name}</button>`).join('')}</div>`}
function levelCards(act,val){return `<div class="grid3">${[1,2,3].map(l=>`<button class="lvl" data-act="${act}" data-v="${l}" aria-pressed="${val===l}"><span class="stars">${LV[l].stars}</span><b>${LV[l].name} · ${LV[l].sub}</b><span>${LV[l].desc}</span></button>`).join('')}</div>`}
function qBody(q,ans,locked,idPrefix){
  let h='';if(q.passage){const p=PASSAGES[q.passage];h+=`<div class="passage"><b>${p.title}</b>${p.text}</div>`}
  h+=`<div class="qtext">${q.html}</div>`;
  if(q.kind==='mc'){h+=`<div class="opts">${q.opts.map((o,i)=>{let cls='';if(locked){if(i===q.ans)cls='right';else if(ans===i)cls='wrong'}return `<button class="opt ${cls}" data-act="opt" data-v="${i}" aria-pressed="${ans===i}" ${locked?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`}).join('')}</div>`}
  else if(q.kind==='num'){h+=`<div class="ansrow"><label class="small muted" for="${idPrefix}num">Đáp số:</label><input id="${idPrefix}num" data-in="num" inputmode="decimal" autocomplete="off" value="${esc(ans||'')}" ${locked?'disabled':''} placeholder="Ví dụ: 12,5"><span>${q.unit||''}</span></div>`}
  else{h+=`<div class="ansrow"><span class="small muted">Đáp số:</span><span class="fracin"><input id="${idPrefix}fn" data-in="fn" inputmode="numeric" aria-label="Tử số" value="${esc(ans&&ans.n||'')}" ${locked?'disabled':''}><hr><input id="${idPrefix}fd" data-in="fd" inputmode="numeric" aria-label="Mẫu số" value="${esc(ans&&ans.d||'')}" ${locked?'disabled':''}></span>${q.reduced?'<span class="small muted">(tối giản)</span>':''}</div>`}
  return h}

function reviewList(qs,answers,res,wrongFirst){
  const idx=qs.map((_,i)=>i);if(wrongFirst)idx.sort((a,b)=>(res[a]&&res[a].ok)-(res[b]&&res[b].ok));
  return `<section class="review"><h3 style="font-size:1.15rem">Xem lại bài làm</h3>${idx.map(i=>{const q=qs[i],r=res[i]||{ok:false,given:'(bỏ trống)'};return `<div class="ritem"><div class="h"><span class="mark ${r.ok?'r':'w'}">${r.ok?'Đ':'S'}</span>Câu ${i+1}</div>${q.passage?`<div class="small muted">Bài đọc: ${PASSAGES[q.passage].title}</div>`:''}<div>${q.html}</div><div class="small">Con trả lời: <b>${esc(r.given)}</b>${r.ok?'':` · Đáp án: <b>${esc(rightStr(q))}</b>`}</div>${r.ok?'':`<div class="small muted"><b>Lời giải:</b> ${q.sol}</div>${drawFig(q.fig)}`}</div>`}).join('')}</section>`}

function topicStats(){const m={};Store.sessions.forEach(s=>{(s.items||[]).forEach(it=>{const k=s.subj+'|'+it.t+'|'+s.level;m[k]=m[k]||{n:0,ok:0};m[k].n++;if(it.ok)m[k].ok++})});return m}
function weakTopics(){const m=topicStats();const out=[];Object.keys(m).forEach(k=>{const [subj,id,level]=k.split('|');const v=m[k];const t=topicOf(subj,id);if(t&&v.n>=4&&v.ok/v.n<0.6)out.push({subj,id,level:+level,name:t.name,n:v.n,rate:v.ok/v.n})});return out.sort((a,b)=>a.rate-b.rate)}
function adviceList(){
  const m=topicStats();const adv=[];
  weakTopics().slice(0,4).forEach(w=>adv.push(['r',`<b>${w.name}</b> (${SUBJ[w.subj].name}, ${LV[w.level].name}) mới đúng ${Math.round(w.rate*100)}% trong ${w.n} câu. Nên cho con đọc lại phần “Lưu ý – lỗi hay gặp” rồi luyện thêm ở cấp này.`]));
  Object.keys(m).forEach(k=>{const [subj,id,level]=k.split('|');const v=m[k];const t=topicOf(subj,id);if(!t)return;if(+level<3&&v.n>=8&&v.ok/v.n>=0.85&&!m[subj+'|'+id+'|'+(+level+1)])adv.push(['g',`<b>${t.name}</b>: đúng ${Math.round(v.ok/v.n*100)}% ở ${LV[level].name}. Con đã sẵn sàng thử <b>${LV[+level+1].name} · ${LV[+level+1].sub}</b>.`])});
  const untouched=[...MATH.map(t=>['toan',t]),...TV.map(t=>['tv',t])].filter(([s,t])=>![1,2,3].some(l=>m[s+'|'+t.id+'|'+l]));
  if(untouched.length&&Store.sessions.length)adv.push(['a',`Còn ${untouched.length} chủ đề chưa luyện lần nào, ví dụ: ${untouched.slice(0,3).map(x=>x[1].name).join('; ')}.`]);
  const days=new Set(Store.sessions.filter(s=>s.ts>Date.now()-14*864e5).map(s=>new Date(s.ts).toDateString())).size;
  if(Store.sessions.length)adv.push([days>=8?'g':days>=4?'a':'r',`Trong 14 ngày qua con học ${days} ngày. ${days>=8?'Rất đều đặn.':'Nên duy trì mỗi ngày khoảng 20–30 phút.'}`]);
  return adv}
function chartSvg(){
  const ex=Store.sessions.filter(s=>s.mode==='exam').slice().sort((a,b)=>a.ts-b.ts);
  if(ex.length<1)return '<p class="small muted">Biểu đồ sẽ hiện khi con làm bài kiểm tra.</p>';
  const W=420,H=200,L=28,Rr=12,T=16,B=28;const pts={toan:[],tv:[]};const last=ex.slice(-14);
  const xs=i=>L+(last.length<2?(W-L-Rr)/2:i*(W-L-Rr)/(last.length-1));const ys=v=>T+(10-v)/10*(H-T-B);
  last.forEach((s,i)=>pts[s.subj].push([xs(i),ys(s.score),s]));
  let g='';[0,2,4,6,8,10].forEach(v=>{g+=`<line x1="${L}" x2="${W-Rr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-faint)">${v}</text>`});
  last.forEach((s,i)=>{if(last.length<=8||i%2===0)g+=`<text x="${xs(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-faint)">${dstr(s.ts)}</text>`});
  ['toan','tv'].forEach(k=>{const c=k==='toan'?'var(--tim)':'var(--tv)';const p=pts[k];if(!p.length)return;if(p.length>1)g+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${p.map(x=>x[0]+','+x[1]).join(' ')}"/>`;p.forEach((x,j)=>{g+=`<circle cx="${x[0]}" cy="${x[1]}" r="${j===p.length-1?5:3.5}" fill="${j===p.length-1?c:'var(--card)'}" stroke="${c}" stroke-width="2"/>`});const e=p[p.length-1];g+=`<text x="${Math.min(e[0]+8,W-Rr-20)}" y="${e[1]-9}" font-size="12" font-weight="700" fill="${c}">${fmtScore(e[2].score)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Điểm các bài kiểm tra gần đây">${g}</svg><div class="legend"><span><i style="background:var(--tim)"></i>Toán</span><span><i style="background:var(--tv)"></i>Tiếng Việt</span></div>`}

  const cell=(subj,id,l)=>{const v=m[subj+'|'+id+'|'+l];if(!v)return '<span class="cell n">–</span>';const r=v.ok/v.n;return `<span class="cell ${r>=.8?'g':r>=.6?'a':'r'}" title="${v.ok}/${v.n} câu">${Math.round(r*100)}%</span>`};

  ${!ss.length?`<div class="card empty"><b>Chưa có kết quả nào.</b><span>Khi con làm xong một bài luyện tập hoặc kiểm tra, kết quả sẽ hiện ở đây kèm nhận xét theo từng chủ đề.</span><button class="btn primary" data-act="go" data-v="practice">Cho con làm bài đầu tiên</button></div>`:`

   <div class="stat"><b>${tot?Math.round(ok/tot*100)+'%':'–'}</b><span>tỉ lệ làm đúng</span></div>
   <div class="stat"><b>${avg!=null?fmtScore(avg):'–'}</b><span>điểm TB 5 bài kiểm tra gần nhất</span></div>
  </div>
  <div class="grid2">
   <div class="card"><span class="eyebrow">Nhận xét và định hướng</span><ul class="advice" style="margin-top:12px">${adv.map(a=>`<li><span class="sev ${a[0]}"></span><div>${a[1]}</div></li>`).join('')||'<li class="muted">Cần thêm vài bài làm để có nhận xét.</li>'}</ul></div>

   <div class="hist">${filt.slice(0,60).map(histRow).join('')||'<p class="muted">Không có bài nào.</p>'}</div></section>`}

function readInputs(){const n=$('[data-in="num"]'),fn=$('[data-in="fn"]'),fd=$('[data-in="fd"]');if(n)return n.value;if(fn)return {n:fn.value,d:fd.value};return undefined}
function recItems(qs,res){return qs.map((q,i)=>{const r=res[i];if(!r)return null;return r.ok?{t:q.topic,ok:true}:{t:q.topic,ok:false,q:q.html,g:r.given,r:rightStr(q),s:q.sol,p:q.passage||null,f:q.fig||null}}).filter(Boolean)}
async function savePractice(){const P=S.prac;const done=P.res.filter(Boolean);if(!done.length||P.saved)return;P.saved=true;const c=done.filter(r=>r.ok).length;
  await Store.add({ts:Date.now(),mode:'practice',subj:P.subj,topic:P.topic,level:P.level,total:done.length,correct:c,score:score10(c,done.length),dur:Math.round((Date.now()-P.start)/1000),items:recItems(P.qs,P.res)})}
function startPractice(){const p=S.pset;const ids=p.topic==='all'?SUBJ[p.subj].topics.map(t=>t.id):[p.topic];const qs=makeSet(p.subj,ids,p.level,p.n);

function startExam(){const e=S.eset;let ids=SUBJ[e.subj].topics.filter(t=>e.subj!=='toan'||e.scope==='all'||String(t.hk)===e.scope).map(t=>t.id);

function tick(){clearInterval(timerH);timerH=setInterval(()=>{const E=S.exam;if(!E||E.done){clearInterval(timerH);return}const left=Math.max(0,Math.round((E.end-Date.now())/1000));const t=$('#timer');if(t&&S.view==='exam'){t.textContent=mmss(left);t.classList.toggle('low',left<120)}if(left<=0){toast('Hết giờ! Bài đã được nộp.');submitExam()}},1000)}
async function submitExam(){const E=S.exam;if(!E||E.done)return;if(S.view==='exam'){const v=readInputs();if(v!==undefined)E.answers[E.i]=v}

document.addEventListener('click',async ev=>{

  case 'saveName':Store.profile.name=$('#kname').value.trim().slice(0,30);await Store.saveProfile();toast('Đã lưu tên.');render();break;
  }});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='ptopic'){S.pset.topic=t.value;render()}
  if(t.id==='restore'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(d.app!=='vo5'||!Array.isArray(d.sessions))throw 0;const have=new Set(Store.sessions.map(s=>s.id+'|'+s.ts));let n=0;d.sessions.forEach(s=>{if(!have.has(s.id+'|'+s.ts)){Store.sessions.push(s);n++}});Store.sessions.sort((x,y)=>y.ts-x.ts);if(d.profile&&d.profile.name&&!Store.profile.name)Store.profile=d.profile;Store.learned=Object.assign({},d.learned||{},Store.learned);Store.saveLocal();refreshChrome();render();toast('Đã khôi phục '+n+' kết quả.')}catch(e){toast('File không đúng định dạng sao lưu của ứng dụng.')}};fr.readAsText(t.files[0])}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const t=ev.target;if(!t.matches||!t.matches('input[data-in]'))return;ev.preventDefault();
  if(S.view==='practice'&&S.prac&&!S.prac.res[S.prac.i]){if(t.dataset.in==='fn'){$('[data-in="fd"]').focus();return}$('[data-act="pcheck"]').click()}
  else if(S.view==='practice'){$('[data-act="pnext"]')&&$('[data-act="pnext"]').click()}
  else if(S.view==='exam'&&S.exam&&S.exam.i<S.exam.qs.length-1){$('[data-act="enext"]').click()}});

render();Store.init();

</script>
</body>
</html>
