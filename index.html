<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vở Ô Li Lớp 5</title>
<meta name="description" content="Học, luyện tập và kiểm tra Toán – Tiếng Việt lớp 5 theo sách Kết nối tri thức, 3 cấp độ, có góc phụ huynh.">
<meta name="theme-color" content="#5a3ea6">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%235a3ea6%22/%3E%3Crect%20x%3D%2213%22%20y%3D%2210%22%20width%3D%223%22%20height%3D%2244%22%20fill%3D%22%23cf3434%22/%3E%3Ctext%20x%3D%2236%22%20y%3D%2246%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3E5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Pangolin&display=swap">
<style>
/* Vở Ô Li Lớp 5 */
:root{color-scheme:light}
html,body{margin:0}
body{font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: trang vở ô li — một cột nội dung trên nền kẻ ô, lề đỏ cho trang lý thuyết, bút đỏ chấm điểm */
:root{
  --paper:#fbfaff; --grid:#e6e0f4; --grid-soft:#f1edf9;
  --card:#ffffff; --card-2:#f5f2fc; --border:#dcd4ee;
  --ink:#251d3a; --ink-soft:#615a7a; --ink-faint:#8e88a6;
  --tim:#5a3ea6; --tim-strong:#46308a; --tim-soft:#ece6f8; --on-tim:#ffffff;
  --tv:#1d6f80; --tv-soft:#e1f1f4;
  --red:#cf3434; --red-soft:#fbe7e7;
  --green:#2b7d50; --green-soft:#e3f3ea;
  --amber:#b8740c; --amber-soft:#fbf0dc;
  --f-display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Pangolin','Comic Sans MS','Be Vietnam Pro',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16131d; --grid:#241f30; --grid-soft:#1c1826;
  --card:#1f1a29; --card-2:#262035; --border:#363048;
  --ink:#ece8f6; --ink-soft:#aaa3c2; --ink-faint:#7d7697;
  --tim:#a68cf2; --tim-strong:#c2b0f7; --tim-soft:#2c2442; --on-tim:#17121f;
  --tv:#5cc2d6; --tv-soft:#173039;
  --red:#ff6f6f; --red-soft:#3a1d22;
  --green:#5fd093; --green-soft:#16302a;
  --amber:#f0b24a; --amber-soft:#3a2c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16131d; --grid:#241f30; --grid-soft:#1c1826;
  --card:#1f1a29; --card-2:#262035; --border:#363048;
  --ink:#ece8f6; --ink-soft:#aaa3c2; --ink-faint:#7d7697;
  --tim:#a68cf2; --tim-strong:#c2b0f7; --tim-soft:#2c2442; --on-tim:#17121f;
  --tv:#5cc2d6; --tv-soft:#173039;
  --red:#ff6f6f; --red-soft:#3a1d22;
  --green:#5fd093; --green-soft:#16302a;
  --amber:#f0b24a; --amber-soft:#3a2c14; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(var(--grid-soft) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,32px 8px;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tim);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;border-radius:9px;background:var(--tim);color:var(--on-tim);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;position:relative}
.logo-mark::after{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--red);opacity:.85}
.logo h1{font-size:1.35rem;color:var(--tim-strong)}
.logo small{display:block;font-size:.78rem;color:var(--ink-soft);font-family:var(--f-body);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);color:var(--ink-soft);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.chip.ok .dot{background:var(--green)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px 10px;font-weight:600;color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--tim-strong);border-color:var(--tim)}

main{padding-top:22px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.muted{color:var(--ink-soft)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-faint)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px}
.btn:hover{border-color:var(--tim)}
.btn.primary{background:var(--tim);border-color:var(--tim);color:var(--on-tim)}
.btn.primary:hover{background:var(--tim-strong)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--border))}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.88rem}

/* hero */
.hello{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.hello h2{font-size:clamp(1.6rem,4vw,2.2rem)}
.hello h2 em{font-style:normal;color:var(--tim)}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:18px;position:relative}
.mod:hover{border-color:var(--tim)}
.mod h3{font-size:1.25rem}
.mod .num{font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--tim);letter-spacing:.06em}
.mod p{color:var(--ink-soft);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--ink-soft)}

/* segmented */
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tim-strong);box-shadow:0 1px 3px rgba(40,20,80,.12)}

/* learn */
.learn{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.learn{grid-template-columns:minmax(0,1fr)}}
.toplist{display:flex;flex-direction:column;gap:4px}
.toplist .hk{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:10px 4px 2px}
.tbtn{border:1px solid transparent;background:none;text-align:left;padding:8px 10px;border-radius:9px;display:flex;gap:10px;align-items:flex-start;font-size:.93rem;color:var(--ink)}
.tbtn:hover{background:var(--card-2)}
.tbtn[aria-current="true"]{background:var(--tim-soft);border-color:color-mix(in srgb,var(--tim) 35%,transparent);color:var(--tim-strong);font-weight:600}
.tbtn .ck{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);margin-top:3px;display:grid;place-items:center;font-size:.7rem;color:var(--on-tim)}
.tbtn .ck.on{background:var(--green);border-color:var(--green)}
@media (max-width:760px){.toplist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.toplist .hk{display:none}.tbtn{flex:none;border-color:var(--border);background:var(--card)}}

.sheet{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px 22px 26px 46px;position:relative;display:flex;flex-direction:column;gap:22px;min-width:0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:28px;width:2px;background:var(--red);opacity:.45}
@media (max-width:520px){.sheet{padding:18px 16px 22px 30px}.sheet::before{left:16px}}
.sheet h2{font-size:1.7rem;color:var(--tim-strong)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:1.08rem;display:flex;align-items:center;gap:8px}
.sec h3 .tag{font-family:var(--f-body);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--card-2);color:var(--ink-soft)}
.sec ul,.sec ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.formula{background:var(--tim-soft);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.formula div{font-weight:600}
.warn{background:var(--amber-soft);border-radius:10px;padding:12px 16px}
.warn ul{margin:0}
.ex{border:1.5px dashed var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ex .ans{color:var(--green);font-weight:500}
.lvlnote{border-left:3px solid var(--tim);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.lvlnote.l3{border-color:var(--red)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}
.fr>span:last-child{padding:0 .25em}

/* level cards */
.lvl{border:1.5px solid var(--border);background:var(--card);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.lvl[aria-pressed="true"]{border-color:var(--tim);background:var(--tim-soft)}
.lvl b{font-family:var(--f-display);font-size:1.15rem}
.lvl .stars{color:var(--amber);letter-spacing:2px;font-size:.9rem}
.lvl span{font-size:.85rem;color:var(--ink-soft)}
label.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
select{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 12px;min-height:42px;max-width:100%}
.setup{display:flex;flex-direction:column;gap:18px}

/* question */
.qwrap{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:8px;background:var(--card-2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--tim);border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.qtext{font-size:1.15rem;line-height:1.7}
.passage{background:var(--card-2);border-radius:10px;padding:14px 16px;font-size:.96rem;max-height:260px;overflow:auto}
.passage b{font-family:var(--f-display);font-size:1.05rem;display:block;margin-bottom:4px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:10px 14px;min-height:48px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.opt:hover:not(:disabled){border-color:var(--tim)}
.opt[aria-pressed="true"]{border-color:var(--tim);background:var(--tim-soft)}
.opt[aria-pressed="true"] .k{background:var(--tim);border-color:var(--tim);color:var(--on-tim)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.ansrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ansrow input{border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:10px 14px;font-size:1.2rem;width:200px;max-width:100%;font-variant-numeric:tabular-nums}
.ansrow input:focus{border-color:var(--tim);outline:none}
.fracin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fracin input{width:96px;text-align:center;padding:6px 8px}
.fracin hr{width:110px;border:0;border-top:2.5px solid var(--ink);margin:0}
.fb{border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--green-soft)}
.fb.no{background:var(--red-soft)}
.fb .v{font-family:var(--f-hand);font-size:1.25rem}
.fb.ok .v{color:var(--green)}.fb.no .v{color:var(--red)}
.hint{background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:.95rem}

/* exam */
.timer{font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:9px;background:var(--card-2);border:1px solid var(--border)}
.timer.low{color:var(--red);border-color:var(--red)}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);font-weight:700;font-variant-numeric:tabular-nums}
.qnav button.done{background:var(--tim-soft);border-color:color-mix(in srgb,var(--tim) 40%,transparent)}
.qnav button.cur{border-color:var(--tim);box-shadow:0 0 0 2px var(--tim) inset}
.qnav button.r{background:var(--green-soft);border-color:var(--green)}
.qnav button.w{background:var(--red-soft);border-color:var(--red)}
.confirm{background:var(--amber-soft);border-radius:10px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* result */
.result{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.grade{width:118px;height:118px;flex:none;border:3px solid var(--red);border-radius:50%;display:grid;place-items:center;transform:rotate(-7deg);color:var(--red);font-family:var(--f-hand);position:relative}
.grade b{font-size:2.6rem;line-height:1;font-weight:400}
.grade small{position:absolute;top:10px;font-size:.85rem}
.grade i{position:absolute;bottom:12px;font-style:normal;font-size:.8rem}
.remark{font-family:var(--f-hand);color:var(--red);font-size:1.3rem}
.review{display:flex;flex-direction:column;gap:10px}
.ritem{border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.ritem .h{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.88rem}
.mark{font-family:var(--f-hand);font-size:1.15rem}
.mark.r{color:var(--green)}.mark.w{color:var(--red)}

/* parent */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:400px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
td.c,th.c{text-align:center}
.cell{display:inline-block;min-width:62px;text-align:center;padding:3px 8px;border-radius:7px;font-weight:600;font-variant-numeric:tabular-nums;font-size:.85rem}
.cell.g{background:var(--green-soft);color:var(--green)}
.cell.a{background:var(--amber-soft);color:var(--amber)}
.cell.r{background:var(--red-soft);color:var(--red)}
.cell.n{color:var(--ink-faint)}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--card-2);color:var(--ink-soft);white-space:nowrap}
.pill.toan{background:var(--tim-soft);color:var(--tim-strong)}
.pill.tv{background:var(--tv-soft);color:var(--tv)}
.pill.ex{background:var(--red-soft);color:var(--red)}
.advice{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.advice li{display:flex;gap:10px;align-items:flex-start}
.advice .sev{flex:none;width:10px;height:10px;border-radius:50%;margin-top:8px}
.sev.r{background:var(--red)}.sev.a{background:var(--amber)}.sev.g{background:var(--green)}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{border:1px solid var(--border);border-radius:10px;background:var(--card)}
.hrow>button{width:100%;border:0;background:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;text-align:left}
.hrow .sc{font-family:var(--f-hand);font-size:1.3rem;color:var(--red);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.hrow .dt{font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:74px}
.hdetail{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days div{aspect-ratio:1;border-radius:5px;background:var(--card-2);border:1px solid var(--border);max-width:100%}
.days div.on1{background:color-mix(in srgb,var(--tim) 35%,var(--card))}
.days div.on2{background:color-mix(in srgb,var(--tim) 65%,var(--card))}
.days div.on3{background:var(--tim)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--ink-soft)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
input.txt{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 12px;min-height:42px}
.empty{text-align:center;padding:28px 16px;color:var(--ink-soft);display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}

/* figures */
.figgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.figcard{margin:0;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:10px;min-width:0}
.figcard.wide{grid-column:1/-1}
.figcard figcaption{display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.figcard figcaption span{color:var(--ink-soft)}
.figwrap{overflow-x:auto;max-width:100%}
svg.fig{width:100%;max-width:560px;height:auto;display:block}
svg.fig text{font-family:var(--f-body)}
.fb .figwrap,.ritem .figwrap{background:var(--card);border-radius:10px;padding:10px;margin-top:4px}
.figctl{display:flex;flex-wrap:wrap;gap:10px 22px}

<script>
/* ==== toan-chu-de.js ==== */
/* ===== Helpers ===== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const rnd=(x,d=6)=>Math.round(x*Math.pow(10,d))/Math.pow(10,d);
function fmt(x){x=rnd(x,6);const neg=x<0;x=Math.abs(x);let s=x.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');let [i,f]=s.split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'−':'')+i+(f?','+f:'')}
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const dec=(lo,hi,dp)=>R(lo*Math.pow(10,dp),hi*Math.pow(10,dp))/Math.pow(10,dp);
const HM=(h,m)=>m?h+' giờ '+m+' phút':h+' giờ';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* question builders */
const QN=(html,ans,sol,o={})=>({kind:'num',html,ans:rnd(ans,6),sol,unit:o.unit||'',hint:o.hint||'',fig:o.fig||null});
const QF=(html,n,d,sol,o={})=>({kind:'frac',html,ans:{n,d},sol,reduced:!!o.reduced,exact:!!o.exact,hint:o.hint||'',fig:o.fig||null});
const QM=(html,opts,ci,sol,o={})=>({kind:'mc',html,opts,ans:ci,sol,hint:o.hint||'',fig:o.fig||null});
function QMnum(html,correct,distract,sol,o={}){
  const set=[correct];distract.forEach(d=>{d=rnd(d,6);if(d>=0&&!set.some(s=>rnd(s,6)===d))set.push(d)});
  let k=1;while(set.length<4){const d=rnd(correct*(1+k*0.1)+k,6);if(!set.includes(d))set.push(d);k++}
  const opts=set.slice(0,4).map(v=>fmt(v)+(o.unit?' '+o.unit:''));return QM(html,opts,0,sol,o)}
function coprimePair(maxD){let p,q;do{q=R(2,maxD);p=R(1,q-1)}while(gcd(p,q)!==1);return [p,q]}
function redFrac(n,d){const g=gcd(n,d);return [n/g,d/g]}

/* ===== MATH TOPICS (Toán 5 – Kết nối tri thức, GDPT 2018) ===== */
const MATH=[
/* ---------- 1 ---------- */
{id:'m1',name:'Ôn tập số tự nhiên, phân số, hỗn số',sgk:'Chủ đề 1 · Bài 1–9',hk:1,
theory:{
tom:['Phân số <b>tối giản</b> là phân số có tử và mẫu không cùng chia hết cho số nào lớn hơn 1.',
'<b>Phân số thập phân</b> là phân số có mẫu là 10; 100; 1000; …',
'<b>Hỗn số</b> gồm phần nguyên và phần phân số (phần phân số luôn bé hơn 1). Ví dụ 2'+F(3,4)+' đọc là “hai và ba phần tư”.',
'Muốn cộng, trừ hai phân số khác mẫu, ta <b>quy đồng mẫu số</b> rồi cộng, trừ tử số, giữ nguyên mẫu số.'],
nho:[F('a','b')+' × '+F('c','d')+' = '+F('a × c','b × d'),
F('a','b')+' : '+F('c','d')+' = '+F('a','b')+' × '+F('d','c')+' (nhân với phân số đảo ngược)',
'Hỗn số → phân số: a'+F('b','c')+' = '+F('a × c + b','c'),
'Tìm '+F('m','n')+' của số A: A × '+F('m','n')],
luu:['Rút gọn phải đến khi <b>tối giản</b>: chia cho ƯCLN của tử và mẫu là nhanh nhất.',
'Quy đồng nên chọn <b>mẫu số chung nhỏ nhất</b> để số không quá lớn.',
'Phần phân số của hỗn số phải bé hơn 1: 2'+F(5,4)+' là cách viết sai.',
'Đọc kĩ “'+F(2,5)+' số gạo <b>còn lại</b>” khác với “'+F(2,5)+' số gạo <b>ban đầu</b>”.'],
nghi:['Đọc đề, gạch chân các phân số và cụm “của”, “còn lại”.','Xác định phép tính: “của” → nhân; “so với” → chia.','Tính, rồi rút gọn kết quả về tối giản.','Thử lại bằng cách tính ngược.'],
vd:{de:'Tính: '+F(2,3)+' + '+F(3,4),giai:'Mẫu số chung nhỏ nhất là 12. '+F(2,3)+' = '+F(8,12)+'; '+F(3,4)+' = '+F(9,12)+'. Vậy '+F(8,12)+' + '+F(9,12)+' = '+F(17,12)+' = 1'+F(5,12)+'.'},
dat:['Rút gọn, quy đồng, so sánh được phân số.','Cộng, trừ, nhân, chia phân số thành thạo.','Đổi qua lại giữa hỗn số và phân số.','Giải bài toán tìm phân số của một số.'],
mo2:['So sánh phân số bằng <b>phần bù đến 1</b>: '+F(2024,2025)+' và '+F(2025,2026)+' — phần bù '+F(1,2025)+' > '+F(1,2026)+' nên '+F(2024,2025)+' < '+F(2025,2026)+'.','Tìm x trong biểu thức có phân số.','Bài toán “bán … số còn lại”.'],
mo3:['<b>Tách phân số</b> để tính nhanh: '+F(1,'n × (n+1)')+' = '+F(1,'n')+' − '+F(1,'n+1')+'.','Tổng '+F(1,2)+' + '+F(1,4)+' + … + '+F(1,'2ⁿ')+' = 1 − '+F(1,'2ⁿ')+'.','<b>Tính ngược từ cuối</b>: biết phần còn lại, tìm số ban đầu.']},
gen:{
1:[()=>{const [p,q]=coprimePair(12);const k=R(2,9);const a=p*k,b=q*k;return QF(`Rút gọn phân số ${F(a,b)} thành phân số tối giản.`,p,q,`ƯCLN của ${a} và ${b} là ${k}. Chia cả tử và mẫu cho ${k}: ${F(a,b)} = ${F(p,q)}.`,{reduced:true,hint:'Tìm số lớn nhất mà cả tử và mẫu đều chia hết.'})},
()=>{const ds=[2,3,4,5,6,8,10,12];let b=pick(ds),d;do{d=pick(ds)}while(d===b);const a=R(1,b-1),c=R(1,d-1);const L=lcm(b,d);const n1=a*L/b,n2=c*L/d;let op=Math.random()<.5&&n1!==n2?'−':'+';let x=n1,y=n2,A=a,B=b,C=c,D=d;if(op==='−'&&n1<n2){x=n2;y=n1;A=c;B=d;C=a;D=b}const n=op==='+'?x+y:x-y;const [rn,rd]=redFrac(n,L);return QF(`Tính rồi viết kết quả dạng phân số tối giản: ${F(A,B)} ${op} ${F(C,D)}`,rn,rd,`Mẫu số chung nhỏ nhất: ${L}. ${F(A,B)} = ${F(x,L)}; ${F(C,D)} = ${F(y,L)}. Kết quả: ${F(n,L)}${rn!==n?' = '+F(rn,rd):''}.`,{reduced:true,hint:'Quy đồng mẫu số trước.'})},
()=>{const w=R(1,6);const [n,d]=coprimePair(9);return QF(`Viết hỗn số ${w}${F(n,d)} thành phân số.`,w*d+n,d,`${w}${F(n,d)} = ${F(w+' × '+d+' + '+n,d)} = ${F(w*d+n,d)}.`,{hint:'Lấy phần nguyên nhân mẫu rồi cộng tử.'})},
()=>{const d=pick([2,4,5,20,25,50]);let n;do{n=R(1,d-1)}while(gcd(n,d)!==1);return QN(`Viết ${F(n,d)} thành phân số thập phân có mẫu số 100. Tử số là bao nhiêu?`,n*100/d,`100 : ${d} = ${100/d}. Nhân cả tử và mẫu với ${100/d}: ${F(n,d)} = ${F(n*100/d,100)}.`,{hint:'Mẫu số cần nhân với mấy để được 100?'})},
()=>{const b=pick([3,4,5,6,8]);const a=R(1,b-1);const T=b*R(3,15);return QN(`Một lớp có ${T} học sinh, trong đó ${F(a,b)} số học sinh thích bơi. Hỏi có bao nhiêu học sinh thích bơi?`,T*a/b,`${T} × ${F(a,b)} = ${T*a/b} (học sinh).`,{unit:'học sinh',hint:'Tìm phân số của một số: lấy số đó nhân với phân số.',fig:{t:'frac',n:a,d:b,total:T}})}],
2:[()=>{const [a,b]=coprimePair(6),[c,d]=coprimePair(8);if(Math.random()<.5){const L=lcm(b,d);const n=a*L/b+c*L/d;const [rn,rd]=redFrac(n,L);return QF(`Tìm x: x − ${F(a,b)} = ${F(c,d)}`,rn,rd,`x = ${F(c,d)} + ${F(a,b)} = ${F(c*L/d,L)} + ${F(a*L/b,L)} = ${F(n,L)}${rn!==n?' = '+F(rn,rd):''}.`,{reduced:true,hint:'Muốn tìm số bị trừ, lấy hiệu cộng số trừ.'})}const [rn,rd]=redFrac(c*b,d*a);return QF(`Tìm x: x × ${F(a,b)} = ${F(c,d)}`,rn,rd,`x = ${F(c,d)} : ${F(a,b)} = ${F(c,d)} × ${F(b,a)} = ${F(c*b,d*a)}${rn!==c*b?' = '+F(rn,rd):''}.`,{reduced:true,hint:'Muốn tìm thừa số, lấy tích chia cho thừa số kia.'})},
()=>{const n=R(15,2030);const flip=Math.random()<.5;const A=flip?F(n+1,n):F(n,n+1),B=flip?F(n+2,n+1):F(n+1,n+2);return QM(`So sánh: ${A} … ${B}`,flip?['>','<','=']:['<','>','='],0,flip?`Phần hơn so với 1: ${F(1,n)} > ${F(1,n+1)} nên ${A} > ${B}.`:`Phần bù đến 1: ${F(1,n+1)} > ${F(1,n+2)}. Phân số nào có phần bù lớn hơn thì bé hơn, nên ${A} < ${B}.`,{hint:'So sánh mỗi phân số với 1: thiếu bao nhiêu (hoặc thừa bao nhiêu)?'})},
()=>{const b=pick([2,3,4,5]),d=pick([2,3,4,5]);const a=R(1,b-1),c=R(1,d-1);const T=b*d*R(3,12);const r1=T-T*a/b,s2=r1*c/d;return QN(`Một cửa hàng có ${T} kg gạo. Ngày đầu bán ${F(a,b)} số gạo, ngày thứ hai bán ${F(c,d)} số gạo <b>còn lại</b>. Hỏi cửa hàng còn bao nhiêu ki-lô-gam gạo?`,r1-s2,`Ngày đầu bán: ${T} × ${F(a,b)} = ${T*a/b} (kg). Còn lại: ${T} − ${T*a/b} = ${r1} (kg). Ngày hai bán: ${r1} × ${F(c,d)} = ${s2} (kg). Còn: ${r1} − ${s2} = ${r1-s2} (kg).`,{unit:'kg',hint:'Ngày thứ hai tính trên số gạo còn lại sau ngày đầu.'})},
()=>{let a,b,c,d;do{a=R(2,12);c=R(a+1,a+8);d=R(3,15);b=R(d+1,d+10)}while(gcd(a,b)!==1||gcd(c,d)!==1);return QM(`So sánh: ${F(a,b)} … ${F(c,d)}`,['<','>','='],0,`Ta có ${F(a,b)} < ${F(c,b)} (cùng mẫu, tử bé hơn) và ${F(c,b)} < ${F(c,d)} (cùng tử, mẫu lớn hơn). Vậy ${F(a,b)} < ${F(c,d)}.`,{hint:'Dùng phân số trung gian '+F(c,b)+'.'})}],
3:[()=>{const n=R(5,99);return QF(`Tính: ${F(1,'1 × 2')} + ${F(1,'2 × 3')} + ${F(1,'3 × 4')} + … + ${F(1,n+' × '+(n+1))}`,n,n+1,`Mỗi số hạng ${F(1,'k × (k+1)')} = ${F(1,'k')} − ${F(1,'k+1')}. Tổng = 1 − ${F(1,2)} + ${F(1,2)} − ${F(1,3)} + … − ${F(1,n+1)} = 1 − ${F(1,n+1)} = ${F(n,n+1)}.`,{reduced:true,hint:'Thử viết '+F(1,'2 × 3')+' thành hiệu hai phân số.'})},
()=>{const k=R(5,8),p=Math.pow(2,k);const terms=[F(1,2),F(1,4),F(1,8)].join(' + ');return QF(`Tính: ${terms} + … + ${F(1,p)}`,p-1,p,`Mỗi lần cộng thêm, phần còn thiếu để đủ 1 đúng bằng số hạng cuối. Tổng = 1 − ${F(1,p)} = ${F(p-1,p)}.`,{reduced:true,hint:'Vẽ một hình vuông, tô dần một nửa, một phần tư…'})},
()=>{const P=pick([[1,3,2,5],[1,4,1,3],[2,5,1,2],[1,2,1,3],[3,7,1,2]]);const [a,b,c,d]=P;const T=b*d*R(2,12);const r=T*(b-a)/b*(d-c)/d;return QN(`Một người bán ${F(a,b)} số trứng, sau đó bán tiếp ${F(c,d)} số trứng còn lại thì còn ${r} quả. Hỏi lúc đầu người đó có bao nhiêu quả trứng?`,T,`Sau lần 2 còn ${F(d-c,d)} số trứng còn lại sau lần 1. Số trứng sau lần 1: ${r} : ${F(d-c,d)} = ${r*d/(d-c)} (quả). Đó là ${F(b-a,b)} số trứng ban đầu, nên ban đầu có: ${r*d/(d-c)} : ${F(b-a,b)} = ${T} (quả).`,{unit:'quả',hint:'Tính ngược từ cuối lên.'})},
()=>{const [p,q]=coprimePair(9);const k=R(3,15);const S=(p+q)*k;return QF(`Tìm phân số bằng ${F(p,q)}, biết tổng của tử số và mẫu số là ${S}.`,p*k,q*k,`Coi tử số là ${p} phần, mẫu số là ${q} phần. Tổng số phần: ${p+q}. Một phần: ${S} : ${p+q} = ${k}. Tử số: ${p*k}, mẫu số: ${q*k}. Phân số cần tìm: ${F(p*k,q*k)}.`,{exact:true,hint:'Đây là bài toán tổng – tỉ.',fig:{t:'tt',m:p,n:q,S,names:['Tử số','Mẫu số']}})}]}
},
/* ---------- 2 ---------- */
{id:'m2',name:'Số thập phân',sgk:'Chủ đề 2 · Bài 10–14',hk:1,
theory:{
tom:['Số thập phân gồm <b>phần nguyên</b> (bên trái dấu phẩy) và <b>phần thập phân</b> (bên phải dấu phẩy).','Các hàng sau dấu phẩy: <b>phần mười, phần trăm, phần nghìn</b>…','Viết thêm (hoặc bỏ) chữ số 0 ở tận cùng bên phải phần thập phân thì giá trị không đổi: 2,5 = 2,50 = 2,500.','Làm tròn: xét chữ số ngay sau hàng cần làm tròn; nếu ≥ 5 thì cộng 1 vào hàng đó.'],
nho:['0,1 = '+F(1,10)+'; 0,01 = '+F(1,100)+'; 0,001 = '+F(1,1000),'1 m = 100 cm → 1 cm = 0,01 m','1 kg = 1000 g → 1 g = 0,001 kg','1 tấn = 1000 kg; 1 tạ = 100 kg; 1 yến = 10 kg'],
luu:['So sánh phần nguyên trước, rồi mới so sánh lần lượt từng hàng phần mười, phần trăm…','2,5 <b>lớn hơn</b> 2,49 (vì 5 phần mười > 4 phần mười), dù 2,49 có nhiều chữ số hơn.','Đổi 3 kg 5 g = 3,005 kg (không phải 3,5 kg) vì 5 g = 0,005 kg.'],
nghi:['Viết các số về cùng số chữ số ở phần thập phân (thêm 0) để dễ so sánh.','Khi đổi đơn vị, xác định mỗi đơn vị “gấp 10, 100 hay 1000 lần” đơn vị kia.','Kẻ bảng hàng nếu chưa chắc vị trí chữ số.'],
vd:{de:'Viết 4 m 7 cm dưới dạng số đo có đơn vị mét.',giai:'7 cm = '+F(7,100)+' m = 0,07 m. Vậy 4 m 7 cm = 4,07 m.'},
dat:['Đọc, viết, nêu giá trị từng chữ số của số thập phân.','So sánh, sắp xếp số thập phân.','Viết số đo độ dài, khối lượng dưới dạng số thập phân.','Làm tròn số thập phân đến hàng cho trước.'],
mo2:['Đếm các số thập phân nằm giữa hai số cho trước.','Tìm số lớn nhất / bé nhất làm tròn được một số cho trước.'],
mo3:['<b>Dời dấu phẩy</b>: sang phải 1 chữ số → số gấp 10 lần; sang trái 1 chữ số → số giảm 10 lần. Bài “hiệu của số mới và số cũ” quy về toán hiệu – tỉ (hiệu 9 phần).']},
gen:{
1:[()=>{const digs=shuffle([1,2,3,4,5,6,7,8,9]);const ip=digs[0];const d=[digs[1],digs[2],digs[3]];const pos=R(0,2);const s=ip+','+d.join('');const names=['hàng phần mười','hàng phần trăm','hàng phần nghìn'];return QM(`Trong số ${s}, chữ số ${d[pos]} thuộc hàng nào?`,[names[pos],...names.filter((_,i)=>i!==pos),'hàng đơn vị'],0,`Sau dấu phẩy lần lượt là hàng phần mười (${d[0]}), phần trăm (${d[1]}), phần nghìn (${d[2]}).`)},
()=>{const t=R(0,2);if(t===0){const a=R(1,9),b=R(1,99);return QN(`Viết số thích hợp: ${a} m ${b} cm = … m`,a+b/100,`${b} cm = ${F(b,100)} m = ${fmt(b/100)} m. Vậy ${a} m ${b} cm = ${fmt(a+b/100)} m.`,{unit:'m',hint:'1 cm = 0,01 m'})}if(t===1){const a=R(1,9),b=R(1,999);return QN(`Viết số thích hợp: ${a} kg ${b} g = … kg`,a+b/1000,`${b} g = ${F(b,1000)} kg = ${fmt(b/1000)} kg. Vậy ${a} kg ${b} g = ${fmt(a+b/1000)} kg.`,{unit:'kg',hint:'1 g = 0,001 kg'})}const a=R(1,20),b=R(1,999);return QN(`Viết số thích hợp: ${a} km ${b} m = … km`,a+b/1000,`${b} m = ${fmt(b/1000)} km. Vậy ${a} km ${b} m = ${fmt(a+b/1000)} km.`,{unit:'km',hint:'1 m = 0,001 km'})},
()=>{const xi=R(1001,99999);const x=xi/1000;if(Math.random()<.5){const r=Math.round(xi/100)/10;return QN(`Làm tròn số ${fmt(x)} đến hàng phần mười.`,r,`Chữ số hàng phần trăm là ${Math.floor(xi/10)%10} ${Math.floor(xi/10)%10>=5?'≥ 5 nên cộng thêm 1 vào hàng phần mười':'< 5 nên giữ nguyên hàng phần mười'}: ${fmt(r)}.`,{hint:'Nhìn chữ số hàng phần trăm.'})}const r=Math.round(xi/1000);return QN(`Làm tròn số ${fmt(x)} đến số tự nhiên gần nhất.`,r,`Chữ số hàng phần mười là ${Math.floor(xi/100)%10} ${Math.floor(xi/100)%10>=5?'≥ 5 nên cộng thêm 1 vào phần nguyên':'< 5 nên giữ nguyên phần nguyên'}: ${r}.`,{hint:'Nhìn chữ số hàng phần mười.'})},
()=>{const ip=R(1,9);let s=new Set();while(s.size<4){const dp=R(1,3);s.add(rnd(ip+R(1,Math.pow(10,dp)-1)/Math.pow(10,dp),3))}const arr=[...s];const mx=Math.max(...arr);const opts=[mx,...arr.filter(v=>v!==mx)].map(fmt);return QM(`Số lớn nhất trong các số sau là:`,opts,0,`So sánh phần nguyên (bằng nhau), rồi so sánh lần lượt hàng phần mười, phần trăm, phần nghìn. Số lớn nhất là ${fmt(mx)}.`,{hint:'Viết các số cho cùng số chữ số ở phần thập phân.'})}],
2:[()=>{const a=R(10,60)/10,b=rnd(a+R(5,15)/10,1);return QN(`Có bao nhiêu số thập phân có <b>một chữ số</b> ở phần thập phân, lớn hơn ${fmt(a)} và bé hơn ${fmt(b)}?`,Math.round(b*10)-Math.round(a*10)-1,`Các số đó là ${fmt(a+0.1)}; ${fmt(a+0.2)}; …; ${fmt(b-0.1)}. Đổi ra phần mười: từ ${Math.round(a*10)+1} đến ${Math.round(b*10)-1} phần mười, có ${Math.round(b*10)-Math.round(a*10)-1} số.`,{unit:'số',hint:'Nghĩ theo đơn vị “phần mười”.'})},
()=>{const t=R(0,2);if(t===0){const a=R(1,9),b=R(1,99);return QN(`Viết số thích hợp: ${a} tấn ${b} kg = … tấn`,a+b/1000,`1 tấn = 1000 kg nên ${b} kg = ${fmt(b/1000)} tấn. Vậy ${a} tấn ${b} kg = ${fmt(a+b/1000)} tấn.`,{unit:'tấn',hint:'Cẩn thận chữ số 0.'})}if(t===1){const a=R(1,9),b=R(1,9);return QN(`Viết số thích hợp: ${a} tạ ${b} kg = … tạ`,a+b/100,`1 tạ = 100 kg nên ${b} kg = ${fmt(b/100)} tạ. Vậy ${a} tạ ${b} kg = ${fmt(a+b/100)} tạ.`,{unit:'tạ'})}const g=R(1001,9999);return QN(`Viết số thích hợp: ${fmt(g)} g = … kg`,g/1000,`1000 g = 1 kg nên ${fmt(g)} g = ${fmt(g/1000)} kg.`,{unit:'kg'})},
()=>{const X=R(11,98)/10;if(Math.random()<.5)return QN(`Tìm số thập phân <b>lớn nhất</b> có hai chữ số ở phần thập phân mà khi làm tròn đến hàng phần mười ta được ${fmt(X)}.`,rnd(X+0.04,2),`Các số có hai chữ số thập phân làm tròn được ${fmt(X)} là từ ${fmt(rnd(X-0.05,2))} đến ${fmt(rnd(X+0.04,2))}. Lớn nhất: ${fmt(rnd(X+0.04,2))}.`,{hint:'Chữ số hàng phần trăm lớn nhất bao nhiêu để không bị làm tròn lên?'});return QN(`Tìm số thập phân <b>bé nhất</b> có hai chữ số ở phần thập phân mà khi làm tròn đến hàng phần mười ta được ${fmt(X)}.`,rnd(X-0.05,2),`Số ${fmt(rnd(X-0.05,2))} có chữ số hàng phần trăm là 5 nên làm tròn lên thành ${fmt(X)}. Số bé hơn nữa (${fmt(rnd(X-0.06,2))}) làm tròn thành ${fmt(rnd(X-0.1,1))}.`,{hint:'Chữ số 5 ở hàng phần trăm thì làm tròn lên.'})},
()=>{const ip=R(2,8);const vals=shuffle([rnd(ip+R(1,9)/10,1),rnd(ip+R(10,99)/100,2),rnd(ip+R(100,999)/1000,3),rnd(ip+R(1,9)/100,2)]);const uniq=[...new Set(vals)];if(uniq.length<4)return MATH[1].gen[1][3]();const s=uniq.slice().sort((a,b)=>a-b);return QM(`Sắp xếp các số ${uniq.map(fmt).join('; ')} theo thứ tự từ bé đến lớn. Số đứng <b>thứ hai</b> là:`,[s[1],s[0],s[2],s[3]].map(fmt),0,`Thứ tự từ bé đến lớn: ${s.map(fmt).join(' < ')}.`)}],
3:[()=>{const A=R(11,999)/(Math.random()<.5?10:100);const d=rnd(9*A,4);return QN(`Khi dời dấu phẩy của một số thập phân sang <b>phải</b> một chữ số thì được số mới hơn số cũ ${fmt(d)}. Tìm số cũ.`,A,`Dời dấu phẩy sang phải một chữ số thì số mới gấp 10 lần số cũ. Hiệu số phần: 10 − 1 = 9. Số cũ: ${fmt(d)} : 9 = ${fmt(A)}.`,{hint:'Số mới gấp mấy lần số cũ?',fig:{t:'ht',m:1,n:10,D:d,names:['Số cũ','Số mới']}})},
()=>{const A=R(101,999)/10;const s=rnd(11*A,4);return QN(`Tổng của một số thập phân và số được tạo thành khi dời dấu phẩy của nó sang phải một chữ số là ${fmt(s)}. Tìm số thập phân đó.`,A,`Số mới gấp 10 lần số đó. Tổng số phần: 10 + 1 = 11. Số đó: ${fmt(s)} : 11 = ${fmt(A)}.`,{hint:'Tổng – tỉ với tỉ số 1 : 10.',fig:{t:'tt',m:1,n:10,S:s,names:['Số cũ','Số mới']}})},
()=>{const A=R(201,9999)/10;const d=rnd(A-A/10,4);return QN(`Khi dời dấu phẩy của một số sang <b>trái</b> một chữ số thì số đó giảm đi ${fmt(d)}. Tìm số đó.`,A,`Dời sang trái một chữ số thì số mới bằng ${F(1,10)} số cũ. Coi số mới là 1 phần, số cũ là 10 phần. Hiệu: 9 phần = ${fmt(d)}. Một phần: ${fmt(rnd(d/9,4))}. Số đó: ${fmt(A)}.`,{hint:'Số cũ gấp 10 lần số mới.'})},
()=>{const X=R(101,998)/100;return QN(`Tìm số thập phân <b>lớn nhất</b> có ba chữ số ở phần thập phân mà khi làm tròn đến hàng phần trăm ta được ${fmt(X)}.`,rnd(X+0.004,3),`Chữ số hàng phần nghìn phải bé hơn 5 thì mới giữ nguyên hàng phần trăm. Lớn nhất là 4: ${fmt(rnd(X+0.004,3))}.`)}]}
},

{id:'m3',name:'Đơn vị đo diện tích',sgk:'Chủ đề 3 · Bài 15–18',hk:1,
theory:{
tom:['Hai đơn vị đo diện tích liền nhau hơn kém nhau <b>100 lần</b>.','Ki-lô-mét vuông (km²) dùng đo diện tích lớn như tỉnh, thành phố. Héc-ta (ha) dùng đo ruộng, rừng.','Mỗi đơn vị đo diện tích ứng với <b>hai chữ số</b> khi viết dưới dạng số thập phân.'],
nho:['1 km² = 100 ha = 1 000 000 m²','1 ha = 10 000 m² = 100 dam²','1 m² = 100 dm²; 1 dm² = 100 cm²','km² → hm² (ha) → dam² → m² → dm² → cm² → mm²'],
luu:['5 m² 7 dm² = 5,07 m² (mỗi đơn vị chiếm 2 chữ số), không phải 5,7 m².','Diện tích hình chữ nhật đo bằng mét thì ra m², muốn đổi sang ha phải chia cho 10 000.'],
nghi:['Đổi tất cả về cùng một đơn vị trước khi tính.','Đếm số bước nhảy giữa hai đơn vị: mỗi bước × 100 (hoặc : 100).'],
vd:{de:'Một thửa ruộng hình chữ nhật dài 250 m, rộng 120 m. Diện tích thửa ruộng bằng bao nhiêu héc-ta?',giai:'Diện tích: 250 × 120 = 30 000 (m²). 30 000 m² = 3 ha.'},
dat:['Nêu được quan hệ giữa km², ha, m², dm², cm².','Chuyển đổi đơn vị đo diện tích, viết dưới dạng số thập phân.','Giải bài toán thực tế có đổi đơn vị diện tích.'],
mo2:['Bài toán năng suất: cứ 100 m² thu hoạch được … kg.','Chu vi và tỉ số giữa chiều dài, chiều rộng → tìm diện tích.'],
mo3:['Tăng cạnh hình vuông thêm k thì diện tích tăng thêm 2 × a × k + k × k. Vẽ hình để thấy phần tăng gồm hai hình chữ nhật và một hình vuông nhỏ.','Tổng – hiệu trong bài chu vi: nửa chu vi = dài + rộng.']},
gen:{
1:[()=>{const t=R(0,5);if(t===0){const a=R(2,40);return QN(`${a} km² = … ha`,a*100,`1 km² = 100 ha nên ${a} km² = ${a*100} ha.`,{unit:'ha'})}if(t===1){const a=R(2,15);return QN(`${a} ha = … m²`,a*10000,`1 ha = 10 000 m² nên ${a} ha = ${fmt(a*10000)} m².`,{unit:'m²'})}if(t===2){const a=R(1,30),b=R(1,99);return QN(`${a} m² ${b} dm² = … m²`,a+b/100,`${b} dm² = ${F(b,100)} m² = ${fmt(b/100)} m². Vậy ${a} m² ${b} dm² = ${fmt(a+b/100)} m².`,{unit:'m²',hint:'1 dm² = 0,01 m²'})}if(t===3){const c=R(1,99)*1000;return QN(`${fmt(c)} m² = … ha`,c/10000,`10 000 m² = 1 ha nên ${fmt(c)} m² = ${fmt(c/10000)} ha.`,{unit:'ha'})}if(t===4){const a=R(2,60);return QN(`${a} dm² = … cm²`,a*100,`1 dm² = 100 cm² nên ${a} dm² = ${a*100} cm².`,{unit:'cm²'})}const a=R(5,950);return QN(`${a} ha = … km²`,a/100,`100 ha = 1 km² nên ${a} ha = ${fmt(a/100)} km².`,{unit:'km²'})},
()=>{const L=R(10,40)*10,W=R(5,20)*10;const S=L*W;return QN(`Một thửa ruộng hình chữ nhật dài ${L} m, rộng ${W} m. Diện tích thửa ruộng bằng bao nhiêu héc-ta?`,S/10000,`Diện tích: ${L} × ${W} = ${fmt(S)} (m²) = ${fmt(S/10000)} ha.`,{unit:'ha',hint:'Tính ra m² rồi đổi sang ha.'})}],
2:[()=>{const L=R(4,20)*10,W=R(2,10)*10,q=pick([50,60,65,70,80]);const S=L*W;return QN(`Một thửa ruộng hình chữ nhật dài ${L} m, rộng ${W} m. Cứ 100 m² thu hoạch được ${q} kg thóc. Hỏi thu hoạch được bao nhiêu ki-lô-gam thóc?`,S/100*q,`Diện tích: ${L} × ${W} = ${fmt(S)} (m²). ${fmt(S)} m² gấp 100 m² số lần: ${fmt(S)} : 100 = ${S/100}. Số thóc: ${S/100} × ${q} = ${fmt(S/100*q)} (kg).`,{unit:'kg'})},
()=>{const k=R(4,30);const L=3*k,W=2*k,P=10*k;return QN(`Một mảnh vườn hình chữ nhật có chu vi ${P} m, chiều rộng bằng ${F(2,3)} chiều dài. Tính diện tích mảnh vườn.`,L*W,`Nửa chu vi: ${P/2} m. Coi rộng 2 phần, dài 3 phần, tổng 5 phần. Rộng: ${P/2} : 5 × 2 = ${W} (m); dài: ${L} m. Diện tích: ${L} × ${W} = ${fmt(L*W)} (m²).`,{unit:'m²',hint:'Nửa chu vi = dài + rộng.',fig:{t:'tt',m:2,n:3,S:P/2,names:['Rộng','Dài']}})},
()=>{const a=R(2,9),b=R(1,99);return QN(`${a} ha ${b} m² = … ha`,a+b/10000,`1 m² = 0,0001 ha nên ${b} m² = ${fmt(b/10000)} ha. Vậy ${a} ha ${b} m² = ${fmt(a+b/10000)} ha.`,{unit:'ha',hint:'Giữa ha và m² cách 2 bậc, mỗi bậc chiếm 2 chữ số.'})}],
3:[()=>{let W=R(5,40),d=R(2,30);const L=W+d;const P=2*(L+W);return QN(`Một hình chữ nhật có chu vi ${P} m, chiều dài hơn chiều rộng ${d} m. Tính diện tích hình chữ nhật.`,L*W,`Nửa chu vi: ${P/2} m. Chiều dài: (${P/2} + ${d}) : 2 = ${L} (m). Chiều rộng: ${W} m. Diện tích: ${L} × ${W} = ${L*W} (m²).`,{unit:'m²',hint:'Tổng – hiệu với tổng là nửa chu vi.',fig:{t:'th',S:P/2,D:d,names:['Rộng','Dài']}})},
()=>{const a=R(5,30),k=pick([1,2,3,4]);const inc=2*a*k+k*k;return QN(`Nếu tăng cạnh một hình vuông thêm ${k} m thì diện tích tăng thêm ${inc} m². Tính diện tích hình vuông ban đầu.`,a*a,`Phần tăng gồm 2 hình chữ nhật (cạnh a và ${k}) và 1 hình vuông nhỏ cạnh ${k}. Diện tích hình vuông nhỏ: ${k*k} m². Hai hình chữ nhật: ${inc} − ${k*k} = ${inc-k*k} (m²), mỗi hình ${(inc-k*k)/2} m². Cạnh a = ${(inc-k*k)/2} : ${k} = ${a} (m). Diện tích: ${a} × ${a} = ${a*a} (m²).`,{unit:'m²',hint:'Vẽ hình vuông cũ và phần tăng thêm.',fig:{t:'sqgrow',k}})},
()=>{const W=R(5,25),L=W+R(3,20),x=R(2,8);const inc=x*W;return QN(`Một hình chữ nhật có chiều dài ${L} m. Nếu tăng chiều dài thêm ${x} m thì diện tích tăng thêm ${inc} m². Tính diện tích hình chữ nhật ban đầu.`,L*W,`Phần tăng là hình chữ nhật có cạnh ${x} m và chiều rộng. Chiều rộng: ${inc} : ${x} = ${W} (m). Diện tích ban đầu: ${L} × ${W} = ${L*W} (m²).`,{unit:'m²'})}]}
},
/* ---------- 4 ---------- */
{id:'m4',name:'Các phép tính với số thập phân',sgk:'Chủ đề 4 · Bài 19–24',hk:1,
theory:{
tom:['<b>Cộng, trừ</b>: đặt tính sao cho các dấu phẩy thẳng cột, tính như số tự nhiên, đặt dấu phẩy ở hiệu/tổng thẳng cột.','<b>Nhân</b>: nhân như số tự nhiên, rồi đếm tổng số chữ số ở phần thập phân của cả hai thừa số để đặt dấu phẩy.','<b>Chia cho số thập phân</b>: đếm số chữ số phần thập phân của số chia, dời dấu phẩy của số bị chia sang phải bấy nhiêu chữ số, bỏ dấu phẩy ở số chia rồi chia.'],
nho:['× 10; 100; 1000 → dời dấu phẩy sang <b>phải</b> 1; 2; 3 chữ số','× 0,1; 0,01; 0,001 → dời dấu phẩy sang <b>trái</b> 1; 2; 3 chữ số',': 0,1 = × 10;  : 0,5 = × 2;  : 0,25 = × 4','a × b + a × c = a × (b + c)'],
luu:['Khi nhân, không cần đặt dấu phẩy thẳng cột.','Thiếu chữ số khi dời dấu phẩy thì thêm chữ số 0: 3,5 × 100 = 350.','Khi chia còn dư, có thể viết thêm 0 vào bên phải số dư để chia tiếp.'],
nghi:['Ước lượng kết quả trước (làm tròn) để phát hiện đặt sai dấu phẩy.','Tìm cặp số “đẹp”: 2,5 × 4 = 10; 1,25 × 8 = 10; 0,5 × 2 = 1.','Thấy thừa số chung thì dùng tính chất phân phối.'],
vd:{de:'Tính bằng cách thuận tiện: 4,7 × 6,5 + 4,7 × 3,5',giai:'= 4,7 × (6,5 + 3,5) = 4,7 × 10 = 47.'},
dat:['Cộng, trừ, nhân, chia số thập phân (đặt tính và tính).','Nhân, chia nhẩm với 10; 100; 0,1; 0,01…','Tìm thành phần chưa biết; tính giá trị biểu thức; tính thuận tiện.'],
mo2:['Tìm x với các phép tính số thập phân.','Tính thuận tiện bằng tính chất giao hoán, kết hợp, phân phối.'],
mo3:['Tổng dãy cách đều: (số đầu + số cuối) × số số hạng : 2.','Bài “đặt sai tích riêng”: khi nhân với số có hai chữ số mà đặt các tích riêng thẳng cột thì thực chất đã nhân với tổng các chữ số.']},
gen:{
1:[()=>{const a=dec(1,999,R(1,2)),b=dec(1,99,R(1,3));return QN(`Tính: ${fmt(a)} + ${fmt(b)}`,a+b,`Đặt dấu phẩy thẳng cột: ${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}.`,{hint:'Đặt tính sao cho các dấu phẩy thẳng hàng.'})},
()=>{let a=dec(10,999,R(1,2)),b=dec(1,99,R(1,3));if(b>a)[a,b]=[b,a];return QN(`Tính: ${fmt(a)} − ${fmt(b)}`,a-b,`${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}. (Thêm chữ số 0 cho đủ hàng khi cần.)`,{hint:'Viết thêm chữ số 0 cho số chữ số thập phân bằng nhau.'})},
()=>{const a=dec(1,99,R(1,2)),b=pick([dec(1,9,1),R(2,35),dec(1,9,2)]);return QN(`Tính: ${fmt(a)} × ${fmt(b)}`,a*b,`Nhân như số tự nhiên rồi đếm chữ số ở phần thập phân của hai thừa số để đặt dấu phẩy: ${fmt(a*b)}.`,{hint:'Đếm tổng số chữ số sau dấu phẩy của hai thừa số.'})},
()=>{const b=pick([R(2,25),dec(1,9,1),dec(0.1,2,2)]),q=dec(1,60,R(1,2));const a=rnd(b*q,4);return QN(`Tính: ${fmt(a)} : ${fmt(b)}`,q,`${fmt(a)} : ${fmt(b)} = ${fmt(q)}. Thử lại: ${fmt(q)} × ${fmt(b)} = ${fmt(a)}.`,{hint:'Nếu số chia là số thập phân, dời dấu phẩy ở cả hai số.'})},
()=>{const a=dec(0.1,99,R(1,3));const m=pick([10,100,1000,0.1,0.01,0.001]);const div=Math.random()<.4;return QN(`Tính nhẩm: ${fmt(a)} ${div?':':'×'} ${fmt(m)}`,div?a/m:a*m,`${div?'Chia':'Nhân'} với ${fmt(m)} là dời dấu phẩy sang ${(m>=10)!==div?'phải':'trái'} ${String(Math.round(m>=10?m:1/m)).length-1} chữ số: ${fmt(div?a/m:a*m)}.`,{hint:'× 0,1 giống : 10.'})}],
2:[()=>{const t=R(0,2);const b=dec(1,9,1),x=dec(1,50,R(1,2));if(t===0)return QN(`Tìm x: x × ${fmt(b)} = ${fmt(rnd(x*b,4))}`,x,`x = ${fmt(rnd(x*b,4))} : ${fmt(b)} = ${fmt(x)}.`,{hint:'Tìm thừa số chưa biết.'});if(t===1)return QN(`Tìm x: x : ${fmt(b)} = ${fmt(x)}`,x*b,`x = ${fmt(x)} × ${fmt(b)} = ${fmt(x*b)}.`,{hint:'Tìm số bị chia.'});const c=dec(1,40,2);return QN(`Tìm x: ${fmt(rnd(x+c,4))} − x = ${fmt(c)}`,x,`x = ${fmt(rnd(x+c,4))} − ${fmt(c)} = ${fmt(x)}.`,{hint:'Tìm số trừ.'})},
()=>{const a=dec(1,20,1);const S=pick([10,100]);const b=S===10?dec(1,9,1):dec(10,90,1);const c=rnd(S-b,1);return QN(`Tính bằng cách thuận tiện: ${fmt(a)} × ${fmt(b)} + ${fmt(a)} × ${fmt(c)}`,a*S,`= ${fmt(a)} × (${fmt(b)} + ${fmt(c)}) = ${fmt(a)} × ${S} = ${fmt(a*S)}.`,{hint:'Hai tích có thừa số chung.'})},
()=>{const P=pick([[2.5,4],[1.25,8],[0.25,4],[0.5,2],[0.125,8]]);const x=dec(1,99,1);return QN(`Tính bằng cách thuận tiện: ${fmt(P[0])} × ${fmt(x)} × ${P[1]}`,P[0]*P[1]*x,`= (${fmt(P[0])} × ${P[1]}) × ${fmt(x)} = ${fmt(P[0]*P[1])} × ${fmt(x)} = ${fmt(P[0]*P[1]*x)}.`,{hint:'Nhóm hai số có tích tròn chục.'})},
()=>{const a=dec(2,30,1),b=dec(1,9,1),c=pick([2,4,5]);return QN(`Tính giá trị biểu thức: ${fmt(a)} + ${fmt(b)} × ${c}`,a+b*c,`Nhân trước, cộng sau: ${fmt(b)} × ${c} = ${fmt(b*c)}; ${fmt(a)} + ${fmt(b*c)} = ${fmt(a+b*c)}.`,{hint:'Nhân, chia trước; cộng, trừ sau.'})}],
3:[()=>{const n=R(10,40);return QN(`Tính: 0,1 + 0,2 + 0,3 + … + ${fmt(n/10)}`,n*(n+1)/20,`Có ${n} số hạng, cách đều 0,1. Tổng = (0,1 + ${fmt(n/10)}) × ${n} : 2 = ${fmt(n*(n+1)/20)}.`,{hint:'Ghép số đầu với số cuối.'})},
()=>{const A=R(4,40);const k=rnd(1.5*A-2.5,2);return QN(`Một số nhân với 2,5 thì được kết quả lớn hơn tổng của số đó với 2,5 là ${fmt(k)}. Tìm số đó.`,A,`Số × 2,5 − (số + 2,5) = số × 1,5 − 2,5 = ${fmt(k)}. Suy ra số × 1,5 = ${fmt(k+2.5)}; số = ${fmt(k+2.5)} : 1,5 = ${A}.`,{hint:'Số × 2,5 − số = số × 1,5.'})},
()=>{const A=R(11,99);return QN(`Khi nhân một số với 4,5, bạn An đặt các tích riêng thẳng cột như phép cộng nên được kết quả là ${9*A}. Tìm tích đúng.`,4.5*A,`Đặt thẳng cột thì An đã nhân số đó với 4 + 5 = 9. Số đó: ${9*A} : 9 = ${A}. Tích đúng: ${A} × 4,5 = ${fmt(4.5*A)}.`,{hint:'An thực chất đã nhân với bao nhiêu?'})},
()=>{const a=pick([12.5,2.5,1.25,0.25]);const m=a===12.5?8:a===2.5?4:a===1.25?8:4;const b=rnd(m+dec(0.1,2.9,1),1);const c=rnd(b-m,1);return QN(`Tính nhanh: ${fmt(a)} × ${fmt(b)} − ${fmt(a)} × ${fmt(c)}`,a*m,`= ${fmt(a)} × (${fmt(b)} − ${fmt(c)}) = ${fmt(a)} × ${m} = ${fmt(a*m)}.`)}]}
},
/* ---------- 5 ---------- */
{id:'m5',name:'Hình tam giác, hình thang, hình tròn',sgk:'Chủ đề 5 · Bài 25–29',hk:1,
theory:{
tom:['Hình tam giác có 3 cạnh, 3 đỉnh, 3 góc. Đường cao là đoạn thẳng kẻ từ một đỉnh vuông góc với cạnh đối diện (đáy).','Hình thang có một cặp cạnh đối diện song song (đáy lớn, đáy bé). Hình thang vuông có một cạnh bên vuông góc với hai đáy.','Hình tròn có tâm O; bán kính r; đường kính d = 2 × r.'],
nho:['S tam giác = '+F('a × h',2),'S hình thang = '+F('(a + b) × h',2),'Chu vi hình tròn: C = d × 3,14 = r × 2 × 3,14','S hình tròn = r × r × 3,14'],
luu:['Đáy và chiều cao phải cùng đơn vị đo.','Đừng quên chia 2 trong công thức tam giác và hình thang.','Diện tích hình tròn dùng <b>bán kính</b>, không dùng đường kính.'],
nghi:['Vẽ hình, ghi số đo lên hình.','Xác định cặp “đáy – chiều cao” tương ứng.','Hình phức tạp → chia thành các hình quen thuộc, hoặc lấy hình lớn trừ hình nhỏ.'],
vd:{de:'Một hình thang có đáy lớn 12 cm, đáy bé 8 cm, chiều cao 5 cm. Tính diện tích.',giai:'S = (12 + 8) × 5 : 2 = 50 (cm²).'},
dat:['Nhận biết đường cao, đáy của tam giác và hình thang.','Tính diện tích tam giác, hình thang; chu vi và diện tích hình tròn.','Tính ngược: biết diện tích tìm đáy hoặc chiều cao.'],
mo2:['Diện tích phần tô màu = hình lớn − hình nhỏ.','Biết chu vi hình tròn → tìm bán kính → tìm diện tích.'],
mo3:['Hai tam giác có <b>chung chiều cao</b> thì tỉ số diện tích bằng tỉ số hai đáy.','Bán kính gấp k lần thì chu vi gấp k lần, diện tích gấp k × k lần.','Hình vuông ngoại tiếp hình tròn: r × r = '+F('S hình vuông',4)+'.']},
gen:{
1:[()=>{const a=R(4,30),h=R(3,20);return QN(`Tính diện tích hình tam giác có độ dài đáy ${a} cm và chiều cao ${h} cm.`,a*h/2,`S = ${a} × ${h} : 2 = ${fmt(a*h/2)} (cm²).`,{unit:'cm²',hint:'S = a × h : 2',fig:{t:'tri',a,h}})},
()=>{const b=R(3,15),a=b+R(2,12),h=R(2,12);return QN(`Tính diện tích hình thang có đáy lớn ${a} m, đáy bé ${b} m, chiều cao ${h} m.`,(a+b)*h/2,`S = (${a} + ${b}) × ${h} : 2 = ${fmt((a+b)*h/2)} (m²).`,{unit:'m²',hint:'(a + b) × h : 2',fig:{t:'trap',a,b,h}})},
()=>{if(Math.random()<.5){const r=R(2,20);return QN(`Tính chu vi hình tròn có bán kính ${r} cm.`,r*2*3.14,`C = ${r} × 2 × 3,14 = ${fmt(r*2*3.14)} (cm).`,{unit:'cm'})}const d=R(2,30);return QN(`Tính chu vi hình tròn có đường kính ${d} dm.`,d*3.14,`C = ${d} × 3,14 = ${fmt(d*3.14)} (dm).`,{unit:'dm'})},
()=>{const r=R(2,15);return QN(`Tính diện tích hình tròn có bán kính ${r} cm.`,r*r*3.14,`S = ${r} × ${r} × 3,14 = ${fmt(r*r*3.14)} (cm²).`,{unit:'cm²',hint:'r × r × 3,14',fig:{t:'circ',r}})}],
2:[()=>{const a=R(4,30),h=R(3,20);const S=a*h/2;return QN(`Một hình tam giác có diện tích ${fmt(S)} cm² và độ dài đáy ${a} cm. Tính chiều cao.`,h,`h = S × 2 : a = ${fmt(S)} × 2 : ${a} = ${h} (cm).`,{unit:'cm',hint:'Từ S = a × h : 2 suy ra h = S × 2 : a.',fig:{t:'tri',a,h}})},
()=>{const b=R(3,15),a=b+R(2,12),h=R(2,12);const S=(a+b)*h/2;return QN(`Một hình thang có diện tích ${fmt(S)} m², chiều cao ${h} m, đáy bé ${b} m. Tính đáy lớn.`,a,`Tổng hai đáy: ${fmt(S)} × 2 : ${h} = ${a+b} (m). Đáy lớn: ${a+b} − ${b} = ${a} (m).`,{unit:'m'})},
()=>{const r=R(2,15);const C=rnd(r*2*3.14,2);return QN(`Một hình tròn có chu vi ${fmt(C)} cm. Tính diện tích hình tròn.`,r*r*3.14,`Đường kính: ${fmt(C)} : 3,14 = ${2*r} (cm). Bán kính: ${r} cm. S = ${r} × ${r} × 3,14 = ${fmt(r*r*3.14)} (cm²).`,{unit:'cm²',hint:'Tìm bán kính trước.',fig:{t:'circ',r}})},
()=>{const r=R(2,10);return QN(`Một hình vuông cạnh ${2*r} cm có một hình tròn nằm bên trong, tiếp xúc với 4 cạnh (đường kính bằng cạnh hình vuông). Tính diện tích phần hình vuông nằm ngoài hình tròn.`,4*r*r-3.14*r*r,`S vuông: ${2*r} × ${2*r} = ${4*r*r} (cm²). Bán kính: ${r} cm; S tròn: ${r} × ${r} × 3,14 = ${fmt(3.14*r*r)} (cm²). Phần ngoài: ${4*r*r} − ${fmt(3.14*r*r)} = ${fmt(4*r*r-3.14*r*r)} (cm²).`,{unit:'cm²',hint:'Lấy hình lớn trừ hình nhỏ.',fig:{t:'sqcirc',r}})}],
3:[()=>{const b=R(5,15),a=b+R(3,12);let x,h;do{x=R(2,8);h=R(4,16)}while(x*h%2);const y=x*h/2;return QN(`Một hình thang có đáy lớn ${a} cm, đáy bé ${b} cm. Nếu kéo dài đáy lớn thêm ${x} cm thì diện tích tăng thêm ${y} cm². Tính diện tích hình thang ban đầu.`,(a+b)*h/2,`Phần tăng là tam giác có đáy ${x} cm, chiều cao bằng chiều cao hình thang: h = ${y} × 2 : ${x} = ${h} (cm). S = (${a} + ${b}) × ${h} : 2 = ${(a+b)*h/2} (cm²).`,{unit:'cm²',hint:'Phần diện tích tăng thêm là hình gì?',fig:{t:'trap',a,b,h}})},
()=>{const k=R(2,5);return QN(`Nếu tăng bán kính hình tròn lên gấp ${k} lần thì diện tích hình tròn tăng lên gấp bao nhiêu lần?`,k*k,`S = r × r × 3,14. Bán kính gấp ${k} lần thì S mới = (${k} × r) × (${k} × r) × 3,14 = ${k*k} × r × r × 3,14. Diện tích gấp ${k*k} lần.`,{unit:'lần',hint:'Bán kính xuất hiện hai lần trong công thức.'})},
()=>{const P=pick([[1,2],[1,3],[2,5],[3,4],[2,3]]);const S=P[1]*R(6,30)*2;return QN(`Tam giác ABC có diện tích ${S} cm². Điểm M nằm trên cạnh BC sao cho BM = ${F(P[0],P[1])} BC. Tính diện tích tam giác ABM.`,S*P[0]/P[1],`Hai tam giác ABM và ABC có chung chiều cao kẻ từ A. Tỉ số diện tích bằng tỉ số đáy BM : BC = ${F(P[0],P[1])}. S(ABM) = ${S} × ${F(P[0],P[1])} = ${S*P[0]/P[1]} (cm²).`,{unit:'cm²',hint:'Hai tam giác chung đường cao.',fig:{t:'abm',p:P[0],q:P[1]}})},
()=>{const X=R(2,20)*4;return QN(`Một hình vuông có diện tích ${X} cm². Bên trong có một hình tròn với đường kính bằng cạnh hình vuông. Tính diện tích hình tròn.`,X/4*3.14,`Cạnh = 2 × r nên S vuông = (2 × r) × (2 × r) = 4 × r × r. Suy ra r × r = ${X} : 4 = ${X/4}. S tròn = ${X/4} × 3,14 = ${fmt(X/4*3.14)} (cm²).`,{unit:'cm²',hint:'Không cần tìm r, chỉ cần r × r.',fig:{t:'sqcirc',r:Math.round(Math.sqrt(X/4)*10)/10}})}]}
},

{id:'m6',name:'Tỉ số, tỉ số phần trăm',sgk:'Chủ đề 7 · Bài 36–44',hk:2,
theory:{
tom:['Tỉ số của a và b là a : b (hay '+F('a','b')+').','<b>Tỉ số phần trăm</b> của a và b: lấy a : b, nhân thương với 100 rồi viết thêm kí hiệu %.','<b>Tỉ lệ bản đồ</b> 1 : 1000 nghĩa là 1 cm trên bản đồ ứng với 1000 cm ngoài thực tế.'],
nho:['Tỉ số % của a và b = a : b × 100 %','Tìm p% của A: A × p : 100','Biết p% của một số là B → số đó = B : p × 100','Tổng – tỉ: số bé = Tổng : (tổng số phần) × số phần của số bé','Hiệu – tỉ: số bé = Hiệu : (hiệu số phần) × số phần của số bé'],
luu:['Giảm 20% <b>rồi</b> tăng 20% không trở về giá cũ.','Khi đổi tỉ lệ bản đồ, nhớ đổi cm → m (: 100) hoặc cm → km (: 100 000).','Lãi bao nhiêu phần trăm thường tính <b>so với tiền vốn</b>.'],
nghi:['Vẽ sơ đồ đoạn thẳng cho bài tổng – tỉ, hiệu – tỉ.','Xác định đâu là “cả” (100%) trong bài phần trăm.','Đổi về cùng đơn vị trước khi lập tỉ số.'],
vd:{de:'Lớp 5A có 32 học sinh, trong đó có 8 học sinh giỏi. Tìm tỉ số phần trăm số học sinh giỏi so với cả lớp.',giai:'8 : 32 = 0,25 = 25%.'},
dat:['Lập được tỉ số, tỉ số phần trăm của hai số.','Tìm giá trị phần trăm của một số và tìm một số khi biết giá trị phần trăm.','Giải bài toán tổng – tỉ, hiệu – tỉ; bài toán tỉ lệ bản đồ.'],
mo2:['Bài toán giảm giá, lãi – lỗ.','Tổng – tỉ có chuyển dời (chuyển từ kho này sang kho kia).'],
mo3:['Tăng p% rồi giảm p% → giảm '+F('p × p',100)+' %.','Bài toán tuổi: <b>hiệu số tuổi không đổi</b> theo thời gian.','Bài toán hạt khô – tươi: <b>lượng chất khô không đổi</b>.']},
gen:{
1:[()=>{const b=pick([20,25,40,50,80,200]);let p;do{p=R(1,19)*5}while(b*p%100);return QN(`Tìm tỉ số phần trăm của ${b*p/100} và ${b}.`,p,`${b*p/100} : ${b} = ${fmt(p/100)} = ${p}%.`,{unit:'%',hint:'Chia rồi nhân với 100.'})},
()=>{const p=pick([5,10,12,15,20,25,30,40,45,60,75]);const X=R(2,40)*20;return QN(`Tìm ${p}% của ${X}.`,X*p/100,`${X} × ${p} : 100 = ${fmt(X*p/100)}.`,{hint:'A × p : 100',fig:{t:'pct',p}})},
()=>{let m,n;do{m=R(1,5);n=R(m+1,8)}while(gcd(m,n)>1);const k=R(3,20);const S=(m+n)*k;const big=Math.random()<.5;return QN(`Tổng của hai số là ${S}. Tỉ số của hai số là ${F(m,n)}. Tìm số ${big?'lớn':'bé'}.`,big?n*k:m*k,`Tổng số phần: ${m} + ${n} = ${m+n}. Một phần: ${S} : ${m+n} = ${k}. Số bé: ${m*k}; số lớn: ${n*k}.`,{hint:'Vẽ sơ đồ: số bé '+m+' phần, số lớn '+n+' phần.',fig:{t:'tt',m,n,S}})},
()=>{let m,n;do{m=R(1,5);n=R(m+1,9)}while(gcd(m,n)>1);const k=R(3,25);const D=(n-m)*k;const big=Math.random()<.5;return QN(`Hiệu của hai số là ${D}. Tỉ số của hai số là ${F(m,n)}. Tìm số ${big?'lớn':'bé'}.`,big?n*k:m*k,`Hiệu số phần: ${n} − ${m} = ${n-m}. Một phần: ${D} : ${n-m} = ${k}. Số bé: ${m*k}; số lớn: ${n*k}.`,{hint:'Hiệu số phần ứng với hiệu hai số.',fig:{t:'ht',m,n,D}})},
()=>{const k=pick([500,1000,2000,5000,10000]);const a=R(2,15);return QN(`Trên bản đồ tỉ lệ 1 : ${fmt(k)}, quãng đường đo được ${a} cm. Độ dài thật là bao nhiêu mét?`,a*k/100,`Độ dài thật: ${a} × ${fmt(k)} = ${fmt(a*k)} (cm) = ${fmt(a*k/100)} m.`,{unit:'m',hint:'Nhân rồi đổi cm ra m.'})}],
2:[()=>{const G=R(5,60)*10000;const p=pick([10,15,20,25,30]);if(Math.random()<.5)return QN(`Một chiếc áo giá ${fmt(G)} đồng, nay giảm giá ${p}%. Hỏi giá mới là bao nhiêu đồng?`,G*(100-p)/100,`Số tiền giảm: ${fmt(G)} × ${p} : 100 = ${fmt(G*p/100)} (đồng). Giá mới: ${fmt(G*(100-p)/100)} đồng. (Hoặc: ${fmt(G)} × ${100-p}%.)`,{unit:'đồng'});const P=G*(100-p)/100;return QN(`Sau khi giảm giá ${p}%, một chiếc cặp có giá ${fmt(P)} đồng. Hỏi giá ban đầu là bao nhiêu đồng?`,G,`Giá sau giảm bằng ${100-p}% giá ban đầu. Giá ban đầu: ${fmt(P)} : ${100-p} × 100 = ${fmt(G)} (đồng).`,{unit:'đồng',hint:'Giá mới chiếm bao nhiêu phần trăm giá cũ?'})},
()=>{const V=R(4,40)*50000;const p=pick([10,15,20,25,30]);const B=V*(100+p)/100;return QN(`Một người mua hàng hết ${fmt(V)} đồng, bán được ${fmt(B)} đồng. Hỏi người đó lãi bao nhiêu phần trăm so với tiền vốn?`,p,`Tiền lãi: ${fmt(B-V)} đồng. Tỉ số %: ${fmt(B-V)} : ${fmt(V)} × 100 = ${p}%.`,{unit:'%'})},
()=>{let m,n;do{m=R(1,4);n=R(m+1,6)}while(gcd(m,n)>1);const k=R(4,20);const S=(m+n)*k;const x=R(2,9);const A=m*k+x;return QN(`Hai kho có tổng cộng ${S} tấn thóc. Nếu chuyển ${x} tấn từ kho A sang kho B thì số thóc kho A bằng ${F(m,n)} số thóc kho B. Hỏi lúc đầu kho A có bao nhiêu tấn thóc?`,A,`Tổng không đổi (${S} tấn). Sau khi chuyển: kho A = ${S} : ${m+n} × ${m} = ${m*k} (tấn). Lúc đầu kho A: ${m*k} + ${x} = ${A} (tấn).`,{unit:'tấn',hint:'Chuyển qua lại thì tổng không đổi.',fig:{t:'tt',m,n,S,names:['Kho A (sau)','Kho B (sau)']}})},
()=>{const k=pick([100000,200000,500000,1000000]);const a=R(2,20);return QN(`Quãng đường thật dài ${fmt(a*k/100000)} km. Trên bản đồ tỉ lệ 1 : ${fmt(k)}, quãng đường đó dài bao nhiêu xăng-ti-mét?`,a,`${fmt(a*k/100000)} km = ${fmt(a*k)} cm. Trên bản đồ: ${fmt(a*k)} : ${fmt(k)} = ${a} (cm).`,{unit:'cm',hint:'Đổi km ra cm trước.'})}],
3:[()=>{const p=pick([10,20,30,40,50]);return QN(`Một món hàng tăng giá ${p}%, sau đó lại giảm giá ${p}%. Hỏi so với giá ban đầu, giá cuối cùng giảm bao nhiêu phần trăm?`,p*p/100,`Coi giá ban đầu là 100%. Sau tăng: ${100+p}%. Giảm ${p}% của ${100+p}%: ${fmt((100+p)*p/100)}%. Giá cuối: ${fmt((100+p)*(100-p)/100)}%. Giảm: ${fmt(p*p/100)}%.`,{unit:'%',hint:'Lần giảm tính trên giá đã tăng.'})},
()=>{const k=pick([2,3,4]);const c2=R(8,15);const d=c2*(k-1);const n=R(1,c2-4);return QN(`Hiện nay mẹ hơn con ${d} tuổi. Sau ${n} năm nữa, tuổi mẹ gấp ${k} lần tuổi con. Tính tuổi con hiện nay.`,c2-n,`Hiệu số tuổi không đổi: ${d}. Sau ${n} năm, hiệu số phần: ${k} − 1 = ${k-1}. Tuổi con lúc đó: ${d} : ${k-1} = ${c2}. Tuổi con hiện nay: ${c2} − ${n} = ${c2-n}.`,{unit:'tuổi',hint:'Hiệu số tuổi luôn không đổi.',fig:{t:'ht',m:1,n:k,D:d,names:['Con (sau '+n+' năm)','Mẹ (sau '+n+' năm)']}})},
()=>{const P=pick([[90,10],[80,20],[60,10],[75,25],[40,20],[99,98]]);const [a,b]=P;let dry=1;while(!(Number.isInteger(dry*100/(100-a))&&Number.isInteger(dry*100/(100-b))))dry++;const m=a===99?1:R(1,4);dry*=m;const x=dry*100/(100-a),K=dry*100/(100-b);return QN(`${fmt(x)} kg hạt tươi có ${a}% là nước. Đem phơi khô, lượng nước chỉ còn ${b}%. Hỏi được bao nhiêu ki-lô-gam hạt khô?`,K,`Chất khô trong hạt tươi: ${100-a}% × ${fmt(x)} = ${fmt(dry)} (kg). Lượng chất khô không đổi, chiếm ${100-b}% hạt khô. Hạt khô: ${fmt(dry)} : ${100-b} × 100 = ${fmt(K)} (kg).`,{unit:'kg',hint:'Phơi khô chỉ mất nước, phần chất khô giữ nguyên.'})},
()=>{const P=pick([[25,80],[60,62.5],[150,40],[100,50],[300,25]]);return QN(`Số học sinh nữ bằng ${P[0]}% số học sinh nam. Hỏi số học sinh nam chiếm bao nhiêu phần trăm số học sinh cả lớp?`,P[1],`Coi số nam là 100 phần, số nữ là ${P[0]} phần. Cả lớp: ${100+P[0]} phần. Tỉ số %: 100 : ${100+P[0]} × 100 = ${fmt(P[1])}%.`,{unit:'%'})}]}
},
/* ---------- 7 ---------- */
{id:'m7',name:'Thể tích. Đơn vị đo thể tích',sgk:'Chủ đề 8 · Bài 45–48',hk:2,
theory:{
tom:['Thể tích là độ lớn phần không gian mà một vật chiếm chỗ.','Hai đơn vị đo thể tích liền nhau hơn kém nhau <b>1000 lần</b>.','Mỗi đơn vị đo thể tích ứng với <b>ba chữ số</b> khi viết dưới dạng số thập phân.'],
nho:['1 m³ = 1000 dm³','1 dm³ = 1000 cm³','1 dm³ = 1 lít; 1 cm³ = 1 ml','1 m³ = 1000 lít'],
luu:['3 m³ 5 dm³ = 3,005 m³ (ba chữ số), không phải 3,5 m³ hay 3,05 m³.','Đổi đơn vị diện tích nhảy 100, thể tích nhảy 1000 — đừng nhầm.'],
nghi:['Hình dung hình lập phương cạnh 1 dm chứa được 10 × 10 × 10 = 1000 hình lập phương cạnh 1 cm.','Bài về nước trong bể: tính thể tích (dm³) rồi đổi ra lít.'],
vd:{de:'2,5 m³ = … dm³',giai:'1 m³ = 1000 dm³ nên 2,5 m³ = 2,5 × 1000 = 2500 dm³.'},
dat:['Nêu quan hệ giữa m³, dm³, cm³ và lít.','Chuyển đổi đơn vị đo thể tích.','Giải bài toán thực tế về dung tích.'],
mo2:['Xếp hình lập phương nhỏ vào hộp: đếm theo lớp.','Chia nước ra chai, can.'],
mo3:['Đổi số đo phức hợp nhiều đơn vị.','Kết hợp với tỉ số phần trăm và phân số.']},
gen:{
1:[()=>{const t=R(0,5);if(t===0){const a=dec(1,20,R(0,2));return QN(`${fmt(a)} m³ = … dm³`,a*1000,`1 m³ = 1000 dm³ nên ${fmt(a)} m³ = ${fmt(a*1000)} dm³.`,{unit:'dm³'})}if(t===1){const a=dec(1,20,R(0,2));return QN(`${fmt(a)} dm³ = … cm³`,a*1000,`1 dm³ = 1000 cm³ nên ${fmt(a)} dm³ = ${fmt(a*1000)} cm³.`,{unit:'cm³'})}if(t===2){const a=R(1,9),b=R(1,999);return QN(`${a} m³ ${b} dm³ = … m³`,a+b/1000,`${b} dm³ = ${fmt(b/1000)} m³. Vậy ${a} m³ ${b} dm³ = ${fmt(a+b/1000)} m³.`,{unit:'m³',hint:'Mỗi đơn vị thể tích chiếm 3 chữ số.'})}if(t===3){const c=R(100,9999);return QN(`${fmt(c)} cm³ = … dm³`,c/1000,`1000 cm³ = 1 dm³ nên ${fmt(c)} cm³ = ${fmt(c/1000)} dm³.`,{unit:'dm³'})}if(t===4){const a=dec(1,50,R(0,1));return QN(`${fmt(a)} lít = … dm³`,a,`1 lít = 1 dm³ nên ${fmt(a)} lít = ${fmt(a)} dm³.`,{unit:'dm³'})}const a=dec(0.5,5,1);return QN(`${fmt(a)} m³ = … lít`,a*1000,`1 m³ = 1000 dm³ = 1000 lít nên ${fmt(a)} m³ = ${fmt(a*1000)} lít.`,{unit:'lít'})}],
2:[()=>{const a=R(2,8),b=R(2,6),c=R(2,5);return QN(`Người ta xếp các hình lập phương cạnh 1 cm vào đầy một hộp hình hộp chữ nhật dài ${a} cm, rộng ${b} cm, cao ${c} cm. Cần bao nhiêu hình lập phương?`,a*b*c,`Mỗi lớp: ${a} × ${b} = ${a*b} hình. Có ${c} lớp: ${a*b} × ${c} = ${a*b*c} (hình).`,{unit:'hình',hint:'Đếm theo từng lớp.'})},
()=>{const ch=pick([0.5,0.75,1.5,1.25]);const n=R(8,40);const V=rnd(ch*n,2);return QN(`Một thùng chứa ${fmt(V)} lít nước mắm. Người ta rót vào các chai, mỗi chai ${fmt(ch)} lít. Cần bao nhiêu chai?`,n,`${fmt(V)} : ${fmt(ch)} = ${n} (chai).`,{unit:'chai'})},
()=>{const a=dec(1,5,1),b=R(100,900);const tot=rnd(a*1000+b,1);return QN(`${fmt(a)} m³ + ${b} dm³ = … dm³`,tot,`${fmt(a)} m³ = ${fmt(a*1000)} dm³. Tổng: ${fmt(a*1000)} + ${b} = ${fmt(tot)} (dm³).`,{unit:'dm³'})}],
3:[()=>{const a=R(1,9),b=R(1,99),c=R(1,999);return QN(`${a} m³ ${b} dm³ ${c} cm³ = … dm³`,a*1000+b+c/1000,`${a} m³ = ${a*1000} dm³; ${c} cm³ = ${fmt(c/1000)} dm³. Tổng: ${fmt(a*1000+b+c/1000)} dm³.`,{unit:'dm³'})},
()=>{const V=R(4,20)*100;const p=pick([25,40,60,75]);return QN(`Một bể chứa được ${fmt(V)} lít nước. Hiện tại lượng nước trong bể chiếm ${p}% thể tích bể. Cần đổ thêm bao nhiêu mét khối nước để bể đầy?`,V*(100-p)/100/1000,`Còn thiếu ${100-p}% thể tích bể: ${fmt(V)} × ${100-p} : 100 = ${fmt(V*(100-p)/100)} (lít) = ${fmt(V*(100-p)/100/1000)} m³.`,{unit:'m³',hint:'1000 lít = 1 m³'})}]}
},

{id:'m8',name:'Hình hộp chữ nhật, hình lập phương',sgk:'Chủ đề 9 · Bài 49–55',hk:2,
theory:{
tom:['Hình hộp chữ nhật có 6 mặt là hình chữ nhật, 12 cạnh, 8 đỉnh; có ba kích thước: dài, rộng, cao.','Hình lập phương có 6 mặt là hình vuông bằng nhau, 12 cạnh bằng nhau.','Hình trụ có hai đáy là hai hình tròn bằng nhau.'],
nho:['HHCN: Sxq = (a + b) × 2 × c','HHCN: Stp = Sxq + 2 × a × b','HHCN: V = a × b × c','HLP: Sxq = a × a × 4;  Stp = a × a × 6;  V = a × a × a'],
luu:['Diện tích xung quanh là 4 mặt bên, <b>không</b> tính hai đáy.','Bể <b>không nắp</b>: diện tích cần lát = Sxq + 1 mặt đáy.','Ba kích thước phải cùng đơn vị.'],
nghi:['Vẽ hình khai triển để hình dung các mặt.','Đọc kĩ: “có nắp / không nắp”, “mặt trong / mặt ngoài”.','Thể tích nước → đổi dm³ sang lít.'],
vd:{de:'Một hình hộp chữ nhật dài 5 dm, rộng 4 dm, cao 3 dm. Tính diện tích toàn phần.',giai:'Sxq = (5 + 4) × 2 × 3 = 54 (dm²). Stp = 54 + 2 × 5 × 4 = 94 (dm²).'},
dat:['Nhận biết hình khai triển của HHCN, HLP, hình trụ.','Tính Sxq, Stp, thể tích HHCN và HLP.','Giải bài toán thực tế: bể nước, thùng, hộp quà.'],
mo2:['Biết thể tích và diện tích đáy → tìm chiều cao.','Cạnh hình lập phương gấp k lần → thể tích gấp k × k × k lần.'],
mo3:['Thả vật vào bể: thể tích vật = thể tích phần nước dâng lên.','Hình lập phương được sơn rồi cắt thành n × n × n khối nhỏ: 3 mặt sơn có 8 khối (ở đỉnh); 2 mặt có 12 × (n − 2); 1 mặt có 6 × (n − 2) × (n − 2); không mặt nào có (n − 2) × (n − 2) × (n − 2).']},
gen:{
1:[()=>{const a=R(3,15),b=R(2,a),c=R(2,10);const t=R(0,2);if(t===0)return QN(`Hình hộp chữ nhật dài ${a} cm, rộng ${b} cm, cao ${c} cm. Tính diện tích xung quanh.`,(a+b)*2*c,`Sxq = (${a} + ${b}) × 2 × ${c} = ${(a+b)*2*c} (cm²).`,{unit:'cm²',hint:'Chu vi đáy × chiều cao.'});if(t===1)return QN(`Hình hộp chữ nhật dài ${a} cm, rộng ${b} cm, cao ${c} cm. Tính diện tích toàn phần.`,(a+b)*2*c+2*a*b,`Sxq = (${a} + ${b}) × 2 × ${c} = ${(a+b)*2*c}. S đáy = ${a} × ${b} = ${a*b}. Stp = ${(a+b)*2*c} + ${a*b} × 2 = ${(a+b)*2*c+2*a*b} (cm²).`,{unit:'cm²'});return QN(`Hình hộp chữ nhật dài ${a} cm, rộng ${b} cm, cao ${c} cm. Tính thể tích.`,a*b*c,`V = ${a} × ${b} × ${c} = ${a*b*c} (cm³).`,{unit:'cm³'})},
()=>{const a=R(2,12);const t=R(0,2);const nm=['diện tích xung quanh','diện tích toàn phần','thể tích'][t];const v=[a*a*4,a*a*6,a*a*a][t];const u=['dm²','dm²','dm³'][t];const f=['a × a × 4','a × a × 6','a × a × a'][t];return QN(`Hình lập phương có cạnh ${a} dm. Tính ${nm}.`,v,`${f} = ${v} (${u}).`,{unit:u})},
()=>{const a=dec(1,6,1),b=dec(1,4,1),c=dec(1,3,1);return QN(`Một hình hộp chữ nhật có các kích thước ${fmt(a)} m; ${fmt(b)} m; ${fmt(c)} m. Tính thể tích.`,a*b*c,`V = ${fmt(a)} × ${fmt(b)} × ${fmt(c)} = ${fmt(a*b*c)} (m³).`,{unit:'m³'})}],
2:[()=>{const a=R(10,20),b=R(5,10),c=R(5,12);const p=pick([50,75,80,60]);return QN(`Một bể nước hình hộp chữ nhật dài ${a} dm, rộng ${b} dm, cao ${c} dm. Lượng nước trong bể chiếm ${p}% thể tích bể. Trong bể có bao nhiêu lít nước?`,a*b*c*p/100,`V bể = ${a} × ${b} × ${c} = ${a*b*c} (dm³). Nước: ${a*b*c} × ${p} : 100 = ${fmt(a*b*c*p/100)} (dm³) = ${fmt(a*b*c*p/100)} lít.`,{unit:'lít',hint:'1 dm³ = 1 lít',fig:{t:'box',a,b,c,water:c*p/100}})},
()=>{const a=R(4,15),b=R(3,10),c=R(2,12);return QN(`Một hình hộp chữ nhật có thể tích ${a*b*c} cm³, chiều dài ${a} cm, chiều rộng ${b} cm. Tính chiều cao.`,c,`Diện tích đáy: ${a} × ${b} = ${a*b} (cm²). Chiều cao: ${a*b*c} : ${a*b} = ${c} (cm).`,{unit:'cm'})},
()=>{const k=R(2,4);return QN(`Nếu gấp cạnh hình lập phương lên ${k} lần thì thể tích gấp lên bao nhiêu lần?`,k*k*k,`V = a × a × a. Cạnh gấp ${k} lần → V gấp ${k} × ${k} × ${k} = ${k*k*k} lần.`,{unit:'lần'})},
()=>{const a=R(4,12),b=R(3,8),c=R(3,8);return QN(`Một bể cá không có nắp, dài ${a} dm, rộng ${b} dm, cao ${c} dm. Tính diện tích kính dùng làm bể.`,(a+b)*2*c+a*b,`Sxq = (${a} + ${b}) × 2 × ${c} = ${(a+b)*2*c} (dm²). Một đáy: ${a*b} dm². Kính: ${(a+b)*2*c+a*b} dm².`,{unit:'dm²',hint:'Không nắp → chỉ một mặt đáy.',fig:{t:'box',a,b,c}})}],
3:[()=>{const a=R(4,10)*5,b=R(3,8)*5,h=R(1,6);return QN(`Một bể kính hình hộp chữ nhật có đáy dài ${a} cm, rộng ${b} cm, đang chứa nước. Thả một hòn đá chìm hẳn vào bể thì mực nước dâng thêm ${h} cm. Tính thể tích hòn đá.`,a*b*h,`Thể tích hòn đá bằng thể tích phần nước dâng lên: ${a} × ${b} × ${h} = ${a*b*h} (cm³).`,{unit:'cm³',hint:'Nước dâng lên đúng bằng phần đá chiếm chỗ.',fig:{t:'box',a,b,c:h+4,water:h,wl:'nước dâng '+h+' cm'}})},
()=>{const n=R(3,7);const t=R(0,2);const v=[12*(n-2),6*(n-2)*(n-2),(n-2)*(n-2)*(n-2)][t];const nm=['đúng 2 mặt','đúng 1 mặt','không có mặt nào'][t];return QN(`Một hình lập phương cạnh ${n} cm được sơn kín 6 mặt, rồi cắt thành các hình lập phương nhỏ cạnh 1 cm. Có bao nhiêu hình lập phương nhỏ được sơn ${nm}?`,v,`Khối 2 mặt sơn nằm trên 12 cạnh (trừ đỉnh): 12 × ${n-2}. Khối 1 mặt nằm giữa 6 mặt: 6 × ${n-2} × ${n-2}. Khối không sơn nằm bên trong: ${n-2} × ${n-2} × ${n-2}. Đáp số: ${v}.`,{unit:'hình',hint:'Khối ở đỉnh, ở cạnh, ở mặt, ở trong có mấy mặt sơn?',fig:{t:'cubepaint',n}})},
()=>{const a=R(2,12);return QN(`Một hình lập phương có diện tích toàn phần là ${6*a*a} cm². Tính thể tích hình lập phương đó.`,a*a*a,`Diện tích một mặt: ${6*a*a} : 6 = ${a*a} (cm²) = ${a} × ${a}. Cạnh ${a} cm. V = ${a} × ${a} × ${a} = ${a*a*a} (cm³).`,{unit:'cm³'})}]}
},
/* ---------- 9 ---------- */
{id:'m9',name:'Thời gian, vận tốc, chuyển động đều',sgk:'Chủ đề 10 · Bài 56–62',hk:2,
theory:{
tom:['Vận tốc là quãng đường đi được trong một đơn vị thời gian (km/giờ, m/phút, m/giây).','Chuyển động đều: vận tốc không đổi trên cả quãng đường.','Cộng, trừ số đo thời gian: đặt thẳng cột theo đơn vị; nếu phút ≥ 60 thì đổi ra giờ.'],
nho:['v = s : t','s = v × t','t = s : v','1 giờ = 60 phút; 1 phút = 60 giây; 1 ngày = 24 giờ','Ngược chiều gặp nhau: t = s : (v₁ + v₂)','Cùng chiều đuổi kịp: t = khoảng cách : (v₁ − v₂)'],
luu:['Đơn vị phải khớp: km/giờ đi với km và giờ.','2 giờ 15 phút = 2,25 giờ (không phải 2,15 giờ) vì 15 phút = '+F(15,60)+' giờ = 0,25 giờ.','Thời gian đi = giờ đến − giờ đi − thời gian nghỉ.'],
nghi:['Gạch chân ba đại lượng s, v, t; biết hai tìm cái thứ ba.','Đổi thời gian ra số thập phân của giờ trước khi tính.','Bài hai vật chuyển động: vẽ sơ đồ và mũi tên hướng đi.'],
vd:{de:'Một ô tô đi quãng đường 135 km hết 2 giờ 30 phút. Tính vận tốc ô tô.',giai:'2 giờ 30 phút = 2,5 giờ. v = 135 : 2,5 = 54 (km/giờ).'},
dat:['Đổi, cộng, trừ, nhân, chia số đo thời gian.','Tính vận tốc, quãng đường, thời gian của chuyển động đều.','Giải bài toán có giờ khởi hành, giờ đến, thời gian nghỉ.'],
mo2:['Hai chuyển động ngược chiều gặp nhau.','Tính giờ đến khi biết giờ khởi hành và thời gian đi.'],
mo3:['Đuổi kịp khi xuất phát không cùng lúc.','Chuyển động trên dòng nước: v xuôi = v thuyền + v nước; v ngược = v thuyền − v nước; v nước = (v xuôi − v ngược) : 2.','Đoàn tàu qua cầu: quãng đường = chiều dài tàu + chiều dài cầu.']},
gen:{
1:[()=>{const t=pick([1.5,2,2.5,3,1.25,0.5,4]);const v=R(8,60);return QN(`Một người đi xe máy được ${fmt(v*t)} km trong ${fmt(t)} giờ. Tính vận tốc.`,v,`v = s : t = ${fmt(v*t)} : ${fmt(t)} = ${v} (km/giờ).`,{unit:'km/giờ',hint:'v = s : t'})},
()=>{const t=pick([1.5,2,2.5,3,1.25,0.75,3.5]);const v=R(10,60);return QN(`Một ô tô đi với vận tốc ${v} km/giờ trong ${fmt(t)} giờ. Tính quãng đường ô tô đi được.`,v*t,`s = v × t = ${v} × ${fmt(t)} = ${fmt(v*t)} (km).`,{unit:'km',hint:'s = v × t'})},
()=>{const t=pick([1.5,2,2.5,3,1.25,4]);const v=R(10,50);return QN(`Một ca nô đi quãng đường ${fmt(v*t)} km với vận tốc ${v} km/giờ. Tính thời gian ca nô đi.`,t,`t = s : v = ${fmt(v*t)} : ${v} = ${fmt(t)} (giờ).`,{unit:'giờ',hint:'t = s : v'})},
()=>{const h=R(1,5),m=pick([6,12,15,18,24,30,36,42,45,48,54]);if(Math.random()<.5)return QN(`${HM(h,m)} = … giờ`,h+m/60,`${m} phút = ${F(m,60)} giờ = ${fmt(m/60)} giờ. Vậy ${HM(h,m)} = ${fmt(h+m/60)} giờ.`,{unit:'giờ',hint:'Chia số phút cho 60.'});return QN(`${fmt(h+m/60)} giờ = … phút`,h*60+m,`${fmt(h+m/60)} × 60 = ${h*60+m} (phút).`,{unit:'phút'})},
()=>{const h1=R(1,8),m1=R(5,55),h2=R(1,5),m2=R(5,55);let H=h1+h2,M=m1+m2;if(M>=60){H++;M-=60}return QM(`Tính: ${HM(h1,m1)} + ${HM(h2,m2)}`,[`${HM(H,M)}`,`${HM(h1+h2,m1+m2)}`,`${HM(H,M+10)}`,`${HM(H+1,M)}`].filter((v,i,a)=>a.indexOf(v)===i),0,`Cộng giờ với giờ, phút với phút: ${HM(h1+h2,m1+m2)}${m1+m2>=60?` = ${HM(H,M)} (vì ${m1+m2} phút = 1 giờ ${M} phút)`:''}.`)}],
2:[()=>{const sh=R(6,9),sm=pick([0,15,30,45]);const rest=pick([0,15,30]);const t=pick([1.5,2,2.5,3]);const v=R(30,50);const tot=sh*60+sm+t*60+rest;const eh=Math.floor(tot/60),em=tot%60;return QN(`Một ô tô đi từ A lúc ${HM(sh,sm)} và đến B lúc ${HM(eh,em)}${rest?`, dọc đường nghỉ ${rest} phút`:''}. Biết quãng đường AB dài ${fmt(v*t)} km. Tính vận tốc ô tô.`,v,`Thời gian đi: ${HM(eh,em)} − ${HM(sh,sm)}${rest?` − ${rest} phút`:''} = ${fmt(t)} giờ. v = ${fmt(v*t)} : ${fmt(t)} = ${v} (km/giờ).`,{unit:'km/giờ',hint:'Trừ thời gian nghỉ ra.'})},
()=>{const v1=R(30,50),v2=R(30,60);const t=pick([1,1.5,2,2.5,3]);const s=(v1+v2)*t;return QN(`Hai ô tô xuất phát cùng lúc từ hai đầu quãng đường dài ${fmt(s)} km, đi ngược chiều nhau. Vận tốc hai xe là ${v1} km/giờ và ${v2} km/giờ. Sau bao lâu hai xe gặp nhau?`,t,`Mỗi giờ hai xe gần nhau: ${v1} + ${v2} = ${v1+v2} (km). Thời gian: ${fmt(s)} : ${v1+v2} = ${fmt(t)} (giờ).`,{unit:'giờ',hint:'Tổng vận tốc.',fig:{t:'meet',v1,v2,s}})},
()=>{const sh=R(6,10),sm=pick([0,15,30,45]);const v=R(30,60);const t=pick([1.5,2.25,2.5,1.75]);const tot=sh*60+sm+t*60;return QM(`Một xe khách đi từ A lúc ${HM(sh,sm)} với vận tốc ${v} km/giờ, quãng đường AB dài ${fmt(v*t)} km. Xe đến B lúc mấy giờ?`,[`${HM(Math.floor(tot/60),tot%60)}`,`${HM(Math.floor(tot/60)+1,tot%60)}`,`${HM(Math.floor((tot-30)/60),(tot-30)%60)}`,`${HM(Math.floor((tot+15)/60),(tot+15)%60)}`],0,`Thời gian đi: ${fmt(v*t)} : ${v} = ${fmt(t)} giờ = ${HM(Math.floor(t),(t%1)*60)}. Đến B lúc: ${HM(Math.floor(tot/60),tot%60)}.`)}],
3:[()=>{const v1=R(30,40),v2=v1+R(10,25);const d=pick([0.5,1,1.5]);const gap=v1*d;const t=gap/(v2-v1);if(!Number.isInteger(t*4))return MATH[8].gen[3][0]();return QN(`Một xe máy đi từ A với vận tốc ${v1} km/giờ. Sau ${fmt(d)} giờ, một ô tô đi từ A đuổi theo với vận tốc ${v2} km/giờ. Hỏi sau bao lâu kể từ lúc ô tô xuất phát thì ô tô đuổi kịp xe máy?`,t,`Khi ô tô xuất phát, xe máy đã đi: ${v1} × ${fmt(d)} = ${fmt(gap)} (km). Mỗi giờ ô tô gần xe máy thêm: ${v2} − ${v1} = ${v2-v1} (km). Thời gian: ${fmt(gap)} : ${v2-v1} = ${fmt(t)} (giờ).`,{unit:'giờ',hint:'Hiệu vận tốc.',fig:{t:'chase',v1,v2,gap}})},
()=>{const vn=R(2,5);let v,s,t1,t2;do{v=R(vn+6,vn+20);const L=lcm(v+vn,v-vn);s=L;t1=s/(v+vn);t2=s/(v-vn)}while(s>200);return QN(`Một ca nô xuôi dòng từ A đến B hết ${t1} giờ và ngược dòng từ B về A hết ${t2} giờ. Quãng sông AB dài ${s} km. Tính vận tốc dòng nước.`,vn,`V xuôi: ${s} : ${t1} = ${v+vn} (km/giờ). V ngược: ${s} : ${t2} = ${v-vn} (km/giờ). V nước = (${v+vn} − ${v-vn}) : 2 = ${vn} (km/giờ).`,{unit:'km/giờ',hint:'Hiệu hai vận tốc bằng 2 lần vận tốc dòng nước.'})},
()=>{const v=R(10,20);const t=R(15,60);const tot=v*t;const Lt=R(8,20)*10;const Lc=tot-Lt;if(Lc<50)return MATH[8].gen[3][2]();return QN(`Một đoàn tàu dài ${Lt} m chạy qua một cây cầu dài ${Lc} m với vận tốc ${v} m/giây. Hỏi từ lúc đầu tàu bắt đầu lên cầu đến khi toa cuối rời khỏi cầu mất bao nhiêu giây?`,t,`Quãng đường tàu phải đi: ${Lc} + ${Lt} = ${tot} (m). Thời gian: ${tot} : ${v} = ${t} (giây).`,{unit:'giây',hint:'Toa cuối rời cầu thì đầu tàu đã đi quá cầu một đoạn bằng chiều dài tàu.',fig:{t:'train',Lt,Lc}})},
()=>{const v1=R(4,6),v2=R(10,15);const s=(v1+v2)*R(2,4);const t=s/(v1+v2);return QN(`Lúc 7 giờ, An đi bộ từ nhà với vận tốc ${v1} km/giờ, cùng lúc đó bố đi xe đạp từ xã bên cách nhà ${s} km đi về phía An với vận tốc ${v2} km/giờ. Hai người gặp nhau cách nhà An bao nhiêu ki-lô-mét?`,v1*t,`Thời gian để gặp nhau: ${s} : (${v1} + ${v2}) = ${t} (giờ). An đã đi: ${v1} × ${t} = ${v1*t} (km).`,{unit:'km'})}]}

{id:'m10',name:'Thống kê và xác suất',sgk:'Chủ đề 11 · Bài 63–67',hk:2,
theory:{
tom:['Thu thập, phân loại, sắp xếp số liệu vào bảng.','<b>Biểu đồ hình quạt tròn</b> biểu diễn các phần của một tổng thể (cả hình tròn là 100%).','<b>Tỉ số số lần lặp lại</b> của một sự kiện so với tổng số lần thử: ví dụ tung đồng xu 20 lần, mặt sấp xuất hiện 9 lần thì tỉ số là '+F(9,20)+'.'],
nho:['Số lượng một phần = Tổng × phần trăm : 100','Các phần trong biểu đồ quạt cộng lại bằng 100%','Trung bình cộng = Tổng các số : số các số'],
luu:['Đọc kĩ chú thích màu trên biểu đồ.','Tỉ số lặp lại phụ thuộc vào lần thử thực tế, không phải lúc nào cũng bằng '+F(1,2)+'.'],
nghi:['Xác định “cả” (100%) trong biểu đồ là bao nhiêu.','Tìm phần còn thiếu = 100% − các phần đã biết.'],
vd:{de:'Lớp có 40 học sinh. Biểu đồ quạt cho thấy 35% học sinh thích bóng đá. Có bao nhiêu học sinh thích bóng đá?',giai:'40 × 35 : 100 = 14 (học sinh).'},
dat:['Đọc, mô tả số liệu trong bảng và biểu đồ hình quạt tròn.','Tính số lượng từ phần trăm trên biểu đồ.','Tính tỉ số số lần xuất hiện của một sự kiện.'],
mo2:['Tìm phần trăm còn thiếu trên biểu đồ.','Trung bình cộng khi thêm một số.'],
mo3:['Trung bình cộng ẩn: biết TB trước và sau khi bỏ (hoặc thêm) một số → tìm số đó.']},
gen:{
1:[()=>{const N=R(2,10)*20;const p=pick([5,10,15,20,25,30,35,40,45,50]);return QN(`Một trường có ${N} học sinh khối 5. Biểu đồ hình quạt cho thấy ${p}% số học sinh thích môn Toán. Có bao nhiêu học sinh thích môn Toán?`,N*p/100,`${N} × ${p} : 100 = ${N*p/100} (học sinh).`,{unit:'học sinh'})},
()=>{const n=pick([10,20,25,30,40,50]);const k=R(Math.floor(n/4),Math.ceil(n*3/4));return QF(`Bạn Minh tung một đồng xu ${n} lần, thấy mặt sấp xuất hiện ${k} lần. Viết tỉ số của số lần xuất hiện mặt sấp và tổng số lần tung.`,k,n,`Tỉ số là ${F(k,n)}${gcd(k,n)>1?' = '+F(k/gcd(k,n),n/gcd(k,n)):''}.`)},
()=>{const c=pick([2,4,5]);const arr=Array.from({length:c},()=>R(10,60));const s=arr.reduce((a,b)=>a+b,0);return QN(`Tìm trung bình cộng của các số: ${arr.join('; ')}.`,s/c,`Tổng: ${s}. Trung bình cộng: ${s} : ${c} = ${fmt(s/c)}.`)}],
2:[()=>{const p1=R(2,6)*5,p2=R(2,6)*5,p3=R(2,5)*5;const p4=100-p1-p2-p3;const N=R(2,8)*20;return QN(`Biểu đồ hình quạt về môn thể thao yêu thích của ${N} học sinh: Bóng đá ${p1}%, Cầu lông ${p2}%, Bơi ${p3}%, còn lại là Cờ vua. Có bao nhiêu học sinh thích Cờ vua?`,N*p4/100,`Cờ vua chiếm: 100% − ${p1}% − ${p2}% − ${p3}% = ${p4}%. Số học sinh: ${N} × ${p4} : 100 = ${fmt(N*p4/100)}.`,{unit:'học sinh',hint:'Cả hình tròn là 100%.',fig:{t:'pie',parts:[p1,p2,p3,p4],labels:['Bóng đá','Cầu lông','Bơi','Cờ vua']}})},
()=>{const X=R(10,40),Y=R(10,60);return QN(`Trung bình cộng của 4 số là ${X}. Nếu viết thêm số ${Y} thì trung bình cộng của 5 số là bao nhiêu?`,(4*X+Y)/5,`Tổng 4 số: ${X} × 4 = ${4*X}. Tổng 5 số: ${4*X} + ${Y} = ${4*X+Y}. TB cộng: ${4*X+Y} : 5 = ${fmt((4*X+Y)/5)}.`,{hint:'Tổng = trung bình cộng × số các số.'})}],
3:[()=>{const n=5;const X=R(15,40);const drop=R(5,60);const Y=(n*X-drop)/(n-1);if(!Number.isInteger(Y*4))return MATH[9].gen[3][0]();return QN(`Trung bình cộng của 5 số là ${X}. Nếu bỏ đi một số thì trung bình cộng của 4 số còn lại là ${fmt(Y)}. Tìm số bị bỏ đi.`,drop,`Tổng 5 số: ${X} × 5 = ${5*X}. Tổng 4 số: ${fmt(Y)} × 4 = ${fmt(4*Y)}. Số bị bỏ: ${5*X} − ${fmt(4*Y)} = ${drop}.`,{hint:'Tính tổng trước và tổng sau.'})},
()=>{const k=pick([2,3,4]);const A=pick([7,7.5,8,8.5]);const B=rnd(A+pick([0.25,0.5]),2);const need=rnd(B*(k+1)-A*k,2);if(need>10||need<0)return MATH[9].gen[3][1]();return QN(`Điểm trung bình ${k} bài kiểm tra của Lan là ${fmt(A)}. Bài thứ ${k+1} Lan phải được bao nhiêu điểm để điểm trung bình ${k+1} bài là ${fmt(B)}?`,need,`Tổng ${k} bài: ${fmt(A)} × ${k} = ${fmt(A*k)}. Tổng ${k+1} bài cần có: ${fmt(B)} × ${k+1} = ${fmt(B*(k+1))}. Bài thứ ${k+1}: ${fmt(B*(k+1))} − ${fmt(A*k)} = ${fmt(need)} (điểm).`,{unit:'điểm'})}]}

<script>
